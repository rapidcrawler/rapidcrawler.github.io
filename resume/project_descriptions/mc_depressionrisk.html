03cbutton class=\"bookmark\" aria-label=\"Bookmark Provenance and scope\" data-bookmark=\"Provenance and scope\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eProvenance and scope\u003c/h3\u003e\u003cul\u003e\u003cli\u003eSource: mc_depressionrisk_service.md; as of 1 October 2026.\u003c/li\u003e\u003cli\u003eIntroduction covers the adapter, orchestrator and UI. Later sections focus on DSAIL PROD hosting.\u003c/li\u003e\u003cli\u003eOnly the README was supplied; repository links, linked docs, trained artifacts, model card and deployment notebooks were not inspected.\u003c/li\u003e\u003cli\u003eDocumented defaults are separated from proposed fixes and synthetic experiments.\u003c/li\u003e\u003cli\u003eThis standalone guide never sends resident data, tokens, notes or lab inputs to a service.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Project Introduction\"\u003eSource · Project Introduction ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Source inconsistencies to verify\" data-bookmark=\"Source inconsistencies to verify\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eSource inconsistencies to verify\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTopic\u003c/th\u003e\u003cth\u003eConflict /limitation\u003c/th\u003e\u003cth\u003eCareful interpretation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eRemote vsdirect\u003c/td\u003e\u003ctd\u003eAdapter calls DSAIL; model has no external inference call\u003c/td\u003e\u003ctd\u003eScope every statement to service owner\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWorkers/concurrency\u003c/td\u003e\u003ctd\u003e7 command,10 env, summaries 10 workers, total 70/280\u003c/td\u003e\u003ctd\u003e28 processes at 4×7; actual capacity TBD\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eErrors\u003c/td\u003e\u003ctd\u003eGeneric diagram 400/422; verified text 200+500 envelope\u003c/td\u003e\u003ctd\u003eUse verified contract; check deployed PROD\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSuccess wrapping\u003c/td\u003e\u003ctd\u003eSequence wraps; verified text rawdetailsJSON\u003c/td\u003e\u003ctd\u003ePrefer explicit verified success shape\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBranch scope\u003c/td\u003e\u003ctd\u003ePROD doc uses main-copy contract verification\u003c/td\u003e\u003ctd\u003eConfirm deploy image/source identity\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModel age\u003c/td\u003e\u003ctd\u003e“About 2 years” vs 2023-12-05 date at 2026-10-01\u003c/td\u003e\u003ctd\u003e≈2 years 10 months; actual training date unknown\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerformance\u003c/td\u003e\u003ctd\u003e50–200 ms, SHAP\u0026lt;100 ms, estimated 2000+RPS\u003c/td\u003e\u003ctd\u003eNo benchmark methodology or validated SLO\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSLA\u003c/td\u003e\u003ctd\u003eBranch table “production-grade”; introduction SLA TBD\u003c/td\u003e\u003ctd\u003eDo not claim an agreed SLA\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCapture scope\u003c/td\u003e\u003ctd\u003e“All requests/responses”; trigger successful prediction\u003c/td\u003e\u003ctd\u003eError capture/durability TBD\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGraph count\u003c/td\u003e\u003ctd\u003eResident\u0026gt;3; GRAPH_ANSWERS5\u003c/td\u003e\u003ctd\u003eComparator/intended view definition TBD\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTraining\u003c/td\u003e\u003ctd\u003eTree mentions notebooks/workflows; explicit text no training code\u003c/td\u003e\u003ctd\u003eTraining ownership/evidence remain external\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eInput domains\u003c/td\u003e\u003ctd\u003eGeneric schemas PHQ/BIMS/vitals vsadapter diag/med/POC\u003c/td\u003e\u003ctd\u003eSeparate accepted model schema from current sent features\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eActive diagnosis\u003c/td\u003e\u003ctd\u003eDisplayed F30–F39 separate from seven categories\u003c/td\u003e\u003ctd\u003eDo not add an eighth counted factor\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWeights\u003c/td\u003e\u003ctd\u003e\u0026gt;3 lb rule lacks direction/time/unit detail\u003c/td\u003e\u003ctd\u003eWeight lab’s absolute magnitude is a teaching assumption\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-top\"\u003e\u003ch3\u003eFull source · 1,158 lines\u003c/h3\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"source-expand\"\u003eExpand sections\u003c/button\u003e\u003cbutton id=\"source-collapse\"\u003eCollapse sections\u003c/button\u003e\u003cbutton id=\"download-source\"\u003eDownload original README\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cinput id=\"source-search\" type=\"search\" placeholder=\"Filter README sections…\" aria-label=\"Filter README sections\"\u003e\u003cdiv id=\"source-index\"\u003e\u003c/div\u003e\u003cdiv id=\"source-sections\"\u003e\u003c/div\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Glossary\" data-bookmark=\"Glossary\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eGlossary\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTerm\u003c/th\u003e\u003cth\u003eMeaning\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDSAIL /IHS\u003c/td\u003e\u003ctd\u003eModel team /hosting platform\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCatBoost\u003c/td\u003e\u003ctd\u003eGradient-boosted tree classifier\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePHQ-2-to-9\u003c/td\u003e\u003ctd\u003eMDS SectionD depression screen; documented factor\u0026gt;9\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBIMS\u003c/td\u003e\u003ctd\u003eMDS SectionC cognitive screen; display-only\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eADL /POC\u003c/td\u003e\u003ctd\u003eDaily-living /point-of-care documentation\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePRN\u003c/td\u003e\u003ctd\u003eAs-needed medication schedule\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSHAP\u003c/td\u003e\u003ctd\u003eFeature attribution, not causal evidence\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKnown risks\u003c/td\u003e\u003ctd\u003eUpstream pain/mood/psychotropic findings\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMultiple Depression Factors\u003c/td\u003e\u003ctd\u003eMore than 3 of 7 distinct categories\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOAuth2 client credentials\u003c/td\u003e\u003ctd\u003eMachine-client token flow to Cognito\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJWT client_id\u003c/td\u003e\u003ctd\u003eClaim used by DSAIL gateway authorization\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTTL\u003c/td\u003e\u003ctd\u003eTime-based cache expiry; absent today\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFQN\u003c/td\u003e\u003ctd\u003eFully qualified registry/workspace identity\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCapture\u003c/td\u003e\u003ctd\u003eAsynchronous warehouse request/response logging\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Glossary\"\u003eSource · Glossary ↗\u003c/button\u003e\u003c/article\u003e"}, "questions": [{"category": "Architecture", "title": "Explain the Depression Risk capability end to end.", "answer": "Fall/Clinical Risk run first and publish outputs. The Depression adapter consumes known risks, builds features, checks a Postgres cache and calls the DSAIL CatBoost model on misses. It filters returned SHAP, adds rules and flags more than three of seven categories. The UI does not display raw probability.", "follow": "Where are the ownership and PHI boundaries?", "ref": "How It Works"}, {"category": "Architecture", "title": "Why does Depression run last?", "answer": "It reuses pain, mood/behaviour and psychotropic findings from Fall/Clinical Risk as known_risks. Upstream outputs are already published, so downstream failure leaves them available while Depression factors remain stale.", "follow": "How would you measure total latency?", "ref": "Integration Architecture"}, {"category": "Architecture", "title": "Where is inference remote and where is it local?", "answer": "Remote from the EHR adapter to IHS/DSAIL over HTTPS and OAuth2. Local inside DSAIL: loaded CatBoost and SHAP produce predictions in-process. Avoid a blanket no-external-calls statement for the whole capability.", "follow": "Which service uses Postgres?", "ref": "Direct Model Inference (No External Calls)"}, {"category": "Architecture", "title": "Who owns the model versus the clinician experience?", "answer": "DSAIL owns training, quality, retraining, monitoring and endpoint uptime. RCS EHR CAI owns features/integration, cache, filtered factors, clinical rules and the flag/UI experience. Copying source into the monorepo does not automatically transfer those obligations.", "follow": "What should an inter-team SLA cover?", "ref": "Components and Ownership"}, {"category": "Architecture", "title": "What does the orchestrator publish if DSAIL is down?", "answer": "Fall/Clinical outputs are published first. The active Depression call fails for its batch with no retry; Depression remains stale until a successful run. A cached response can avoid a call on a hit, but stale-on-error fallback is not documented.", "follow": "How would you represent degraded freshness to consumers?", "ref": "FAQ"}, {"category": "Architecture", "title": "What is the strongest architectural lesson?", "answer": "A model can be an evidence selector inside a broader decision policy. The raw classifier probability is not the displayed flag. Validate the actual consumer transformation and product outcome, not just the hosted model.", "follow": "What exactly are the two ML-driven categories?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "Architecture", "title": "What source-code locations matter most?", "answer": "ml_factor.py owns score scaling and SHAP selection; other_factors.py owns PHQ/BIMS/weight/active diagnosis; ihs_call.py owns the remote call. DSAIL app.py handles requests, entry_point orchestrates model work, preprocess transforms features and data_capture schedules warehouse writes.", "follow": "Which layer should detect an HTTP 200 error envelope?", "ref": "Detailed Execution Sequence (PROD Service)"}, {"category": "Factor logic", "title": "What makes a resident have Multiple Depression Factors?", "answer": "More than three distinct categories of seven: mood/behaviour, psychotropic meds, pain, ML-selected diagnosis, ML-selected ADLs, weight change and PHQ\u003e9. Minimum count is four. Probability is not used by that rule.", "follow": "Do five selected diagnoses count five times? No.", "ref": "How It Works"}, {"category": "Factor logic", "title": "Which factors are display-only or separately documented?", "answer": "BIMS is displayed and not counted. Active F30–F39 mood diagnosis is separately displayed clinical evidence; the explicit seven-factor table has no eighth category for it. Verify mapping before claiming how it may overlap a counted category.", "follow": "Why should category deduplication be tested?", "ref": "How It Works"}, {"category": "Factor logic", "title": "What are the three different risk values?", "answer": "DSAIL score is probability 0–1 rounded four decimals. The adapter group risk_score is score×100. resident_overall_risk_score is 0.0. The UI resident flag is a seven-category count, not any of those numeric values.", "follow": "What would probability 0.3857 become internally?38.57.", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "Factor logic", "title": "Can low probability still yield model-driven factors?", "answer": "Yes. Eligibility is based on positive feature value and SHAP thresholds, without a probability gate. A low-probability resident may get both ML categories; a high-probability resident may get neither.", "follow": "Would adding a probability gate be a behaviour-preserving change? No.", "ref": "How It Works"}, {"category": "Factor logic", "title": "Why do graph and resident definitions need reconciliation?", "answer": "Resident flag uses\u003e3; GRAPH_ANSWERS uses factor-count 5. Comparator and intended view semantics are not fully documented. Product must decide whether different views are intentional; share constants only after that decision.", "follow": "How would you regression-test dashboard counts?", "ref": "Open Decisions"}, {"category": "Factor logic", "title": "What is the PHQ boundary?", "answer": "Most recent MDS PHQ-2-to-9 score\u003e9 contributes one category, described as moderate or worse. At 9 it does not; at 10 it does. Detailed missing-item and severity-band handling require the rule implementation.", "follow": "Which assessment wins if timestamps tie?", "ref": "How It Works"}, {"category": "Factor logic", "title": "Explain the weight-change rule carefully.", "answer": "The source says more than 3 lb between the last two weights. Exactly 3 lb is below the strict threshold. It does not specify signed vs absolute difference, measurement interval or conversions; verify other_factors.py before asserting more.", "follow": "What if measurements are in different units?", "ref": "How It Works"}, {"category": "Factor logic", "title": "How would you validate the final flag?", "answer": "Proposed: agree intended outcome/horizon, collect representative point-in-time factors and future outcomes, compare flag recall/precision/volume with confidence intervals and subgroups. Validate category mapping and upstream known risks as well as the classifier.", "follow": "What would be the reference clinical action?", "ref": "Open Decisions"}, {"category": "SHAP \u0026 features", "title": "What comes back from DSAIL?", "answer": "One probability plus all 1,618 features with values and SHAP, unranked and unfiltered. Missing features have null value and null SHAP. The adapter performs ranking, domain translation and top-five selection.", "follow": "Where does human-readable mapping occur?", "ref": "Output Schema"}, {"category": "SHAP \u0026 features", "title": "What are the exact ADL filters?", "answer": "Feature name is an ADL/POC what_is_* or how_did_* domain, feature_value\u003e0, shap_value\u003e0.04 and response is not independent. Sort descending by SHAP and keep at most five. Exactly 0.04 is excluded.", "follow": "What does the configurable threshold change?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "SHAP \u0026 features", "title": "What are the diagnosis filters?", "answer": "icd10_* feature with value\u003e0 and SHAP\u003e0.0, sorted descending with at most five. Exactly zero is excluded. Multiple retained features still form one counted category.", "follow": "How are feature names converted to clinical diagnoses?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "SHAP \u0026 features", "title": "Which model attributions are never surfaced?", "answer": "Negative/protective SHAP, medication-class SHAP and historyof are not displayed by the adapter. Independent ADL responses are excluded even if positive. This is curated evidence rather than the complete model explanation.", "follow": "What explanatory bias can that introduce?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "SHAP \u0026 features", "title": "Can you sum SHAP directly into probability?", "answer": "Not from this README. It does not provide the base value or SHAP output space. Positive means pushing the explained output toward depression; additive reconstruction requires the actual explainer configuration.", "follow": "Why may 0.04 change meaning after retraining?", "ref": "SHAP-based Explainability"}, {"category": "SHAP \u0026 features", "title": "Is positive SHAP causal clinical evidence?", "answer": "No. It attributes the model output given its background and features. It does not establish that a diagnosis causes depression or changing an ADL will prevent it. Clinical validation and intended-use wording remain separate.", "follow": "How would you explain this limitation to a clinician?", "ref": "SHAP-based Explainability"}, {"category": "SHAP \u0026 features", "title": "Which inputs does the adapter engineer?", "answer": "Active ICD-10 categories, with F32/F33 excluded except history;30-day medication-class counts with scheduled/PRN distinction;30-day ADL/bowel-bladder response counts. Generic model schema examples do not prove the current adapter sends all listed vitals/assessments.", "follow": "Where can training/serving mismatch arise?", "ref": "How It Works"}, {"category": "SHAP \u0026 features", "title": "Why exclude F32/F33 except as history?", "answer": "That exclusion is documented in the adapter input design. The README does not provide a validated rationale. It may concern outcome leakage, but present that as a hypothesis and request the model label definition/training evidence before asserting it.", "follow": "How would you audit label leakage?", "ref": "How It Works"}, {"category": "SHAP \u0026 features", "title": "How are absent features handled?", "answer": "Model preprocessing fills absent inputs with None and aligns against model.feature_names_. CatBoost is described as handling missing natively. Returned absent values and SHAP are null. Missing differs from known zero; conversion details still need tests.", "follow": "What happens when a count is 0 but SHAP is positive? Filter rejects it.", "ref": "Feature Engineering and Input Transformation"}, {"category": "SHAP \u0026 features", "title": "Why is feature order part of model compatibility?", "answer": "convert_input maps to feature_N, then predict_fn renames/reorders to CatBoost model.feature_names_. A model/explainer/feature-list mismatch can silently corrupt predictions or explanations. Treat them as a compatible release bundle.", "follow": "How would startup assert schema identity?", "ref": "Direct Model Inference (No External Calls)"}, {"category": "SHAP \u0026 features", "title": "How are selected factors dated and named?", "answer": "depression_feature_mapper.pkl translates each retained feature to domain group/type/name/value; latest effective dates are drawn from resident records. Validate mapping and dates separately from SHAP calculation.", "follow": "What if a new model feature lacks a mapper entry?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "Caching \u0026 auth", "title": "How does the current cache decide reuse?", "answer": "With API_IHS_CACHE enabled and a resident row in ihs_response_history, reuse occurs unless medications, POC or diagnoses were modified after the cached run. No TTL, moving-window or model-version check is documented.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Integration Architecture"}, {"category": "Caching \u0026 auth", "title": "Explain the moving-window cache bug.", "answer": "A record ages out of the 30-day count window as calculation time advances even without a source edit. modified_at stays unchanged, so the cached model response can become stale.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Known Risks and Gaps"}, {"category": "Caching \u0026 auth", "title": "What cache key would you propose?", "answer": "Proposed: scope by source/customer/resident and model/schema identity, with a canonical feature fingerprint or explicit calculation-window identity. Store calculated_at and bounded TTL. Define retention separately and stagger model-driven refreshes.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Known Risks and Gaps"}, {"category": "Caching \u0026 auth", "title": "What is retained in the adapter cache?", "answer": "The full DSAIL response per resident, without expiry. Retention, discharge/customer-offboarding purge and globally scoped identity require confirmation. No expiry is both a freshness and privacy concern.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Security and Compliance Considerations"}, {"category": "Caching \u0026 auth", "title": "Does a cache hit recalculate local PHQ and weights?", "answer": "The design separates model-response caching from local rules/known risks, but the README does not conclusively document hit-path recomputation order. Inspect the adapter before claiming it refreshes every local factor.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Integration Architecture"}, {"category": "Caching \u0026 auth", "title": "What OAuth2 pattern is used?", "answer": "OAuth2 client credentials via IHS Cognito. Client ID/secret come from AWS Secrets Manager and URLs from Helm. DSAIL validates JWT/client_id at its gateway. Adapter inbound auth remains absent and is a separate boundary.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Security and Compliance Considerations"}, {"category": "Caching \u0026 auth", "title": "Why is token reuse a concrete improvement?", "answer": "The active path fetches a fresh token per call even though background refresh code exists. Proposed reuse reduces auth work with expiry skew and single-flight refresh, without reusing expired tokens.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Known Risks and Gaps"}, {"category": "Caching \u0026 auth", "title": "Why doesn’t existing retry code make the service resilient?", "answer": "The README says the active call path bypasses existing retry/token helpers. Only code actually on the execution path changes behaviour. Transient downstream errors currently fail the Depression batch.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Known Risks and Gaps"}, {"category": "Caching \u0026 auth", "title": "What should bounded retry consider?", "answer": "Proposed: retry transient 503/timeouts with jitter and budget, refresh once for token expiry, do not blindly retry invalid input. Consider capture duplicates and batch/request identity, observability and latency budget.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Error Handling and Resilience (PROD Service)"}, {"category": "API \u0026 failures", "title": "Why is the route spelled /inferance?", "answer": "That spelling is the documented deployed contract. Preserve it in integration examples; changing it requires compatibility planning or an alias, even if the English spelling is unusual.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "API Endpoints (PROD Deployment)"}, {"category": "API \u0026 failures", "title": "What is the HTTP 200 error-envelope trap?", "answer": "Application errors may be {statusCode:500, body:JSON-string, headers:...} with HTTP 200. The adapter checks transport only, then attempts missing details. Check the application envelope before accessing success fields.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Error Handling and Resilience (PROD Service)"}, {"category": "API \u0026 failures", "title": "What does a successful model response look like?", "answer": "Raw metadata and details[] with entity_id, unique_resident_id, timestamp, score and all unranked factors_considered. The explicit verified contract has no success envelope; generic diagrams conflict. Verify the deployed PROD route.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Output Schema"}, {"category": "API \u0026 failures", "title": "Which failures return 401 or 503?", "answer": "Gateway auth failures, including expired JWT or missing client_id, return 401; service unavailability can return 503. Documented application validation/model failures use HTTP 200 with a statusCode 500 envelope.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Error Handling and Resilience (PROD Service)"}, {"category": "API \u0026 failures", "title": "What request constraints are documented?", "answer": "Required source/data-source/corporate/customer metadata, non-empty details[], and entity_id plus non-empty features[] per resident. Icd10 must be an array; other features numeric or convertible. Confirm exact field types in deployed code.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Input Schema"}, {"category": "API \u0026 failures", "title": "Which response tests are essential?", "answer": "Raw success, HTTP 200 application 500,401,503, invalid JSON, malformed success, null features, complete output, probability rounding and identity metadata. Include adapter filtering and cache-path tests, not just model API tests.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "Testing and Validation"}, {"category": "API \u0026 failures", "title": "Why might a resident have few factors despite high score?", "answer": "The adapter surfaces only qualifying positive diagnosis/ADL attribution with value and threshold checks. Medication/historyof and protective features are not counted. High probability neither forces nor gates those categories.", "follow": "Which code path and contract tests would you inspect to verify this behaviour?", "ref": "How rcs-ehr-cai Consumes the Output"}, {"category": "Operations", "title": "Describe DSAIL artifact loading.", "answer": "TrueFoundry resolves MODEL_FQN and EXPLAINER_FQN into depr_model /depr_explainer directories. Workers load model.pickle, explainer.pickle and the feature list. Registry artifacts are current; S3 migration remains planned.", "follow": "Which bundle compatibility checks should run before readiness?", "ref": "Artifact Registry Integration"}, {"category": "Operations", "title": "What are the resource totals?", "answer": "Adapter requests:6×0.5 CPU /1 GiB =3 CPU /6 GiB; limits 6 CPU /12 GiB. DSAIL requests:4×5 CPU /5000 MB =20 CPU /20000 MB; limits 24 CPU /24000 MB. Preserve memory-unit distinctions.", "follow": "Why should you keep MB and GiB distinct?", "ref": "Production Resource Configuration"}, {"category": "Operations", "title": "How many worker processes are documented?", "answer": "The command specifies seven per replica, so four replicas imply 28 processes. Env 10 and table totals 70/280 conflict. That environment value does not establish an extra concurrency multiplier.", "follow": "What does an environment variable prove about actual process count?", "ref": "Performance and Scalability"}, {"category": "Operations", "title": "Can you quote 2,000 RPS as measured performance?", "answer": "No. Throughput is estimated with inconsistent concurrency arithmetic and no benchmark method. The 50–200 ms/resident and SHAP\u003c100 ms statements are reported estimates, not established SLOs. Measure the full representative path.", "follow": "What batch size and load profile would make a benchmark meaningful?", "ref": "Performance and Scalability"}, {"category": "Operations", "title": "Does DSAIL share models via Gunicorn preload?", "answer": "No such sharing is documented. DSAIL uses Uvicorn multiprocess serving; each worker loads artifacts. Do not transfer Fall Risk copy-on-write claims to this service.", "follow": "How would you distinguish per-worker artifact RAM from request allocations?", "ref": "Startup and Container Lifecycle"}, {"category": "Operations", "title": "What is the supported Python migration story?", "answer": "DSAIL Python 3.9 is pinned to CatBoost 1.2.2 and SHAP 0.43.0 pickles. Python 3.12 likely needs re-export/retrain, compatible explanations and baseline replay. The adapter already uses 3.12.", "follow": "Which outputs must remain invariant for a library-only upgrade?", "ref": "Model Training and Versioning"}, {"category": "Operations", "title": "What health semantics are documented?", "answer": "DSAIL /health returns 200 when up without checking external dependencies. Adapter Helm probes are disabled. Verify model-warmup readiness and actual probe wiring before claiming automated recovery.", "follow": "When should model readiness differ from capture-warehouse health?", "ref": "Startup and Container Lifecycle"}, {"category": "Operations", "title": "How are nonprod environments coupled?", "answer": "Dev, QA and staging share one nonprod DSAIL endpoint. Load or deployments in one environment can interfere with another. Proposed fixes are separate endpoints, quotas and coordinated testing.", "follow": "What isolation or quotas would you negotiate with DSAIL?", "ref": "Integration Architecture"}, {"category": "Operations", "title": "What should rollback restore?", "answer": "Proposed: compatible model, explainer, schema, factor mapping and cache-version behaviour. Endpoint rollback alone can leave new-version cached responses active. Define triggers and verify resident outputs afterward.", "follow": "How would you invalidate newer cached responses after rollback?", "ref": "Open Decisions"}, {"category": "Governance", "title": "What model performance can you state?", "answer": "No quantitative quality metric is supported here. DSAIL population, labels, calibration, AUC and subgroup results are TBD. Explainability and an interpretable count do not prove accuracy.", "follow": "How would you answer “How accurate is it?” without overstating evidence?", "ref": "Model Summary"}, {"category": "Governance", "title": "What model card evidence should you request?", "answer": "Population, dates, sample size, label definition, split/leakage controls, operating-point metrics, calibration, prevalence, subgroup uncertainty, retraining, monitoring, lineage and intended use. Request SLA and data-rights evidence too.", "follow": "What label and prediction horizon would you validate first?", "ref": "Model Summary"}, {"category": "Governance", "title": "Does the model date prove the latest training date?", "answer": "No. Model version 2023-12-05 and deployment v12 are documented, but actual training/retrain date is unknown. At the 1 Oct 2026 snapshot the version date is about 2 years 10 months old; “about 2 years” is approximate.", "follow": "Which artifact metadata would establish the actual training date?", "ref": "Model Summary"}, {"category": "Governance", "title": "Where is PHI stored or transmitted?", "answer": "Linkable resident/source/customer features leave the adapter for DSAIL. Full model responses persist in Postgres without expiry; full requests and responses are captured in Snowflake. Confirm retention and access controls.", "follow": "What happens to resident data after discharge or customer offboarding?", "ref": "Security and Compliance Considerations"}, {"category": "Governance", "title": "Does async capture guarantee an audit record?", "answer": "No. HTTP response completion is decoupled from warehouse completion. Timeout or pod shutdown can leave gaps; durable flush and error capture are not established. Monitor capture completion independently.", "follow": "Would you choose a durable queue or await the write, and why?", "ref": "Monitoring and Troubleshooting"}, {"category": "Governance", "title": "What happens if capture fails while prediction succeeds?", "answer": "Prediction succeeds independently. Warehouse unavailability may retry with backoff, timeout may fail silently and invalid schema needs intervention. These are two separate reliability metrics.", "follow": "Which separate alert measures capture completeness?", "ref": "Asynchronous Request/Response Logging"}, {"category": "Governance", "title": "Does capturing data mean drift monitoring is active?", "answer": "No. Baselines exist in deployment_files, but live alerts are TBD. Storage does not establish outcome-linked evaluation or automated drift response. Confirm monitoring configuration and ownership.", "follow": "How would you join stored predictions to later clinical outcomes?", "ref": "Model Summary"}, {"category": "Governance", "title": "Can you assert a SaMD/CDS classification?", "answer": "No. Regulatory classification and intended-use wording are TBD. The source describes support for screening rather than diagnosis; that is not a confirmed regulatory determination.", "follow": "Which team approves a material model or flag-policy change?", "ref": "Open Decisions"}, {"category": "Governance", "title": "How would you validate a probability-gated alternative?", "answer": "Proposed: obtain calibration evidence, agree a clinical operating point and compare current factors against gated categories/tiers on representative held-out outcomes. Freeze choices before final evaluation; examine subgroups and workload.", "follow": "How would you avoid selecting the probability gate on final test data?", "ref": "Open Decisions"}, {"category": "Behavioural", "title": "Tell an ownership-safe project story.", "answer": "State your actual role in adapter integration, caching, contracts or UX. Add verified PRs, decisions and impact. Do not claim DSAIL training or metrics that were not supplied.", "follow": "What did you personally decide, implement and verify?", "ref": "Components and Ownership"}, {"category": "Behavioural", "title": "What is a defensible improvement story?", "answer": "Use a verified incident or change: error-envelope detection, moving-window cache freshness, token reuse or threshold alignment. Explain trigger, action, trade-off and validated outcome; distinguish proposals from delivered work.", "follow": "What concrete before/after evidence demonstrates your contribution?", "ref": "Known Risks and Gaps"}, {"category": "Behavioural", "title": "How would you explain the feature to a manager?", "answer": "It helps nursing teams identify residents whose multiple indicators warrant screening. ML selects diagnoses and ADL evidence, local/upstream signals complete seven categories, and at least four raise the flag. Quality and freshness need evidence.", "follow": "How would you explain a false flag and the clinician’s next step?", "ref": "Summary"}, {"category": "Behavioural", "title": "What trade-off would you discuss with Product?", "answer": "Whether factor-count UX is intentional and why graph/resident definitions differ. Probability gating is a change in clinical behaviour requiring validation, not a routine cleanup.", "follow": "How would you quantify staff workload versus missed screening?", "ref": "Open Decisions"}, {"category": "Behavioural", "title": "What would you prioritise first?", "answer": "Proposed: clarify deployed contracts and fix error visibility; address cache freshness/token reuse; obtain model and PHI governance evidence; then plan baseline-safe upgrades and product-definition alignment. Prioritise using real incident impact.", "follow": "Which smallest fix addresses the most frequent observed failure?", "ref": "Known Risks and Gaps"}, {"category": "Behavioural", "title": "What needs refreshing before the next interview?", "answer": "Deployed model/runtime, cache policy, token/retry path, flag/graph definitions, model card and quality evidence, latency/cost/uptime, retention/auth/probes, team ownership and your verified personal impact.", "follow": "Where will you obtain the latest authoritative version of each claim?", "ref": "Metrics to Track"}], "incidents": [["HTTP200 but adapter fails parsing details", "Inspect response for statusCode/body application error before assuming success. Surface the DSAIL error description and distinguish401/503. Proposal: envelope-aware contract tests and typed downstream errors."], ["Residents retain old evidence after model update", "Current cache ignores model version and time-window drift. Compare cached calculated_at/model identity with feature inputs. Proposed version-aware keys, fingerprint/TTL and bounded refresh; do not assume redeploying adapter clears Postgres."], ["Cognito/token errors cause batch failure", "Confirm active endpoint and secret/claim configuration, token expiry and current call path. Retry/token-refresh helpers exist but are unused. Proposed bounded401refresh and token reuse with expiry skew."], ["Depression stale but Fall/Clinical results are current", "Those outputs publish first. Investigate downstream DSAIL latency/failure and active no-retry path, plus cache hit/miss. Define freshness/degraded status rather than silently claiming new Depression results."], ["Model startup fails", "Check MODEL_FQN/EXPLAINER_FQN, resolved directories, artifact existence and pinned dependency compatibility. Confirm model/explainer/feature schema bundle; do not load untrusted pickle files."], ["Prediction succeeds but capture row is absent", "Async completion is separate from inference success. Check DATA_CAPTURE/table schema, warehouse reachability, task errors and pod lifecycle. /dc-table can create/verify table; durable capture/flush requires confirmation."], ["High latency or OOM", "Profile preprocessing,1,618-feature SHAP/response payload, per-worker artifact loads, batch size and saturation. Verify7vs10worker wiring. Measure before changing replicas/memory;2,000RPS is an estimate."], ["Dashboard trend counts differ from resident flags", "Resident rule is\u003e3 categories while GRAPH_ANSWERS uses5. Confirm intended comparator and view policy with Product before consolidating constants."], ["Nonprod tests interfere with each other", "Dev,QA and staging share an endpoint. Correlate load/releases, agree quotas or isolated endpoints and a shared incident owner."]], "checklist": ["Explain the adapter/model boundary and ownership", "List the seven categories and the strict\u003e3 rule", "Explain probability, risk_score and overall score separately", "Apply strict SHAP thresholds and top-five category deduplication", "Explain moving-window/model-version cache staleness", "Recognise HTTP 200 application errors", "Describe OAuth2 token path and missing active retry", "Quote resource totals without invented concurrency/capacity", "Describe PHI capture, retention and missing model evidence", "Refresh source facts and export verified ownership notes"], "pitches": {"30": "This capability helps nursing teams identify residents with multiple depression indicators between formal assessments. An EHR adapter calls a DSAIL CatBoost model, uses SHAP to select relevant diagnoses and ADL patterns, then combines clinical rules and upstream risks. Four of seven categories raise the flag; raw probability does not. Key engineering issues are cache freshness, external-call resilience, error envelopes and model-governance evidence.", "90": "There are two distinct services. The RCS EHR adapter builds thirty-day diagnosis, medication and ADL features, checks a Postgres response cache and calls the DSAIL-hosted CatBoost model over OAuth2 on a miss. DSAIL performs local inference and returns a probability plus all 1,618 feature attributions.\n\nThe adapter selects up to five positive-SHAP diagnoses and five ADL patterns, adds PHQ and weight-change rules and uses pain, mood and psychotropic findings from Fall/Clinical Risk. A resident is flagged when more than three of seven distinct categories are present. The probability is not displayed and does not drive that flag.\n\nThe important trade-offs are product-level validation and integration correctness: the cache ignores time-window and model-version changes, the active path has no retry or token reuse, and application errors can arrive with HTTP 200. Model quality evidence is external and not supplied here. Add your actual ownership and verified impact.", "180": "Problem: the feature supports continuous depression surveillance between MDS assessments, prompting screening and care-plan review rather than making a diagnosis. Explain why evidence, freshness and staff workload matter.\n\nArchitecture: Fall and Clinical Risk run first, publish results and pass known_risks to Depression. The adapter builds diagnosis categories, thirty-day medication-class counts and ADL/POC counts. It bulk-looks up per-resident responses in Postgres; on a miss or newer source changes it gets a Cognito token and calls DSAIL /inferance. DSAIL is a separate Python 3.9 FastAPI/CatBoost service that loads registry artifacts, runs direct inference and SHAP, and schedules full request/response capture to Snowflake.\n\nConsumer behaviour: the model returns a probability and all 1,618 unranked attributions. The adapter keeps positive-value diagnoses with SHAP\u003e0 and ADLs with SHAP\u003e0.04, excluding independent responses, sorted to top five per category. Those become only two of seven counted categories. Local PHQ\u003e9 and weight-change rules plus upstream pain/mood/psychotropic categories complete the flag. More than three categories means Yes. BIMS is displayed, not counted; model probability is carried internally.\n\nCorrectness and reliability: caching is source-change-only and not version-aware, so thirty-day features can drift without an edit. The active call path fetches a token per call and bypasses retry helpers. HTTP 200 may carry a statusCode 500 error envelope, so transport-only checking produces opaque parsing failures. Full capture and indefinite response retention create explicit privacy/governance obligations.\n\nValidation and modernisation: no model-card accuracy or calibration evidence is supplied. Request population/labels, operating-point metrics, subgroups, retraining and SLA. Validate the final flag as well as the classifier. A supported-runtime/S3 migration needs compatible model/explainer/schema/mapping, baseline comparisons, version-aware cache and a rollback plan. Do not claim estimated throughput or inconsistent worker arithmetic as measured capacity.\n\nYour role: close with verified responsibilities, one decision or incident you owned, actual measured results and what you learned. Separate proposed improvements from implemented achievements."}, "source": "# Depression Risk Service Documentation (DSAIL PROD Deployment)\n\n\u003e **Repository:** [`dsail-depression-risk`](https://github.com/resmed/dsail-depression-risk) (prod branch); mirrored in this monorepo on `main` at `services/ml_services/dsail-depression-risk/` · **Deployment:** TrueFoundry · **Framework:** FastAPI · **Python 3.9** · **ML Model:** CatBoost gradient-boosted trees (model version `2023-12-05`), artifact-registered · **Data Capture:** Enabled\n\n## Project Introduction\n\n\u003e **Scope:**\n\u003e - `services/ml_services/depression_risk` — the rcs-ehr-cai adapter service;\n\u003e - the DSAIL model service (`dsail-depression-risk`, mirrored at `services/ml_services/dsail-depression-risk/` on `main`);\n\u003e - `ml_orchestrator` (caller);\n\u003e - `clinical_backend` / `intelligent-ui` (presentation);\n\u003e - `helm-values/depression_risk`.\n\u003e\n\u003e **As of:** 2026-10-01. Facts come from repository code and configuration. Items marked **[TBD]** are not available in the repository.\n\n### Summary\n\n- **What it is:** A capability that helps nursing staff identify residents who may be developing **depression**, so screening and intervention can happen earlier. It produces a resident-level **\"Multiple Depression Factors\"** flag with supporting evidence: pertinent diagnoses, ADL changes, PHQ-2-to-9 score, weight change, pain, mood/behaviour, and psychotropic medications.\n- **Two-part design:**\n 1. **DSAIL ML model.** A **CatBoost gradient-boosted decision tree classifier**, model version **2023-12-05**. It is trained and hosted by the DSAIL team on the IHS platform. It returns a depression-risk probability plus SHAP values over 1,618 features.\n 2. **rcs-ehr-cai `depression_risk` service.** An adapter that:\n    - turns EHR data into model features;\n    - calls the DSAIL model over OAuth2 and caches results;\n    - keeps the most relevant model-identified factors;\n    - combines them with rule-based factors (PHQ, weight change, active diagnosis) and with pain, mood, and psych-med findings from the Fall/Clinical Risk services.\n- **Clinician-facing output:**\n - A resident is flagged when **more than 3 of 7 depression factors** are present.\n - The ML model's role is to choose *which* diagnoses and ADL patterns count as depression-pertinent.\n - The **raw ML probability is not displayed** in the UI.\n- **Status:**\n - In production: the adapter runs 6 replicas and the DSAIL model runs 4.\n - Enabled per customer (`depression_active_flag`).\n- **Notable constraints:**\n - Model performance evidence (accuracy, calibration, validation population, retrain cadence) is held by DSAIL and is not in this repository.\n - The capability depends on a service owned by another team.\n - PHI crosses a team/platform boundary and is captured in full by the DSAIL service.\n\n### Purpose and Clinical Context\n\n| Topic | Summary |\n|---|---|\n| **Problem** | Depression in long-term care is common, under-recognised, and linked to functional decline, falls, weight loss, and higher mortality. Formal screening (PHQ-9 in MDS Section D) happens only at assessment intervals. |\n| **Value** | Continuous, data-driven surveillance between MDS assessments. It surfaces residents whose diagnoses, ADLs, medications, weight, and behaviour suggest depression risk, prompting earlier screening and care-plan review. |\n| **Users** | Nursing staff and clinical leadership via Intelligent UI (Depression dashboard, resident grid, trend graphs). |\n| **Dashboard tiles** | Total Residents · Residents With Multiple Depression Factors · Residents With PHQ-2 to 9 \u003e 9 · Residents On Psychotropic Medication · Residents Experiencing Pain |\n| **Customer control** | Toggled per customer via `depression_active_flag` (CAI activation table). |\n\n### How It Works\n\n```mermaid\nflowchart LR\n   A[EHR data\u003cbr/\u003ediagnoses, meds, ADLs,\u003cbr/\u003eMDS, vitals] --\u003e B[ML Orchestrator]\n   B --\u003e|1. first| C[Fall Risk +\u003cbr/\u003eClinical Risk services]\n   C --\u003e|pain, mood/behaviour,\u003cbr/\u003epsych meds| B\n   B --\u003e|2. then| D[depression_risk\u003cbr/\u003eadapter service]\n   D --\u003e|model features| E[DSAIL ML Model\u003cbr/\u003eIHS-hosted]\n   E --\u003e|probability + SHAP| D\n   D --\u003e F[Depression factors\u003cbr/\u003e+ Multiple-Factor flag]\n   F --\u003e G[Intelligent UI\u003cbr/\u003eDepression dashboard]\n\n   style D fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style E fill:#ffa94d,stroke:#e9692c,color:#333\n   style F fill:#ffd43b,stroke:#fab005,color:#333\n```\n\n1. **Fall Risk and Clinical Risk run first.** Their **pain**, **mood/behaviour**, and **psychotropic medication** findings are passed to Depression Risk as `known_risks`. Depression is always the last model in the chain.\n2. **The adapter builds model inputs** from:\n  - active diagnoses grouped into ICD-10 categories (F32/F33 excluded except as \"history of depression\");\n  - 30-day medication-class counts (scheduled vs PRN);\n  - 30-day ADL/bowel-bladder point-of-care response counts.\n3. **The DSAIL model** returns a probability plus a SHAP value for every feature (all 1,618, unranked).\n4. **The adapter keeps the most relevant evidence:**\n  - up to 5 **depression-pertinent diagnoses** (SHAP \u003e 0);\n  - up to 5 **relevant ADL patterns** (SHAP \u003e 0.04, excluding \"independent\" responses).\n\n  The probability is stored as `risk_score` but not used for the flag. See [How rcs-ehr-cai Consumes the Output](#how-rcs-ehr-cai-consumes-the-output).\n5. **Rule-based factors** are computed locally:\n  - **PHQ-2-to-9** severity from the most recent MDS;\n  - **weight change** (more than 3 lb between the last two weights);\n  - **active depression/mood diagnosis** (F30–F39);\n  - **BIMS** cognitive score (displayed only, not counted).\n6. **Distinct mood factors are counted** and the **Multiple Depression Factors** flag is set.\n\n**Flag composition**\n\n| # | Factor | Source |\n|---|---|---|\n| 1 | Mood / behaviour | Fall / Clinical Risk outputs (`known_risks`) |\n| 2 | Psychotropic medications | Fall / Clinical Risk outputs (`known_risks`) |\n| 3 | Pain | Fall / Clinical Risk outputs (`known_risks`) |\n| 4 | Depression-pertinent diagnosis | **DSAIL ML model** (SHAP-selected) |\n| 5 | Relevant ADLs | **DSAIL ML model** (SHAP-selected) |\n| 6 | Weight change | Rule (\u003e 3 lb between last two weights) |\n| 7 | PHQ-2 to 9 score \u003e 9 (moderate or worse) | Rule (MDS Section D) |\n\n\"Resident has multiple mood factors\" = **Yes** when more than 3 of these 7 are present (`threshold_for_resident_has_multiple_mood_factor = 3`).\n\n\u003e The dashboard trend-graph config (`GRAPH_ANSWERS`) uses a factor count of **5**, while the resident flag uses **\u003e 3**. The intended definition for each view is to be confirmed with Product.\n\nThe ML model therefore acts as an **evidence selector rather than a scorer**: it drives 2 of the 7 factors. A resident with a high probability but no positive-SHAP ADLs or diagnoses gains no ML-driven factor. A resident with a low probability can still gain both.\n\n### Components and Ownership\n\n| Component | Owner | Hosting | Runtime | Role |\n|---|---|---|---|---|\n| **DSAIL Depression model service** (`dsail-depression-risk`; mirrored at `services/ml_services/dsail-depression-risk/` on `main`) | DSAIL / IHS team | IHS platform. TrueFoundry per this document; the prod endpoint is `depr-inference-prod.ihs.amr-prod.devx-eks-prd.dht.live` | Python 3.9, FastAPI, CatBoost 1.2.2 + SHAP 0.43.0, 1,618 features | Model inference, SHAP values, full request/response data capture to Snowflake |\n| **`depression_risk` adapter** | RCS EHR CAI team | DevX EKS (`saas-machinelearning`) | Python 3.12, FastAPI | Feature preparation, OAuth2 call to DSAIL, Postgres cache, factor filtering, rule-based factors, multiple-mood flag |\n| **ML Orchestrator** | RCS EHR CAI team | DevX EKS | Python 3.12 | Sequences Fall/Clinical → Depression; publishes results to SQS |\n| **Derived Aggregator → Clinical Backend → Intelligent UI** | RCS EHR CAI team | DevX EKS | Python 3.12 / React | Persists insights and renders the dashboard, grid, and trends |\n\nModel quality, retraining, monitoring, and endpoint uptime sit with DSAIL. The clinician experience and the flag logic sit with RCS EHR CAI.\n\n### Model Summary\n\nModel details are listed in [Model Training and Versioning](#model-training-and-versioning). The table below adds operational context.\n\n| Aspect | Detail |\n|---|---|\n| Model age | Version **2023-12-05** (deployment `v12`), about 2 years old |\n| Monitoring | Data-monitoring baselines (feature/prediction statistics and constraints) exist in `deployment_files/`. Whether drift alerts are active is **[TBD]** |\n| Upgrade path | The pickles are tied to CatBoost 1.2.2 / SHAP 0.43.0, so moving to Python 3.12 likely requires re-exporting or retraining the model, plus a baseline comparison (as done for Fall Risk) |\n| Artifact source | TrueFoundry registry `ihs-saas-nonprod-depr-repo` today; S3 (`depression_risk/v1/`) planned |\n\n**Open questions for the DSAIL team**\n\n| Item | Purpose |\n|---|---|\n| **[TBD]** Training population, size, date range, label definition | Generalisability and clinical validity |\n| **[TBD]** Holdout performance: AUC, sensitivity, specificity, precision at the operating point | Accuracy evidence |\n| **[TBD]** Calibration and real-world prevalence in the scored population | Whether the probability is meaningful |\n| **[TBD]** Subgroup / fairness analysis (age, sex, race/ethnicity, facility type) | Equity and regulatory exposure |\n| **[TBD]** Retraining cadence and whether drift monitoring is active | Model freshness and governance |\n| **[TBD]** Training notebook / reproducible pipeline (not on `main`; only deployment notebooks exist) | Reproducibility and audit |\n| **[TBD]** Python 3.12 upgrade plan, including CatBoost re-export or retrain | Security / EOL |\n| **[TBD]** Uptime SLA, latency SLO, incident process | Operational dependency |\n| **[TBD]** Data-capture retention, access controls, data-use agreements for PHI | Privacy / compliance |\n\n### Integration Architecture\n\n```mermaid\nsequenceDiagram\n   participant SQS as SQS (resident data)\n   participant ORCH as ML Orchestrator\n   participant FR as Fall/Clinical Risk\n   participant DR as depression_risk (adapter)\n   participant PG as Postgres cache\n   participant COG as Cognito (IHS OAuth2)\n   participant DSAIL as DSAIL model (IHS)\n\n   SQS-\u003e\u003eORCH: resident batch\n   ORCH-\u003e\u003eFR: score fall + clinical\n   FR--\u003e\u003eORCH: factors (pain, mood, psych meds)\n   ORCH-\u003e\u003eSQS: publish fall/clinical results\n   ORCH-\u003e\u003eDR: POST /api/calculate (+ known_risks)\n   DR-\u003e\u003ePG: lookup cached results per resident\n   alt cache miss or source data changed\n       DR-\u003e\u003eCOG: client-credentials token\n       DR-\u003e\u003eDSAIL: POST /inferance (features)\n       DSAIL--\u003e\u003eDR: probability + SHAP\n       DR-\u003e\u003ePG: upsert cache\n   end\n   DR--\u003e\u003eORCH: depression factors + multiple-mood flag\n   ORCH-\u003e\u003eSQS: publish depression results\n```\n\n| Area | Detail |\n|---|---|\n| **Pattern** | The adapter is stateless apart from a Postgres result cache. Inference is remote, over HTTPS to the DSAIL endpoint |\n| **Dependency chain** | Depression runs **after** Fall Risk and Clinical Risk. Latency stacks, and an upstream outage degrades depression factors |\n| **Caching** | `ihs_response_history` table, one row per resident. Reused unless medications, POC, or diagnoses were modified after the last run (feature flag `API_IHS_CACHE`) |\n| **Auth to DSAIL** | OAuth2 client-credentials via IHS Cognito. Client ID/secret in AWS Secrets Manager; URLs in Helm values |\n| **Prod footprint (adapter)** | 6 replicas × (0.5–1 CPU, 1–2 GiB), i.e. **3 CPU / 6 GiB reserved**, up to 6 CPU / 12 GiB |\n| **Prod footprint (DSAIL)** | 4 replicas × (5–6 CPU, 5–6 GB), i.e. about **20 CPU / 20 GB reserved**, plus a 200 GB EFS artifact cache |\n| **Environments** | Dev, QA, and staging share one non-prod DSAIL endpoint; prod has a dedicated endpoint |\n| **Observability** | Loguru logs and Datadog APM (0.1% sampling) in the adapter; DSAIL captures full request/response data |\n| **Recent changes** | Mar 2026 bulk cache lookup (ML-16319) · Apr resource right-sizing · May BIMS factor (ML-16489) and settings refactor · Jun secrets→Helm migration, Cognito endpoint fix, PHQ and weight-change pop-ups (ML-16619, ML-16674) |\n\n### Security and Compliance Considerations\n\n| Area | Current state | Note |\n|---|---|---|\n| **Data sent to DSAIL** | Per-resident ICD-10 categories, medication-class counts, and ADL counts, keyed by resident ID and source/customer identifiers | Pseudonymous but **linkable PHI**; leaves the adapter's boundary to another team's platform |\n| **DSAIL data capture** | **Full request and response stored** in a Snowflake data-capture table | Confirm retention, encryption, access list, and BAA/data-use coverage |\n| **Adapter Postgres cache** | Full DSAIL response stored per resident, **no expiry** | Confirm retention policy and purge on resident discharge or customer offboarding |\n| **Inbound auth (adapter)** | No application-level auth on `/api/calculate`; relies on private networking | Shared OAuth2/JWT pattern available in `services/shared/security` |\n| **Outbound auth (to DSAIL)** | OAuth2 client credentials (Cognito) with JWT validated by DSAIL | — |\n| **Secrets** | AWS Secrets Manager (client ID/secret); non-secret URLs in Helm | — |\n| **Regulatory classification** | **[TBD — confirm with Regulatory/QA]** | Confirm intended-use wording (\"factors to consider\" vs \"diagnosis/prediction\") and whether model changes need change control |\n\n### Known Risks and Gaps\n\n| # | Risk / Gap | Impact | Mitigation / Next step |\n|---|---|---|---|\n| 1 | **No model performance evidence in the repository** | Accuracy cannot be stated; governance exposure | Obtain a DSAIL model card (metrics, population, subgroups, retrain date) |\n| 2 | **External dependency without documented SLA** | Outage or latency in IHS/DSAIL breaks depression insights | Agree SLA/SLO; alert on DSAIL error rate and latency |\n| 3 | **DSAIL runtime on Python 3.9 (EOL)**, pinned to CatBoost 1.2.2 / SHAP 0.43.0 by the existing pickles | Security patch exposure; upgrade blocked without re-export or retrain | Python 3.12 upgrade with model re-export or retrain plus baseline comparison |\n| 4 | **Model is about 2 years old**, with no training code in the repository | Possible drift from current coding/documentation practices (new ICD-10 codes, drug classes, POC wording); weak reproducibility | Backtest on recent data; obtain training notebook and data lineage |\n| 5 | **PHI crosses a team boundary and is fully captured** | Privacy and compliance risk | Confirm data-use agreement, retention, and access controls |\n| 6 | **No retry or token reuse on the active call path.** A new Cognito token is fetched per call; existing retry/token-refresh code is unused | Transient IHS errors fail the whole batch; extra auth load | Route through the existing retry helper; reuse the background-refreshed token |\n| 7 | **Cache invalidation is data-change only.** It ignores the moving 30-day window and model version changes | Stale results for residents with no new data; a model update won't refresh cached residents | Add TTL and model version to the cache key |\n| 8 | **Two definitions of \"high risk\"** (\u003e 3 factors vs graph count 5) | Inconsistent numbers across UI views | Single shared constant after a Product decision |\n| 9 | **Sequential dependency on Fall/Clinical Risk** | Latency stacking; upstream failure degrades depression | Monitor end-to-end latency |\n| 10 | **Non-prod environments share one DSAIL endpoint** | QA/staging load can interfere with dev | Separate endpoints or quotas |\n| 11 | **No application-level inbound auth; health probes disabled** in Helm | Defence-in-depth and self-healing gaps | Enable probes; add service-to-service auth |\n| 12 | **ML probability not surfaced and not used in the flag**; the model only selects evidence (2 of 7 factors) | A low-probability resident can still receive ML-selected factors | Keep factor-based UX, gate ML factors on a probability threshold, or introduce a calibrated risk tier |\n| 13 | **DSAIL application errors return HTTP 200** with a `{\"statusCode\": 500, \"body\": ...}` envelope; the adapter only checks HTTP status | Errors surface as an opaque parsing failure (missing `details`) | Detect the error envelope in `ihs_call.py`, or return proper HTTP status codes from DSAIL |\n\n### Open Decisions\n\n1. **Model governance:** Model card, retraining cadence, drift monitoring, and uptime/latency SLA with DSAIL.\n2. **Privacy review:** Data-flow review of PHI sent to and captured by DSAIL, and of adapter cache retention.\n3. **Definition of \"high depression risk\":**\n  - Choose a single threshold.\n  - Decide whether the ML probability becomes a visible, calibrated risk tier or stays an evidence selector.\n4. **Python 3.9 EOL and model age:** Python 3.12 upgrade date, including CatBoost re-export or retrain and a fresh backtest.\n5. **Resilience fixes:** Retry and token reuse, cache TTL and versioning, health probes, inbound auth.\n6. **Regulatory:** Intended-use wording and classification with Regulatory/QA.\n\n### FAQ\n\n| Question | Answer |\n|---|---|\n| *What does the capability deliver?* | An always-on view of residents showing multiple depression indicators between formal PHQ-9 assessments, so screening and interventions can happen earlier. |\n| *Where is ML used?* | The DSAIL CatBoost model (1,618 features) scores each resident and explains the score per feature with SHAP. The adapter uses those explanations to pick the top 5 diagnoses and top 5 daily-living patterns that raise that resident's risk. These are combined with clinically recognised indicators (PHQ-9, weight change, pain, mood, psychotropic meds). |\n| *How accurate is it?* | **[TBD — DSAIL model card.]** The resident flag is a transparent count of evidence-based factors, so every flag is explainable. |\n| *Who owns the model?* | DSAIL trains and hosts it; RCS EHR CAI owns the integration and the clinician experience. The model service code is mirrored at `services/ml_services/dsail-depression-risk/` on `main` and is being reorganised to match the Fall Risk layout. |\n| *What happens if it is wrong?* | It is decision support that prompts screening; it does not diagnose. A missed flag means routine MDS screening still occurs; a false flag means an extra screening. |\n| *Can customers opt out?* | Yes, per customer. |\n| *Why is the model not hosted in rcs-ehr-cai like Fall Risk?* | That move has partly started: the service code is in the monorepo and artifacts are planned to move from TrueFoundry to S3 (`depression_risk/v1/`). Full ownership would also include retraining, monitoring, and governance. |\n| *What happens if DSAIL is down?* | Fall and Clinical Risk results are already published. The depression call fails for that batch (no retry on the current path), and depression factors stay stale until the next successful run. |\n| *How is the model versioned?* | `version.json` (model `2023-12-05`, deployment `v12`) and TrueFoundry artifact FQNs, with S3 keys planned. The adapter cache is not version-aware yet. |\n| *Known tech debt?* | Python 3.9 with pinned CatBoost/SHAP pickles; no training code in the repository; unused legacy retry/token code; no cache TTL; depression constants duplicated between orchestrator and adapter. |\n\n### Metrics to Track\n\n| Metric | Source | Value |\n|---|---|---|\n| Active Depression customers / facilities | CAI activation table (`depression_active_flag`) | [TBD] |\n| Residents scored per day | Datadog / orchestrator logs | [TBD] |\n| % residents flagged \"Multiple Depression Factors\" | Postgres insights | [TBD] |\n| Cache hit rate (DSAIL calls avoided) | Adapter logs (\"Using cached responses\") | [TBD] |\n| DSAIL p50 / p95 latency, error rate (30 days) | Datadog / DSAIL | [TBD] |\n| Model AUC / sensitivity / specificity | DSAIL model card | [TBD] |\n| Model version / train date | `version.json` | 2023-12-05 (deployment v12) |\n| Infra cost (adapter pods + DSAIL share) | AWS / Kubecost / DSAIL | [TBD] |\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| **DSAIL** | The data-science team that trains and hosts the depression model (repo `dsail-depression-risk`) |\n| **IHS** | Platform hosting the DSAIL inference endpoint (Cognito-authenticated) |\n| **PHQ-2 to 9** | Patient Health Questionnaire depression screen in MDS Section D. Scores ≥ 10 indicate moderate or worse depressive symptoms |\n| **BIMS** | Brief Interview for Mental Status (MDS Section C), a cognitive screen. Displayed, not scored |\n| **ADL / POC** | Activities of Daily Living / Point-of-Care documentation |\n| **SHAP** | Method that attributes a model's prediction to each input feature (explainability) |\n| **Multiple Depression Factors** | Resident flag set when more than 3 of 7 depression factors are present |\n| **Known risks** | Factors passed from Fall/Clinical Risk into Depression Risk (pain, mood/behaviour, psychotropic meds) |\n\n### Related Documentation\n\n- DSAIL model source (monorepo, `main` branch): `services/ml_services/dsail-depression-risk/`\n- Adapter service code: [services/ml_services/depression_risk/](../services/ml_services/depression_risk/)\n- Orchestration sequencing: [ml_service_orchestration.py](../services/etl_data_services/ml_orchestrator/api/services/processor/ml_service_orchestration.py)\n- Factor selection (SHAP filtering): [ml_factor.py](../services/ml_services/depression_risk/api/services/filter/ml_factor.py)\n- Rule-based factors (PHQ, BIMS, weight, active diagnosis): [other_factors.py](../services/ml_services/depression_risk/api/services/filter/other_factors.py)\n- UI definitions (tiles, thresholds): [clinical_backend constants](../services/ui_services/clinical_backend/api/util/constants.py)\n- Adapter prod deployment values: [values-prod-amr-saas.yaml](../helm-values/depression_risk/values-prod-amr-saas.yaml)\n- HPA proposal: [QA_HPA_IMPLEMENTATION.md](performance/QA_HPA_IMPLEMENTATION.md)\n- Fall Risk service documentation: [SERVICE_README_FALLRISK.md](SERVICE_README_FALLRISK.md)\n\n---\n\n## Service Overview\n\n**This document covers the PROD branch deployment** of the DSAIL Depression Risk model service — the production ML model inference service hosted on TrueFoundry.\n\nThe Depression Risk service:\n- **Hosts the actual ML depression risk prediction model**: a **CatBoost** binary classifier (`catboost==1.2.2`), trained and versioned via the TrueFoundry artifact registry\n- Accepts request payloads with clinical signals (diagnoses, medications, assessments)\n- Runs model inference directly (vs. external API orchestration)\n- Captures all inference requests and responses for data lineage and model monitoring\n- Returns depression risk scores with explainability (SHAP values) and contributing factors\n- Deployed with 4 production replicas, JWT authentication, and comprehensive resource limits\n\n**Repository Branch:** `prod` (production deployment configuration with TrueFoundry specs)\n\n**Related Services:**\n- **rcs-ehr-cai depression_risk service** (`services/ml_services/depression_risk/`) — EHR orchestration layer that calls this service\n- **Monorepo copy** (`services/ml_services/dsail-depression-risk/` on `rcs-ehr-cai` `main`) — DSAIL service source imported into this monorepo. It is being reorganised into the Fall Risk layered layout (`services/`, `transformers/`, `web/`), with an S3 artifact source planned\n- **Main branch (dsail-depression-risk)** — Development/test version of this service\n\nThe sections below are scoped to the PROD deployment of the DSAIL model service. The end-to-end capability is covered in the [Project Introduction](#project-introduction) above.\n\n```mermaid\ngraph LR\n   A[\"EHR Orchestrator\u003cbr/\u003eor External Caller\"] --\u003e|POST /inferance\u003cbr/\u003e+ JWT Token| B[\"DSAIL Depression Risk\u003cbr/\u003ePROD Service\u003cbr/\u003eTrueFoundry Deployed\"]\n   B --\u003e|TrueFoundry\u003cbr/\u003eArtifact Registry| C[\"Pre-trained ML Model\u003cbr/\u003e+ Explainer\"]\n   C --\u003e D[\"Risk Score\u003cbr/\u003e+ Factors + SHAP\"]\n   B --\u003e|Data Capture Async| E[\"Data Warehouse\u003cbr/\u003eRequest/Response Log\"]\n   D --\u003e|Response| A\n   style B fill: #4c6ef5, stroke: #364fc7, color: #fff\n   style C fill: #ffa94d, stroke: #e9692c, color: #333\n   style E fill: #ffa94d, stroke: #e9692c, color: #333\n```\n\n---\n\n## High-Level Processing Flow (PROD Service)\n\n```mermaid\nflowchart TD\n   A[\"POST /inferance\u003cbr/\u003eClinical Request\"] --\u003e B[\"Parse Request\u003cbr/\u003e+ JWT Validation\"]\n   B --\u003e C[\"Preprocess Clinical Data\u003cbr/\u003eFeature Engineering\"]\n   C --\u003e D[\"Load Model Artifacts\u003cbr/\u003efrom TrueFoundry\"]\n   D --\u003e E[\"Run ML Model Inference\u003cbr/\u003eGenerate Predictions\"]\n   E --\u003e F[\"Compute SHAP Values\u003cbr/\u003eFactor Explainability\"]\n   F --\u003e G[\"Format Response\u003cbr/\u003e+ Risk Score + Factors\"]\n   G --\u003e H[\"Async Data Capture\u003cbr/\u003eRequest/Response\"]\n   H --\u003e I[\"Return to Caller\u003cbr/\u003ewith Predictions\"]\n\n   style A fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n   style C fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style D fill:#ffa94d,stroke:#e9692c,color:#333\n   style E fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style F fill:#51cf66,stroke:#2f9e44,color:#333\n   style H fill:#ffa94d,stroke:#e9692c,color:#333\n   style I fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n```\n\n**Key Differences from Main Branch:**\n- **Model hosting:** Pre-trained model included in service (downloaded via TrueFoundry artifact registry at startup)\n- **Direct inference:** No external API calls — predictions computed in-process\n- **TrueFoundry deployment:** 4 production replicas, JWT authentication, resource limits (5 CPU, 5000 MB memory)\n- **Data capture:** Async logging of all requests/responses for monitoring and model governance\n- **Production-grade:** High concurrency (10 UVICORN workers), multi-process serving\n\n---\n\n## API Endpoints (PROD Deployment)\n\n### Inference Routes\n\n| Method | Path | Description | Authentication |\n|---|---|---|---|\n| POST | /inferance | Main depression risk model inference endpoint | JWT Bearer Token |\n| POST | /dc-table | Data capture table creation/status check | JWT Bearer Token |\n\n### Health and Documentation\n\n| Method | Path | Description | Authentication |\n|---|---|---|---|\n| GET | /health | Service health check endpoint | None |\n| GET | /docs | Swagger UI documentation | None |\n| GET | /redoc | ReDoc alternative documentation | None |\n\n---\n\n## TrueFoundry Deployment Configuration (PROD Branch)\n\n**Repository:** [dsail-depression-risk](https://github.com/resmed/dsail-depression-risk) (prod branch)\n\n**Deployment File:** [src/service/deploy.yaml](https://github.com/resmed/dsail-depression-risk/blob/prod/src/service/deploy.yaml)\n\n### Service Configuration\n\n| Setting | Value | Purpose |\n|---|---|---|\n| **Service Name** | `depression-risk` | Deployed service identifier |\n| **Container Port** | 8000 | Internal FastAPI port |\n| **Python Version** | 3.9 | Runtime environment |\n| **Build Command** | `uvicorn app:app --port 8000 --host 0.0.0.0 --workers 7` | Uvicorn with 7 worker processes |\n| **Concurrency (ENV)** | `UVICORN_WEB_CONCURRENCY: 10` | Total web concurrency across workers |\n\n### Artifact Registry Integration\n\n**Model and Explainer Download:**\n\n| Artifact | Environment Variable | Purpose |\n|---|---|---|\n| Trained Model | `depr_model` | Pre-trained **CatBoost** depression risk classifier (`model.pickle`) |\n| SHAP Explainer | `depr_explainer` | SHAP explainer for model interpretability (explainer.pickle) |\n| Feature List | feature_list.yml | Mapping of feature indices to names |\n\n**Artifact versions** are managed via TrueFoundry's artifact registry (`ihs-saas-nonprod-depr-repo`; registered with `scripts/register_model.py`), with version FQNs passed as deployment parameters:\n- `MODEL_FQN` — model artifact version FQN\n- `EXPLAINER_FQN` — explainer artifact version FQN\n\n**Planned S3 artifact source** (monorepo copy on `main`): `model_fn()` downloads missing artifacts from S3, mirroring the Fall Risk convention. Locations can be overridden with env vars:\n\n| Artifact | Current (TrueFoundry) | Planned (S3) | Override env var |\n|---|---|---|---|\n| Model | `depr_model:\u003cversion\u003e` | `s3://rcs-ehr-cai-s3-{env}/depression_risk/v1/model.pickle` | `DEPR_MODEL_S3_BUCKET`, `DEPR_MODEL_S3_KEY` |\n| Explainer | `depr_explainer:\u003cversion\u003e` | `s3://rcs-ehr-cai-s3-{env}/depression_risk/v1/explainer.pickle` | `DEPR_EXPLAINER_S3_KEY` |\n\n### Production Resource Configuration\n\n| Resource | Value | Purpose |\n|---|---|---|\n| **CPU Request** | 5 cores | Guaranteed CPU allocation |\n| **CPU Limit** | 6 cores | Maximum CPU allowance |\n| **Memory Request** | 5000 MB | Guaranteed memory allocation |\n| **Memory Limit** | 6000 MB | Maximum memory allowance |\n| **Ephemeral Storage Request** | 1000 MB | Guaranteed temporary storage |\n| **Ephemeral Storage Limit** | 2000 MB | Maximum temporary storage |\n| **Artifact Cache Volume** | 200 GB | EFS cache for model/explainer artifacts |\n| **Replicas** | 4 | Production deployment redundancy |\n| **Node Type** | On-demand | Kubernetes node capacity type |\n| **Service Account** | TrueFoundry-managed | Kubernetes authentication |\n\n### Authentication and Security\n\n| Configuration | Value |\n|---|---|\n| **Authentication** | JWT Bearer Token (via `claims` in deploy.yaml) |\n| **Authorization Claims** | `client_id` from JWT token |\n| **Integration FQN** | Configured via `INTEGRATION_FQN` |\n| **Allow Interception** | false (service mesh interception disabled) |\n| **Protocol** | HTTP (over TLS at ingress) |\n\n### Environment Variables\n\n| Variable | Source | Purpose |\n|---|---|---|\n| `MODEL_FQN` | Deployment parameter | Model artifact FQN in registry |\n| `ENDPOINT` | Deployment parameter | Service endpoint URL |\n| `MODEL_ENDPOINT` | Deployment parameter | External model endpoint (if needed) |\n| `EXPLAINER_FQN` | Deployment parameter | Explainer artifact FQN |\n| `DATA_CAPTURE` | Deployment parameter | Data capture table name |\n| `ENVIRONMENT` | Deployment parameter | Environment name (prod/nonprod) |\n| `WORKSPACE_FQN` | Deployment parameter | TrueFoundry workspace FQN |\n| `UVICORN_WEB_CONCURRENCY` | Deployment config | Web worker concurrency |\n| `LOGGING_LEVEL` | Runtime (default: INFO) | Python logging level |\n\n---\n\n## Input and Output Contracts (PROD Service)\n\n### Input Schema\n\n**Request structure for `/inferance` endpoint:**\n\n```json\n{\n \"source\": \"string\",\n \"data_source_id\": \"string\",\n \"corporate_id\": \"string\",\n \"customer_id\": \"string\",\n \"details\": [\n   {\n     \"entity_id\": \"string (resident identifier)\",\n     \"features\": [\n       {\n         \"feature_name\": \"string\",\n         \"feature_value\": \"number | string | array\"\n       }\n     ]\n   }\n ]\n}\n```\n\n**Required top-level fields:**\n- `source` — data source identifier (e.g., \"DATA_SYSTEM_A\")\n- `data_source_id` — unique source system ID\n- `corporate_id` — organization/corporate identifier\n- `customer_id` — customer/facility identifier\n- `details[]` — array of residents to score (must not be empty)\n\n**Required fields in `details` objects:**\n- `entity_id` — resident/patient identifier (string)\n- `features[]` — array of feature values for model input (must not be empty)\n\n**Feature requirements:**\n- `feature_name` — name of the feature (e.g., \"Icd10\", \"feature_age\", etc.)\n- `feature_value` — value of feature; special handling for \"Icd10\" (must be array)\n- All non-ICD10 features should be numeric or convertible to numeric\n\n**Special handling:**\n- ICD10 features must be provided as lists/arrays\n- Unknown/missing features are filled with None by preprocessing\n\n### Output Schema\n\n\u003e Verified against `response_builder()` in `transformers/depression_transformer.py` and `tests/batch_response.json`, in the monorepo copy on `main`.\n\n**Success response from `/inferance`.** This is returned as raw JSON with **no** `statusCode`/`body` envelope:\n\n```json\n{\n \"source\": \"SNF\",\n \"data_source_id\": \"DS001\",\n \"corporate_id\": \"30\",\n \"customer_id\": \"27\",\n \"details\": [\n   {\n     \"entity_id\": 1,\n     \"unique_resident_id\": \"SNF-DS001-30-27-PAT-1\",\n     \"timestamp\": \"2024-05-06T01:51:28.171889\",\n     \"score\": 0.3857,\n     \"factors_considered\": [\n       { \"feature_name\": \"how_did_the_resident_bathe_independent\", \"feature_value\": 5.0, \"shap_value\": -0.0491 },\n       { \"feature_name\": \"how_did_the_resident_bathe_not_recorded\", \"feature_value\": 26.0, \"shap_value\": 0.0 },\n       { \"feature_name\": \"historyof\", \"feature_value\": null, \"shap_value\": null }\n     ]\n   }\n ]\n}\n```\n\n**Response fields:**\n- `source`, `data_source_id`, `corporate_id`, `customer_id` — echoed from request\n- `details[]` — one entry per resident from the request\n- `entity_id` / `unique_resident_id` — resident identifier, and the fully qualified `source-datasource-corporate-customer-PAT-entity_id`\n- `score` — depression-risk probability from CatBoost `predict_proba()[:, 1]`, rounded to 4 decimals (0.0 - 1.0)\n- `factors_considered[]` — **all 1,618 model features**, unranked and unfiltered. Each entry has:\n - `feature_value` — the value sent, or `null` if the feature was absent;\n - `shap_value` — the feature's SHAP contribution, or `null` when the feature value is null.\n Positive values push the prediction toward depression; negative values push away.\n- `timestamp` — UTC prediction timestamp\n\n**Error responses.** These are wrapped by `responseToApiGw()` as `{\"statusCode\": 500, \"body\": \"\u003cjson string\u003e\", \"headers\": {...}}`. Note that FastAPI still returns **HTTP 200** for these envelopes:\n- `{\"Description\": \"\u003cmissing field\u003e\"}` — missing required field (`source`, `details`, `entity_id`, `features`, ...)\n- `{\"Description\": \"Invalid format of Icd10\"}` — `Icd10` feature not an array\n- `{\"Description\": \"ModelError\"}` / `{\"Description\": \"Unknown Exception\", \"Message\": \"...\"}` — inference failure\n\n**Data Capture:**\n- All requests and responses are asynchronously captured (`ihs-endpoint-data-capture` `push_async.data_capture`) to a Snowflake data-capture table\n- Captured for model governance, monitoring, and data lineage\n\n---\n\n## How rcs-ehr-cai Consumes the Output\n\nThe calling service is `services/ml_services/depression_risk`. The DSAIL model returns a **probability** and a **SHAP value for every feature**. All ranking, filtering, and clinical translation happen in our service:\n\n```mermaid\nflowchart LR\n   A[\"DSAIL response\u003cbr/\u003escore + 1,618 x (value, shap)\"] --\u003e B[\"score x 100\u003cbr/\u003erisk_score\"]\n   A --\u003e C[\"ADL/POC features\u003cbr/\u003evalue \u003e 0, shap \u003e 0.04,\u003cbr/\u003enot 'independent'\u003cbr/\u003etop 5 by SHAP\"]\n   A --\u003e D[\"ICD-10 features\u003cbr/\u003evalue \u003e 0, shap \u003e 0\u003cbr/\u003etop 5 by SHAP\"]\n   C --\u003e E[\"Map via depression_feature_mapper.pkl\u003cbr/\u003eRelevant ADLs\"]\n   D --\u003e F[\"Map via depression_feature_mapper.pkl\u003cbr/\u003eDepression Pertinent Diagnosis\"]\n   E --\u003e G[\"+ rule-based factors\u003cbr/\u003ePHQ-2-9, weight change,\u003cbr/\u003eactive dx, BIMS\"]\n   F --\u003e G\n   G --\u003e H[\"Multiple Depression Factors\u003cbr/\u003eYes if \u003e 3 of 7\"]\n   B -.-\u003e|carried, not used for flag| H\n\n   style A fill:#ffa94d,stroke:#e9692c,color:#333\n   style H fill:#ffd43b,stroke:#fab005,color:#333\n```\n\n| DSAIL output | How `depression_risk` uses it | Code |\n|---|---|---|\n| `score` | Stored as `risk_score = score × 100` on the \"Depression Risk\" factor group. `resident_overall_risk_score` is set to `0.0`. **Not used** for the Multiple Depression Factors flag | `filter/ml_factor.py` |\n| `shap_value` for ADL/POC features (`what_is_*`, `how_did_*`) | Kept when `feature_value \u003e 0`, `shap_value \u003e 0.04` (`API_DEPRESSION_POC_SHAP_THRESHOLD`), and the response is not \"independent\". Sorted by SHAP descending; **top 5** become **Relevant ADLs** | `filter/ml_factor.py` |\n| `shap_value` for diagnosis features (`icd10_*`) | Kept when `feature_value \u003e 0` and `shap_value \u003e 0.0` (`API_DEPRESSION_DIAGNOSIS_SHAP_THRESHO
