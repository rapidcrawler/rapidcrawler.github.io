<script type="application/json" id="embedded-data">{"pages": {"overview": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e01 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eA model selects evidence. A rule raises the flag.\u003c/h2\u003e\u003cp\u003eMatching engineering field guide · project facts frozen at the README’s 1 October 2026 snapshot.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"hero-panel\"\u003e\u003cdiv\u003e\u003cspan class=\"eyebrow\"\u003eMATRIXCARE · CLINICAL INSIGHTS\u003c/span\u003e\u003ch1\u003eContinuous signals.\u003cbr\u003eEarlier screening.\u003c/h1\u003e\u003cp\u003eAn EHR adapter combines model-selected diagnoses and ADL patterns with clinical indicators, helping nursing teams identify residents with multiple depression factors between formal assessments.\u003c/p\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"primary\" data-nav=\"runtime\"\u003eExplore the two-service design →\u003c/button\u003e\u003cbutton data-nav=\"interview\"\u003ePractice the interview story\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"hero-orbit\"\u003e\u003cdiv class=\"orbit-node\"\u003eDSAIL model\u003cspan\u003eCatBoost + 1,618 SHAP features\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"orbit-node\"\u003eEHR adapter\u003cspan\u003eEvidence + clinical rules\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"orbit-result\"\u003e4 of 7\u003cspan\u003eMinimum factors for resident flag\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"metrics\"\u003e\u003cdiv\u003e\u003cstrong\u003e1,618\u003c/strong\u003e\u003cspan\u003eModel feature outputs · unranked\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003e2 of 7\u003c/strong\u003e\u003cspan\u003eCounted categories chosen by ML\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003ePerformance TBD\u003c/strong\u003e\u003cspan\u003eNo model accuracy evidence supplied\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eThe central distinction:\u003c/b\u003e DSAIL returns a probability and feature attributions. The adapter uses SHAP to choose evidence, then flags a resident when more than three of seven distinct factors are present. The model probability is carried internally; it does not determine that flag or appear in the UI.\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Clinical purpose and product surface\" data-bookmark=\"Clinical purpose and product surface\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eClinical purpose and product surface\u003c/h3\u003e\u003cp\u003eContinuous surveillance for depression indicators between MDS PHQ assessments. A flag prompts screening and care-plan review; it is not a diagnosis.\u003c/p\u003e\u003cp\u003eUsers: nursing staff and clinical leadership via Intelligent UI dashboard, resident grid and trend graphs. Per-customer activation: \u003ccode\u003edepression_active_flag\u003c/code\u003e.\u003c/p\u003e\u003cul\u003e\u003cli\u003eTotal Residents\u003c/li\u003e\u003cli\u003eResidents With Multiple Depression Factors\u003c/li\u003e\u003cli\u003eResidents With PHQ-2 to 9 \u0026gt;9\u003c/li\u003e\u003cli\u003eResidents On Psychotropic Medication\u003c/li\u003e\u003cli\u003eResidents Experiencing Pain\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Purpose and Clinical Context\"\u003eSource · Purpose and Clinical Context ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Two services, different responsibilities\" data-bookmark=\"Two services, different responsibilities\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eTwo services, different responsibilities\u003c/h3\u003e\u003cp\u003e\u003cb\u003eDSAIL / IHS:\u003c/b\u003e owns the CatBoost model, inference, SHAP, model quality, retraining and full request/response capture. Python 3.9, TrueFoundry, four replicas.\u003c/p\u003e\u003cp\u003e\u003cb\u003eRCS EHR CAI adapter:\u003c/b\u003e builds features, uses OAuth2 to call DSAIL, caches results in Postgres, filters factors, computes rules and the resident flag. Python 3.12, DevX EKS, six replicas.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Components and Ownership\"\u003eSource · Components and Ownership ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Dependency and boundary\" data-bookmark=\"Dependency and boundary\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eDependency and boundary\u003c/h3\u003e\u003cp\u003eFall and Clinical Risk run first. Pain, mood/behaviour and psychotropic findings pass as \u003ccode\u003eknown_risks\u003c/code\u003e. Depression runs last. Fall/Clinical outputs are published before the Depression call, so DSAIL failure leaves those results intact while Depression remains stale.\u003c/p\u003e\u003cp\u003eRemote inference is a dependency of the adapter. Inference inside DSAIL is local. Those statements apply to different boundaries.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Integration Architecture\"\u003eSource · Integration Architecture ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003ePreparation guide\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark How to use this guide\" data-bookmark=\"How to use this guide\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eHow to use this guide\u003c/h3\u003e\u003cul\u003e\u003cli\u003e5 minutes: overview, factor lab, cache gaps and error-envelope trap.\u003c/li\u003e\u003cli\u003e30 minutes: walk architecture, experiment with SHAP thresholds and rehearse ten questions.\u003c/li\u003e\u003cli\u003e90 minutes: rehearse ownership/STAR, reason through incidents and defend a migration plan.\u003c/li\u003e\u003cli\u003eExport notes and confidence ratings as JSON; refresh dated facts before each interview.\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eRecent integration changes · documented timeline\u003c/h3\u003e\u003cdiv class=\"timeline\"\u003e\u003cdiv\u003e\u003cspan\u003eMar 2026\u003c/span\u003e\u003ch4\u003eBulk cache lookup\u003c/h4\u003e\u003cp\u003eML-16319: resident cache lookup optimisation.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eApr 2026\u003c/span\u003e\u003ch4\u003eRight-sizing\u003c/h4\u003e\u003cp\u003eAdapter resource sizing changes; measured impact not supplied.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eMay 2026\u003c/span\u003e\u003ch4\u003eBIMS and settings\u003c/h4\u003e\u003cp\u003eML-16489 adds displayed cognitive score; settings refactor.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eJun 2026\u003c/span\u003e\u003ch4\u003eIntegration and UX\u003c/h4\u003e\u003cp\u003eSecrets/Helm migration, Cognito endpoint fix, PHQ and weight pop-ups; ML-16619 and ML-16674.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eInterview guardrails\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Claims to avoid\" data-bookmark=\"Claims to avoid\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eClaims to avoid\u003c/h3\u003e\u003cul\u003e\u003cli\u003e“The probability is the clinician’s risk score.” UI uses a factor-count flag; resident_overall_risk_score is 0.0.\u003c/li\u003e\u003cli\u003e“The service has no external calls / no cache.” True for model inference, false for the adapter.\u003c/li\u003e\u003cli\u003e“Explainable means clinically validated.” Training population, labels, AUC, calibration and subgroup results are absent.\u003c/li\u003e\u003cli\u003e“Production-grade means SLA /2,000 RPS is established.” SLA is TBD and throughput is only an estimate with inconsistent concurrency arithmetic.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e", "runtime": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e02 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eFollow the request across two owners\u003c/h2\u003e\u003cp\u003eStep through the adapter and model boundaries, including cache hit, model failure and background capture.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"flow-prev\"\u003e← Previous\u003c/button\u003e\u003cbutton id=\"flow-next\" class=\"primary\"\u003eNext stage →\u003c/button\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"flow-cache\"\u003e Cache hit\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"flow-error\"\u003e DSAIL application error\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"flow-capture\" checked\u003e Capture succeeds\u003c/label\u003e\u003c/div\u003e\u003cdiv id=\"flow-map\" class=\"flow-map\"\u003e\u003c/div\u003e\u003cdiv id=\"flow-detail\" class=\"flow-detail\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Sequence is product logic\" data-bookmark=\"Sequence is product logic\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eSequence is product logic\u003c/h3\u003e\u003cul\u003e\u003cli\u003eSQS → orchestrator → Fall Risk and Clinical Risk → publish upstream results.\u003c/li\u003e\u003cli\u003ePass known_risks into adapter /api/calculate.\u003c/li\u003e\u003cli\u003eBuild inputs and bulk lookup \u003ccode\u003eihs_response_history\u003c/code\u003e per resident.\u003c/li\u003e\u003cli\u003eOn miss/change: fetch Cognito token → POST /inferance → parse raw success details → upsert response cache.\u003c/li\u003e\u003cli\u003eFilter ML factors, combine rules and known risks, count categories and publish Depression results.\u003c/li\u003e\u003cli\u003eDerived Aggregator → Clinical Backend → Intelligent UI persists and renders insights.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Integration Architecture\"\u003eSource · Integration Architecture ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Model request path\" data-bookmark=\"Model request path\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eModel request path\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eapp.py\u003c/code\u003e → validate fields → \u003ccode\u003eentry_point.predict()\u003c/code\u003e → \u003ccode\u003emodel_fn()\u003c/code\u003e → \u003ccode\u003econvert_input()\u003c/code\u003e → pandas feature frame → \u003ccode\u003epredict_proba()[:,1]\u003c/code\u003e → synchronous SHAP → \u003ccode\u003eresponse_builder()\u003c/code\u003e.\u003c/p\u003e\u003cp\u003eModel returns all 1,618 feature values and SHAP values, unranked. Data capture is scheduled asynchronously; success does not prove the audit write completed.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Detailed Execution Sequence (PROD Service)\"\u003eSource · Detailed Execution Sequence (PROD Service) ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Code ownership map\" data-bookmark=\"Code ownership map\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eCode ownership map\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eLocation / function\u003c/th\u003e\u003cth\u003eBoundary\u003c/th\u003e\u003cth\u003eResponsibility\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eml_orchestrator/.../ml_service_orchestration.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eRCS orchestrator\u003c/td\u003e\u003ctd\u003eSequencing; known risks; publish upstream and Depression outputs\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edepression_risk/.../filter/ml_factor.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapter\u003c/td\u003e\u003ctd\u003escore ×100; strict SHAP/value filters; top five ADL and diagnosis\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edepression_risk/.../filter/other_factors.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapter\u003c/td\u003e\u003ctd\u003ePHQ, BIMS, weight and active mood diagnosis\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edepression_risk/.../utils/utils.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapter\u003c/td\u003e\u003ctd\u003eMap features to clinician-readable factors and effective dates\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eihs_call.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapter\u003c/td\u003e\u003ctd\u003eActive remote call path; missing application-envelope handling\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eihs_response_history\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapter/Postgres\u003c/td\u003e\u003ctd\u003eFull per-resident response cache, no TTL/version awareness\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esrc/service/app.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003e/inferance, validation and capture dispatch\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eentry_point.py\u003c/code\u003e · predict /model_fn /predict_fn\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003eOrchestrate model load and inference\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003epreprocess.py\u003c/code\u003e · convert_input /responseToApiGw\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003eFeature conversion and error envelope\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etransformers/depression_transformer.py\u003c/code\u003e · response_builder\u003c/td\u003e\u003ctd\u003eMonorepo main\u003c/td\u003e\u003ctd\u003eVerified raw success-response shape; PROD file layout may differ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edata_capture.py\u003c/code\u003e · req_res_merge\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003eMerge request/response and schedule capture\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edc_table_creation.py\u003c/code\u003e /create_table.sql\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003eCapture-table setup\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003efeature_list.yml\u003c/code\u003e /version.json /deploy.yaml\u003c/td\u003e\u003ctd\u003eDSAIL\u003c/td\u003e\u003ctd\u003eSchema, model/deployment identity and deployment\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Components and Ownership\"\u003eSource · Components and Ownership ↗\u003c/button\u003e\u003c/article\u003e", "factors": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e03 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eExplore the clinician-facing flag\u003c/h2\u003e\u003cp\u003eSeven distinct categories count once each. The probability slider demonstrates its independence from the current resident flag.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eExact documented count rule · synthetic resident\u003c/span\u003e\u003ch3\u003eMultiple Depression Factors\u003c/h3\u003e\u003cdiv id=\"factor-inputs\"\u003e\u003c/div\u003e\u003clabel class=\"range-label\"\u003eDSAIL probability \u003coutput id=\"prob-label\"\u003e\u003c/output\u003e\u003cinput id=\"probability\" type=\"range\" min=\"0\" max=\"1\" step=\"0.0001\" value=\"0.3857\"\u003e\u003c/label\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"factors-clear\"\u003eClear all\u003c/button\u003e\u003cbutton id=\"factors-three\"\u003eThree factors\u003c/button\u003e\u003cbutton id=\"factors-four\"\u003eFour factors\u003c/button\u003e\u003cbutton id=\"factors-all\"\u003eAll seven\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"factor-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv id=\"factor-chart\"\u003e\u003c/div\u003e\u003clabel\u003e\u003cinput id=\"factor-link\" type=\"checkbox\"\u003e Use SHAP lab’s diagnosis /ADL categories\u003c/label\u003e\u003cp class=\"small\"\u003eTop five features do not count as five factors. One or many selected diagnoses contribute one diagnosis category, and ADLs likewise.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eDocumented rules · teaching inputs\u003c/span\u003e\u003ch3\u003eRules and displayed evidence\u003c/h3\u003e\u003clabel class=\"range-label\"\u003ePHQ-2-to-9 score \u003coutput id=\"phq-label\"\u003e\u003c/output\u003e\u003cinput id=\"phq\" type=\"range\" min=\"0\" max=\"27\" step=\"1\" value=\"9\"\u003e\u003c/label\u003e\u003cp class=\"small\"\u003eInteger total used to demonstrate the documented \u0026gt;9 boundary. Complete scoring /missing-item rules are not supplied.\u003c/p\u003e\u003clabel class=\"field\"\u003ePrevious weight (lb)\u003cinput type=\"number\" id=\"weight-before\" value=\"150\" step=\"0.1\"\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eLatest weight (lb)\u003cinput type=\"number\" id=\"weight-after\" value=\"154\" step=\"0.1\"\u003e\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"show-bims\" checked\u003e BIMS displayed\u003c/label\u003e\u003cbr\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"active-dx\" checked\u003e Active F30–F39 mood diagnosis displayed\u003c/label\u003e\u003cdiv id=\"rules-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cbutton id=\"apply-rules\"\u003eApply PHQ and weight categories to flag lab\u003c/button\u003e\u003cp class=\"small\"\u003eThe weight lab uses absolute change as a teaching interpretation of “more than 3 lb between the last two weights”. Signed/magnitude, timing and unit handling need code verification. BIMS is display-only. Active mood diagnosis is documented separately; it is not an eighth counted category.\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eTwo product definitions need alignment:\u003c/b\u003e resident flag = count \u0026gt;3. Dashboard \u003ccode\u003eGRAPH_ANSWERS\u003c/code\u003e uses a factor-count value of 5. The README does not establish the exact graph comparator; this guide shows the five-factor reference without inventing its implementation.\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark What counts, and where it comes from\" data-bookmark=\"What counts, and where it comes from\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhat counts, and where it comes from\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eCategory\u003c/th\u003e\u003cth\u003eSource\u003c/th\u003e\u003cth\u003eCount\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMood /behaviour\u003c/td\u003e\u003ctd\u003eFall /Clinical known_risks\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePsychotropic medication\u003c/td\u003e\u003ctd\u003eFall /Clinical known_risks\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePain\u003c/td\u003e\u003ctd\u003eFall /Clinical known_risks\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDepression-pertinent diagnosis\u003c/td\u003e\u003ctd\u003eDSAIL positive-SHAP selection\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRelevant ADLs\u003c/td\u003e\u003ctd\u003eDSAIL SHAP \u0026gt;0.04, not independent\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWeight change\u003c/td\u003e\u003ctd\u003eLocal \u0026gt;3 lb rule\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePHQ-2-to-9 \u0026gt;9\u003c/td\u003e\u003ctd\u003eLatest MDS Section D\u003c/td\u003e\u003ctd\u003e0 or 1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBIMS\u003c/td\u003e\u003ctd\u003eMDS Section C\u003c/td\u003e\u003ctd\u003eDisplay only\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eActive mood diagnosis F30–F39\u003c/td\u003e\u003ctd\u003eLocal clinical evidence\u003c/td\u003e\u003ctd\u003eNot an additional category in the seven-factor table\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"How It Works\"\u003eSource · How It Works ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Three separate “scores”\" data-bookmark=\"Three separate “scores”\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eThree separate “scores”\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eField /result\u003c/th\u003e\u003cth\u003eMeaning\u003c/th\u003e\u003cth\u003eClinical use\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDSAIL score\u003c/td\u003e\u003ctd\u003epredict_proba positive class; rounded 4 decimals;0–1\u003c/td\u003e\u003ctd\u003eReturned to adapter\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDepression Risk group risk_score\u003c/td\u003e\u003ctd\u003eDSAIL score ×100\u003c/td\u003e\u003ctd\u003eCarried internally; not resident flag\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eresident_overall_risk_score\u003c/td\u003e\u003ctd\u003eSet to 0.0\u003c/td\u003e\u003ctd\u003eNot the raw ML probability\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMultiple Depression Factors\u003c/td\u003e\u003ctd\u003eYes when\u0026gt;3 of 7\u003c/td\u003e\u003ctd\u003eClinician flag\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eA high probability can yield no ML-driven category when no qualifying positive-SHAP diagnoses/ADLs exist. A low probability can still yield both. Any new probability gate is a proposed product change requiring validation.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"How rcs-ehr-cai Consumes the Output\"\u003eSource · How rcs-ehr-cai Consumes the Output ↗\u003c/button\u003e\u003c/article\u003e", "features": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e04 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eFrom 1,618 attributions to clinical evidence\u003c/h2\u003e\u003cp\u003eInspect strict boundaries, filtering and top-N selection using editable synthetic feature rows. These are invented teaching values, not model predictions or clinically validated examples.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card\"\u003e\u003cdiv class=\"grid2\"\u003e\u003cdiv\u003e\u003clabel class=\"range-label\"\u003eADL SHAP cutoff \u003coutput id=\"adl-label\"\u003e\u003c/output\u003e\u003cinput id=\"adl-threshold\" type=\"range\" min=\"0\" max=\"0.2\" step=\"0.001\" value=\"0.04\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eDiagnosis SHAP cutoff \u003coutput id=\"dx-label\"\u003e\u003c/output\u003e\u003cinput id=\"dx-threshold\" type=\"range\" min=\"0\" max=\"0.2\" step=\"0.001\" value=\"0\"\u003e\u003c/label\u003e\u003cbutton id=\"shap-reset\"\u003eRestore documented defaults + example rows\u003c/button\u003e\u003c/div\u003e\u003cdiv\u003e\u003ch3\u003eSelection policy\u003c/h3\u003e\u003cp\u003eFeature value \u0026gt;0; SHAP strictly greater than category threshold; ADL “independent” responses excluded. Sort descending within each eligible category; keep at most five.\u003c/p\u003e\u003cp class=\"small\"\u003eChanging sliders is hypothetical. Default cutoffs: ADL0.04, diagnosis 0.0. Medication and historyof SHAP are not surfaced.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"feature-editor\"\u003e\u003c/div\u003e\u003cdiv id=\"selection-result\" class=\"metrics\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003cdiv id=\"selected-adl\"\u003e\u003c/div\u003e\u003cdiv id=\"selected-dx\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"selection-chart\"\u003e\u003c/div\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Adapter feature construction\" data-bookmark=\"Adapter feature construction\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eAdapter feature construction\u003c/h3\u003e\u003cul\u003e\u003cli\u003eActive diagnoses grouped into ICD-10 categories; F32/F33 excluded from ordinary diagnosis inputs except as history of depression.\u003c/li\u003e\u003cli\u003eMedication-class counts over 30 days, with scheduled and PRN distinctions.\u003c/li\u003e\u003cli\u003eADL and bowel/bladder POC response counts over 30 days.\u003c/li\u003e\u003cli\u003eRaw EHR features are sent to the model; rules/known_risks are assembled locally into final evidence.\u003c/li\u003e\u003cli\u003eA generic model schema can list PHQ/BIMS/vitals examples, but that does not prove the current adapter supplies every example.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"How It Works\"\u003eSource · How It Works ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark DSAIL preprocessing and feature contract\" data-bookmark=\"DSAIL preprocessing and feature contract\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eDSAIL preprocessing and feature contract\u003c/h3\u003e\u003cul\u003e\u003cli\u003eExtract request features; map names to feature_N indices.\u003c/li\u003e\u003cli\u003eExpand Icd10 arrays into sparse diagnosis columns.\u003c/li\u003e\u003cli\u003eFill absent model features with None; form pandas DataFrame.\u003c/li\u003e\u003cli\u003eRename/reorder against CatBoost \u003ccode\u003emodel.feature_names_\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eRun positive-class probabilities and SHAP on the aligned frame.\u003c/li\u003e\u003cli\u003eAbsent values and SHAP are emitted as null in the documented response. Missing is not identical to feature value 0.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Feature Engineering and Input Transformation\"\u003eSource · Feature Engineering and Input Transformation ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Mapping and display\" data-bookmark=\"Mapping and display\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eMapping and display\u003c/h3\u003e\u003cp\u003eSelected features are translated through \u003ccode\u003edepression_feature_mapper.pkl\u003c/code\u003e from S3 \u003ccode\u003edepression_risk/v1/\u003c/code\u003e. Domain group/type/name/value and latest effective date are supplied from resident records.\u003c/p\u003e\u003cp\u003eProtective negative SHAP, medication-class attribution and historyof are not surfaced. This is curated positive evidence, not the complete explanation returned by DSAIL.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"How rcs-ehr-cai Consumes the Output\"\u003eSource · How rcs-ehr-cai Consumes the Output ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Interpretation limits\" data-bookmark=\"Interpretation limits\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eInterpretation limits\u003c/h3\u003e\u003cul\u003e\u003cli\u003ePositive SHAP increases the explained model output; it does not prove causation or clinical treatment benefit.\u003c/li\u003e\u003cli\u003eThe README does not identify SHAP base value or output space. Do not add these values directly to probability.\u003c/li\u003e\u003cli\u003eFixed 0.04 filtering depends on attribution scale and model version; validate after retraining.\u003c/li\u003e\u003cli\u003eExcluding protective evidence and independent ADLs is a product policy, not neutral model interpretation.\u003c/li\u003e\u003cli\u003eA full-model explanation is distinct from the final seven-factor flag explanation.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"SHAP-based Explainability\"\u003eSource · SHAP-based Explainability ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e", "cache": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e05 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eA cache can be correct and still be stale\u003c/h2\u003e\u003cp\u003eCompare the documented data-change-only policy with a proposed TTL/version-aware policy. The lab makes the moving-window gap visible.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eDocumented cache policy vs proposed repair\u003c/span\u003e\u003ch3\u003eWould this response be reused?\u003c/h3\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"cache-enabled\" checked\u003e API_IHS_CACHE enabled\u003c/label\u003e\u003cbr\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"cache-entry\" checked\u003e Resident cache row exists\u003c/label\u003e\u003clabel class=\"range-label\"\u003eAge of cached response (days)\u003coutput id=\"cache-age-label\"\u003e\u003c/output\u003e\u003cinput type=\"range\" id=\"cache-age\" min=\"0\" max=\"90\" step=\"1\" value=\"35\"\u003e\u003c/label\u003e\u003cdiv id=\"cache-change-inputs\"\u003e\u003c/div\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"cache-window\" checked\u003e A record crossed the 30-day feature boundary\u003c/label\u003e\u003cbr\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"cache-version\" checked\u003e Deployed model version changed\u003c/label\u003e\u003clabel class=\"range-label\"\u003eProposed TTL (days)\u003coutput id=\"cache-ttl-label\"\u003e\u003c/output\u003e\u003cinput type=\"range\" id=\"cache-ttl\" min=\"1\" max=\"30\" step=\"1\" value=\"7\"\u003e\u003c/label\u003e\u003cdiv id=\"cache-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cbutton id=\"cache-reset\"\u003eRestore stale-cache example\u003c/button\u003e\u003cp class=\"small\"\u003eTTL expires at age≥TTL in this proposed policy. Source-change check uses “modified after last run”; exact timestamp precision/equality is not specified. Existing policy ignores window drift, age and model version.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark What is cached\" data-bookmark=\"What is cached\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhat is cached\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eihs_response_history\u003c/code\u003e stores the full DSAIL response per resident, described as one row per resident. Bulk lookup was introduced in March 2026.\u003c/p\u003e\u003cp\u003eReuse depends on no newer medication, POC or diagnosis modifications. Cache has no expiry and is not model-version-aware. Identity scoping, offboarding/discharge purge and retention need confirmation.\u003c/p\u003e\u003cp\u003eThe adapter’s local rules and known_risks are conceptually separate from cached model evidence; exact recalculation order on a cache hit needs code review.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Integration Architecture\"\u003eSource · Integration Architecture ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eProposed design\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Why a 30-day window invalidates change-only caching\" data-bookmark=\"Why a 30-day window invalidates change-only caching\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhy a 30-day window invalidates change-only caching\u003c/h3\u003e\u003cp\u003eA record can age out of the last 30 days without any source modification. Counts change with calculation time even when modified_at remains unchanged. Reusing an older DSAIL response can therefore be inconsistent with a freshly built feature vector.\u003c/p\u003e\u003cul\u003e\u003cli\u003eProposed: cache fingerprint includes canonical model features, model/schema version and relevant time-window boundaries.\u003c/li\u003e\u003cli\u003eAdd a bounded TTL as a backstop; do not assume TTL alone gives exact point-in-time correctness.\u003c/li\u003e\u003cli\u003eScope keys by source/customer/resident identity; store model version, calculation time and artifact identity.\u003c/li\u003e\u003cli\u003eCoordinate deployment cache refresh to avoid a thundering herd; handle failures explicitly.\u003c/li\u003e\u003cli\u003eDefine retention and purge policies separately from freshness.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Active auth and retry path\" data-bookmark=\"Active auth and retry path\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eActive auth and retry path\u003c/h3\u003e\u003cp\u003eThe active call path fetches a new Cognito client-credentials token per call. Background token refresh and retry code exist but are unused by that path.\u003c/p\u003e\u003cp\u003eTransient errors can fail the Depression batch; Fall/Clinical outputs are already published. Existing cache is not documented as an explicit stale-on-error fallback.\u003c/p\u003e\u003cp\u003eProposed: reuse unexpired token with expiry skew, single-flight refresh, one deliberate 401 refresh, bounded retry/backoff for transient failures and an agreed degraded-output policy.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eInterview checklist\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Questions to ask about cache correctness\" data-bookmark=\"Questions to ask about cache correctness\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eQuestions to ask about cache correctness\u003c/h3\u003e\u003cul\u003e\u003cli\u003eIs the resident key globally scoped across customers/sources?\u003c/li\u003e\u003cli\u003eWhich timestamps trigger invalidation, and are deletes included?\u003c/li\u003e\u003cli\u003eHow do scheduled/PRN counts change as time passes?\u003c/li\u003e\u003cli\u003eDoes a model/schema/mapping deployment refresh all cached responses?\u003c/li\u003e\u003cli\u003eAre local PHQ, weights and known risks recomputed on hits?\u003c/li\u003e\u003cli\u003eWhat happens on discharge/offboarding or a failed refresh?\u003c/li\u003e\u003cli\u003eWhich cache-hit-rate metric proves calls avoided without sacrificing freshness?\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Integration Architecture\"\u003eSource · Integration Architecture ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e", "api": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e06 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eTransport success is not application success\u003c/h2\u003e\u003cp\u003eThe route is spelled /inferance. Preserve that contract. The response lab explains the HTTP 200 error-envelope trap without contacting any service.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Two API boundaries\" data-bookmark=\"Two API boundaries\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eTwo API boundaries\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOwner\u003c/th\u003e\u003cth\u003eRoute\u003c/th\u003e\u003cth\u003eAuth /shape\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eEHR adapter\u003c/td\u003e\u003ctd\u003ePOST /api/calculate\u003c/td\u003e\u003ctd\u003eNo documented application inbound auth; EHR data +known_risks\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDSAIL model\u003c/td\u003e\u003ctd\u003ePOST /inferance\u003c/td\u003e\u003ctd\u003eJWT client_id; feature request; raw success JSON\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDSAIL model\u003c/td\u003e\u003ctd\u003ePOST /dc-table\u003c/td\u003e\u003ctd\u003eJWT; create/verify capture table\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDSAIL model\u003c/td\u003e\u003ctd\u003eGET /health\u003c/td\u003e\u003ctd\u003ePublic health route\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDSAIL model\u003c/td\u003e\u003ctd\u003eGET /docs and /redoc\u003c/td\u003e\u003ctd\u003ePublic docs routes\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"API Endpoints (PROD Deployment)\"\u003eSource · API Endpoints (PROD Deployment) ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eError-envelope inspector\u003c/h3\u003e\u003cdiv class=\"actions\"\u003e\u003cselect id=\"response-case\" aria-label=\"Response scenario\"\u003e\u003coption value=\"success\"\u003eHTTP 200 · valid success\u003c/option\u003e\u003coption value=\"application\"\u003eHTTP 200 · statusCode 500 envelope\u003c/option\u003e\u003coption value=\"auth\"\u003eHTTP 401 · token failure\u003c/option\u003e\u003coption value=\"unavailable\"\u003eHTTP 503 · gateway unavailable\u003c/option\u003e\u003coption value=\"malformed\"\u003eHTTP 200 · missing details\u003c/option\u003e\u003c/select\u003e\u003cbutton id=\"response-copy\"\u003eCopy sample\u003c/button\u003e\u003c/div\u003e\u003cpre id=\"response-example\"\u003e\u003c/pre\u003e\u003cdiv id=\"response-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eTransport-only check illustrates the documented current adapter behaviour. Proposed robust detection checks both HTTP status and application envelope, then expected success shape. This is not a complete schema validator.\u003c/p\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark DSAIL request sample\" data-bookmark=\"DSAIL request sample\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eDSAIL request sample\u003c/h3\u003e\u003cbutton class=\"copy\" data-copy=\"request-json\"\u003eCopy JSON\u003c/button\u003e\u003cpre id=\"request-json\"\u003e\u003ccode\u003e{\n \u0026quot;source\u0026quot;: \u0026quot;string\u0026quot;,\n \u0026quot;data_source_id\u0026quot;: \u0026quot;string\u0026quot;,\n \u0026quot;corporate_id\u0026quot;: \u0026quot;string\u0026quot;,\n \u0026quot;customer_id\u0026quot;: \u0026quot;string\u0026quot;,\n \u0026quot;details\u0026quot;: [\n   {\n     \u0026quot;entity_id\u0026quot;: \u0026quot;string (resident identifier)\u0026quot;,\n     \u0026quot;features\u0026quot;: [\n       {\n         \u0026quot;feature_name\u0026quot;: \u0026quot;string\u0026quot;,\n         \u0026quot;feature_value\u0026quot;: \u0026quot;number | string | array\u0026quot;\n       }\n     ]\n   }\n ]\n}\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003eTop level required: source, data_source_id, corporate_id, customer_id and non-empty details[].\u003c/li\u003e\u003cli\u003eEach entity requires entity_id and non-empty features[].\u003c/li\u003e\u003cli\u003eIcd10 must be an array. Other feature values numeric or convertible to numeric.\u003c/li\u003e\u003cli\u003eAbsent model features filled with None. Placeholder schema values shown here are not executable real resident inputs.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Input Schema\"\u003eSource · Input Schema ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Raw model response sample\" data-bookmark=\"Raw model response sample\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRaw model response sample\u003c/h3\u003e\u003cbutton class=\"copy\" data-copy=\"response-json\"\u003eCopy JSON\u003c/button\u003e\u003cpre id=\"response-json\"\u003e\u003ccode\u003e{\n \u0026quot;source\u0026quot;: \u0026quot;SNF\u0026quot;,\n \u0026quot;data_source_id\u0026quot;: \u0026quot;DS001\u0026quot;,\n \u0026quot;corporate_id\u0026quot;: \u0026quot;30\u0026quot;,\n \u0026quot;customer_id\u0026quot;: \u0026quot;27\u0026quot;,\n \u0026quot;details\u0026quot;: [\n   {\n     \u0026quot;entity_id\u0026quot;: 1,\n     \u0026quot;unique_resident_id\u0026quot;: \u0026quot;SNF-DS001-30-27-PAT-1\u0026quot;,\n     \u0026quot;timestamp\u0026quot;: \u0026quot;2024-05-06T01:51:28.171889\u0026quot;,\n     \u0026quot;score\u0026quot;: 0.3857,\n     \u0026quot;factors_considered\u0026quot;: [\n       { \u0026quot;feature_name\u0026quot;: \u0026quot;how_did_the_resident_bathe_independent\u0026quot;, \u0026quot;feature_value\u0026quot;: 5.0, \u0026quot;shap_value\u0026quot;: -0.0491 },\n       { \u0026quot;feature_name\u0026quot;: \u0026quot;how_did_the_resident_bathe_not_recorded\u0026quot;, \u0026quot;feature_value\u0026quot;: 26.0, \u0026quot;shap_value\u0026quot;: 0.0 },\n       { \u0026quot;feature_name\u0026quot;: \u0026quot;historyof\u0026quot;, \u0026quot;feature_value\u0026quot;: null, \u0026quot;shap_value\u0026quot;: null }\n     ]\n   }\n ]\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003escore is positive-class probability rounded to four decimals. All 1,618 feature entries are returned unranked, though this example only shows three. An absent value has null SHAP. Entity_id is a string in the request description but numeric in this sample; verify actual contract.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Output Schema\"\u003eSource · Output Schema ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Failure semantics\" data-bookmark=\"Failure semantics\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eFailure semantics\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eScenario\u003c/th\u003e\u003cth\u003eHTTP\u003c/th\u003e\u003cth\u003eApplication /meaning\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMissing required field\u003c/td\u003e\u003ctd\u003e200\u003c/td\u003e\u003ctd\u003estatusCode 500; error body; exact message depends on failure\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIcd10 not array\u003c/td\u003e\u003ctd\u003e200\u003c/td\u003e\u003ctd\u003estatusCode 500; Invalid format of Icd10\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModelError /unknown exception\u003c/td\u003e\u003ctd\u003e200\u003c/td\u003e\u003ctd\u003estatusCode 500 error envelope\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMissing/invalid/expired JWT or client_id claim\u003c/td\u003e\u003ctd\u003e401\u003c/td\u003e\u003ctd\u003eGateway rejection\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eService unavailable\u003c/td\u003e\u003ctd\u003e503\u003c/td\u003e\u003ctd\u003eGateway error\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eVerified main-copy description says success has no statusCode/body envelope. Generic sequence diagrams elsewhere wrap success and show 400/422 validation errors. Prefer the explicit verified contract, while checking the actual deployed PROD route.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Error Handling and Resilience (PROD Service)\"\u003eSource · Error Handling and Resilience (PROD Service) ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eProposed test plan\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Proposed consumer contract tests\" data-bookmark=\"Proposed consumer contract tests\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eProposed consumer contract tests\u003c/h3\u003e\u003cul\u003e\u003cli\u003eRaw success details array, score range/precision, all features and null handling.\u003c/li\u003e\u003cli\u003eHTTP 200 with application statusCode 500 and JSON-string body.\u003c/li\u003e\u003cli\u003e401,503, invalid JSON and 200 malformed success.\u003c/li\u003e\u003cli\u003eEmpty details/features and scalar Icd10.\u003c/li\u003e\u003cli\u003eUnique resident identifiers and echoed metadata.\u003c/li\u003e\u003cli\u003eFeature ordering/mapping, duplicate names and numeric conversions.\u003c/li\u003e\u003cli\u003eJWT expiry/claims and cache-hit/miss behaviours.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Testing and Validation\"\u003eSource · Testing and Validation ↗\u003c/button\u003e\u003c/article\u003e", "operations": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e07 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eArtifacts, process counts and resource budgets\u003c/h2\u003e\u003cp\u003eKeep adapter and model operations separate. Resource arithmetic is reproducible; latency, concurrency capacity and cost require measurement.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eDSAIL startup\u003c/h3\u003e\u003cdiv class=\"startup-grid\"\u003e\u003cdiv\u003e\u003cb\u003e1\u003c/b\u003e\u003ch4\u003eProvision\u003c/h4\u003e\u003cp\u003eTrueFoundry deploys four replicas\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e2\u003c/b\u003e\u003ch4\u003eResolve artifacts\u003c/h4\u003e\u003cp\u003eRegistry FQNs provide model/explainer directories\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e3\u003c/b\u003e\u003ch4\u003eStart workers\u003c/h4\u003e\u003cp\u003eCommand specifies seven Uvicorn processes\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e4\u003c/b\u003e\u003ch4\u003eLoad bundle\u003c/h4\u003e\u003cp\u003eEach worker loads model and explainer pickles\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e5\u003c/b\u003e\u003ch4\u003eAlign schema\u003c/h4\u003e\u003cp\u003efeature_list.yml and model.feature_names_\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e6\u003c/b\u003e\u003ch4\u003eServe\u003c/h4\u003e\u003cp\u003ePort 8000; JWT at gateway; direct model inference\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eNo Gunicorn pre-fork copy-on-write sharing is documented for DSAIL. Model_fn is shown in the request sequence and in startup; exact reuse/loading frequency needs source profiling.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eTwo-tier resource planner\u003c/h3\u003e\u003clabel class=\"range-label\"\u003eAdapter replicas \u003coutput id=\"adapter-replicas-label\"\u003e\u003c/output\u003e\u003cinput id=\"adapter-replicas\" type=\"range\" min=\"1\" max=\"12\" value=\"6\" step=\"1\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eDSAIL replicas \u003coutput id=\"model-replicas-label\"\u003e\u003c/output\u003e\u003cinput id=\"model-replicas\" type=\"range\" min=\"1\" max=\"12\" value=\"4\" step=\"1\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eDSAIL worker processes /replica \u003coutput id=\"model-workers-label\"\u003e\u003c/output\u003e\u003cinput id=\"model-workers\" type=\"range\" min=\"1\" max=\"12\" value=\"7\" step=\"1\"\u003e\u003c/label\u003e\u003cdiv id=\"resource-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv id=\"resource-chart\"\u003e\u003c/div\u003e\u003cbutton id=\"resource-reset\"\u003eRestore source configuration\u003c/button\u003e\u003cp class=\"small\"\u003eAdapter GiB and DSAIL MB remain separate. Model workers do not multiply pod resource reservations. EFS200 GB is the reported artifact volume; its per-pod/shared scope is not established.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Deployment configuration\" data-bookmark=\"Deployment configuration\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eDeployment configuration\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSetting\u003c/th\u003e\u003cth\u003eAdapter\u003c/th\u003e\u003cth\u003eDSAIL\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eReplicas\u003c/td\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCPU request /limit\u003c/td\u003e\u003ctd\u003e0.5 /1\u003c/td\u003e\u003ctd\u003e5 /6\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMemory request /limit\u003c/td\u003e\u003ctd\u003e1 /2 GiB\u003c/td\u003e\u003ctd\u003e5000 /6000 MB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTemporary storage\u003c/td\u003e\u003ctd\u003eNot supplied\u003c/td\u003e\u003ctd\u003e1000 /2000 MB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eArtifact cache\u003c/td\u003e\u003ctd\u003eAdapter mapping from S3\u003c/td\u003e\u003ctd\u003e200 GB EFS\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRuntime\u003c/td\u003e\u003ctd\u003ePython 3.12\u003c/td\u003e\u003ctd\u003ePython 3.9\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWorker command\u003c/td\u003e\u003ctd\u003eNot supplied\u003c/td\u003e\u003ctd\u003e--workers 7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eConcurrency env\u003c/td\u003e\u003ctd\u003eNot supplied\u003c/td\u003e\u003ctd\u003eUVICORN_WEB_CONCURRENCY=10\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAuth\u003c/td\u003e\u003ctd\u003eNo app inbound auth\u003c/td\u003e\u003ctd\u003eJWT gateway with client_id\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHealth probes\u003c/td\u003e\u003ctd\u003eDisabled in Helm snapshot\u003c/td\u003e\u003ctd\u003e/health; does not check external dependencies\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Production Resource Configuration\"\u003eSource · Production Resource Configuration ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eConcurrency is unresolved:\u003c/b\u003e command says 7 workers/replica; environment says 10; summary sometimes calls 10 workers; table says total 70 while its text calculates 4×7×10=280. Four replicas with seven worker processes means 28 processes. The environment value does not establish a further concurrency multiplier or measured throughput.\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Artifact and version map\" data-bookmark=\"Artifact and version map\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eArtifact and version map\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eItem\u003c/th\u003e\u003cth\u003eCurrent /planned\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eModel\u003c/td\u003e\u003ctd\u003emodel.pickle; CatBoost 1.2.2; model 2023-12-05; deploymentv 12\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplainer\u003c/td\u003e\u003ctd\u003eexplainer.pickle; SHAP0.43.0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFeature list\u003c/td\u003e\u003ctd\u003efeature_list.yml;1,618 features\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRegistry\u003c/td\u003e\u003ctd\u003eTrueFoundry ihs-saas-nonprod-depr-repo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIdentity\u003c/td\u003e\u003ctd\u003eMODEL_FQN /EXPLAINER_FQN; register_model.py\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResolved directories\u003c/td\u003e\u003ctd\u003edepr_model /depr_explainer\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePlanned S3 model\u003c/td\u003e\u003ctd\u003ercs-ehr-cai-s 3-{env}/depression_risk/v 1/model.pickle\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePlanned S3 explainer\u003c/td\u003e\u003ctd\u003edepression_risk/v 1/explainer.pickle\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOverrides\u003c/td\u003e\u003ctd\u003eDEPR_MODEL_S3_BUCKET /DEPR_MODEL_S3_KEY /DEPR_EXPLAINER_S3_KEY\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eS3 hosting and layered monorepo reorganisation are planned/in progress, not a confirmed production cutover. Preserve model, explainer, schema and factor mapping compatibility.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Artifact Registry Integration\"\u003eSource · Artifact Registry Integration ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Runtime environment and pinned stack\" data-bookmark=\"Runtime environment and pinned stack\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRuntime environment and pinned stack\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eVariable /dependency\u003c/th\u003e\u003cth\u003ePurpose /reported value\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMODEL_FQN /EXPLAINER_FQN\u003c/td\u003e\u003ctd\u003eRegistry artifact versions\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003edepr_model /depr_explainer\u003c/td\u003e\u003ctd\u003eLocal artifact directories\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDATA_CAPTURE /ENVIRONMENT\u003c/td\u003e\u003ctd\u003eCapture table /prod ornonprod\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWORKSPACE_FQN /INTEGRATION_FQN\u003c/td\u003e\u003ctd\u003eTrueFoundry workspace /auth integration\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eENDPOINT /MODEL_ENDPOINT\u003c/td\u003e\u003ctd\u003eEndpoint parameters; not evidence of a model API call in predict_fn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUVICORN_WEB_CONCURRENCY /LOGGING_LEVEL\u003c/td\u003e\u003ctd\u003e10 /INFO defaults as reported\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_IHS_CACHE\u003c/td\u003e\u003ctd\u003eAdapter cache flag\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_DEPRESSION_POC_SHAP_THRESHOLD\u003c/td\u003e\u003ctd\u003e0.04 ADL cutoff\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_DEPRESSION_DIAGNOSIS_SHAP_THRESHOLD\u003c/td\u003e\u003ctd\u003e0.0 diagnosis cutoff\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePinned DSAIL stack\u003c/td\u003e\u003ctd\u003ePython 3.9; CatBoost 1.2.2; scikit-learn 1.2.0; SHAP0.43.0; numba 0.58.1; numpy 1.24.4\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Runtime Configuration (PROD Deployment)\"\u003eSource · Runtime Configuration (PROD Deployment) ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Observability and performance\" data-bookmark=\"Observability and performance\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eObservability and performance\u003c/h3\u003e\u003cul\u003e\u003cli\u003eAdapter: loguru and Datadog APM with 0.1% sampling. Track both cache avoided calls and downstream latency.\u003c/li\u003e\u003cli\u003eModel: stdout/stderr, TrueFoundry/Kubernetes instrumentation and warehouse capture. Exact live alerts/tracing are not documented.\u003c/li\u003e\u003cli\u003eREADME states 50–200 ms/resident and SHAP\u0026lt;100 ms, but benchmark methodology is absent. Treat as reported estimates, not SLOs.\u003c/li\u003e\u003cli\u003e~2000+RPS is explicitly estimated; do not quote it as measured capacity. Batch size, worker saturation and payload 1,618 features/resident matter.\u003c/li\u003e\u003cli\u003eProposed: end-to-end p 50/p 95, downstream errors, capture failure backlog, cache freshness and clinical flag distribution.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Performance and Scalability\"\u003eSource · Performance and Scalability ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eProposed design\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Migration and resilience plan\" data-bookmark=\"Migration and resilience plan\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eMigration and resilience plan\u003c/h3\u003e\u003cul\u003e\u003cli\u003eObtain model card, training lineage and baseline request/response fixtures.\u003c/li\u003e\u003cli\u003eRe-export/retrain pinned model/explainer for a supported Python runtime; compare predictions, SHAP, factor selections and final flags.\u003c/li\u003e\u003cli\u003eIf moving artifacts to S3, validate startup identity/access, schema alignment and per-worker memory.\u003c/li\u003e\u003cli\u003eRelease version-aware cache invalidation with model rollout; define rollback bundle and cache behaviour.\u003c/li\u003e\u003cli\u003eAdd bounded retry/token reuse, inbound adapter auth and enabled probes.\u003c/li\u003e\u003cli\u003eClinical/regulatory/privacy review and measured staging capacity are gates; owning hosting alone does not transfer training/governance ownership.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Open Decisions\"\u003eSource · Open Decisions ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eIncident playbook\u003c/h3\u003e\u003cdiv id=\"incidents\"\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Tests and branch boundaries\" data-bookmark=\"Tests and branch boundaries\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eTests and branch boundaries\u003c/h3\u003e\u003cul\u003e\u003cli\u003eListed tests: test_model_load.py, test_preprocess.py, test_app.py, test_shap_values.py. README states integration CI on prod pull requests; results are not attached.\u003c/li\u003e\u003cli\u003eManual checks: /health, authenticated /inferance and /dc-table.\u003c/li\u003e\u003cli\u003eOriginal DSAIL main is described as development. The rcs-ehr-cai main mirror has imported production code undergoing reorganisation. These are distinct main branches.\u003c/li\u003e\u003cli\u003eThe structural tree mentions training workflows/notebooks, while explicit text says training code is absent. Do not infer a reproducible training pipeline from a directory label.\u003c/li\u003e\u003cli\u003eProposed end-to-end tests should assert adapter evidence selection, seven-category deduplication, cache policy and application-error parsing.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Testing and Validation\"\u003eSource · Testing and Validation ↗\u003c/button\u003e\u003c/article\u003e", "governance": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e08 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eEvidence, privacy and model governance\u003c/h2\u003e\u003cp\u003eNo validation metrics are supplied. The useful chart here is the evidence gap, not a fabricated ROC curve.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eEvidence coverage from the source\u003c/h3\u003e\u003cdiv id=\"evidence-coverage\"\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eThis is documentation coverage, not a model-quality score. A missing item may exist with DSAIL; it was not provided here.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Model card to request from DSAIL\" data-bookmark=\"Model card to request from DSAIL\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eModel card to request from DSAIL\u003c/h3\u003e\u003cul\u003e\u003cli\u003eTraining population, volume, dates, inclusion/exclusion and label definition.\u003c/li\u003e\u003cli\u003eValidation split strategy, leakage controls and external/temporal evaluation.\u003c/li\u003e\u003cli\u003eAUC, sensitivity, specificity, precision, prevalence and calibration at stated operating points.\u003c/li\u003e\u003cli\u003eSubgroup results by age, sex, race/ethnicity and facility type with uncertainty.\u003c/li\u003e\u003cli\u003eRetraining cadence, drift baseline/active alerts and reproducible training pipeline.\u003c/li\u003e\u003cli\u003eArtifact identities, feature schema, attribution scale and intended use.\u003c/li\u003e\u003cli\u003eUptime SLA, latency SLO, incident process and PHI agreements.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Model Summary\"\u003eSource · Model Summary ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark What can actually be claimed\" data-bookmark=\"What can actually be claimed\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhat can actually be claimed\u003c/h3\u003e\u003cp\u003eModel identity, feature count, deployed architecture and transparent flag composition are documented. Accuracy, calibration, real-world lift, false-positive burden and flag sensitivity cannot be quantified from this README.\u003c/p\u003e\u003cp\u003eEvaluate the final resident flag and the evidence-selection policy as well as the classifier. A factor count can be interpretable without being calibrated or clinically validated.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark PHI data flow\" data-bookmark=\"PHI data flow\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003ePHI data flow\u003c/h3\u003e\u003cul\u003e\u003cli\u003eEHR → adapter → DSAIL contains resident/source/customer identifiers, diagnosis categories, medication-class counts and ADL counts.\u003c/li\u003e\u003cli\u003eLinkable pseudonymous data remains PHI; it crosses a team/platform boundary.\u003c/li\u003e\u003cli\u003eFull DSAIL response persists in adapter Postgres without expiry.\u003c/li\u003e\u003cli\u003eFull request/response is captured in a Snowflake warehouse table.\u003c/li\u003e\u003cli\u003eConfirm retention, encryption, access list, contractual data-use/BAA coverage and discharge/customer purge.\u003c/li\u003e\u003cli\u003eInbound adapter auth is absent; outbound OAuth2 plus DSAIL JWT is a separate control.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Security and Compliance Considerations\"\u003eSource · Security and Compliance Considerations ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Regulatory and ownership\" data-bookmark=\"Regulatory and ownership\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRegulatory and ownership\u003c/h3\u003e\u003cp\u003eRegulatory classification and intended-use wording are TBD. The FAQ positions the output as screening support rather than diagnosis. Do not assert a regulatory determination.\u003c/p\u003e\u003cp\u003eDSAIL owns model quality/retraining/uptime; RCS owns the integration and clinician experience. Monorepo copying does not alone resolve ownership, SLA, data rights or model-change approval.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Open Decisions\"\u003eSource · Open Decisions ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eInference success and audit success can diverge\u003c/h3\u003e\u003cdiv class=\"actions\"\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"capture-inference\" checked\u003e Inference succeeds\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"capture-write\" checked\u003e Warehouse write succeeds\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"capture-pod\"\u003e Pod exits before task finishes\u003c/label\u003e\u003c/div\u003e\u003cdiv id=\"capture-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cp\u003eSuccessful predictions schedule req_res_merge() → push_async.data_capture() with asyncio.create_task(). The caller need not wait for the warehouse. Warehouse offline may retry with backoff; network timeout may silently fail. Durable completion, flush-on-shutdown and all-error capture are not established.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Captured schema\" data-bookmark=\"Captured schema\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eCaptured schema\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eField\u003c/th\u003e\u003cth\u003ePurpose\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003erequest_id\u003c/td\u003e\u003ctd\u003eUUID\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003etimestamp\u003c/td\u003e\u003ctd\u003eUTC capture time\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003erequest_body\u003c/td\u003e\u003ctd\u003eFull inference request JSON\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eresponse_body\u003c/td\u003e\u003ctd\u003eFull prediction JSON\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eresident_count\u003c/td\u003e\u003ctd\u003eEntities per request\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eenvironment\u003c/td\u003e\u003ctd\u003eDeployment environment\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003erequest_duration_ms\u003c/td\u003e\u003ctd\u003eRecorded inference duration\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eSetup route: authenticated POST /dc-table, using DATA_CAPTURE and ENVIRONMENT. Capture aids lineage/monitoring; enablement alone does not prove completeness, active drift alerts or an outcome-linked evaluation pipeline.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Captured Data Structure\"\u003eSource · Captured Data Structure ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Prioritised gap register\" data-bookmark=\"Prioritised gap register\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003ePrioritised gap register\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eGap\u003c/th\u003e\u003cth\u003eEffect\u003c/th\u003e\u003cth\u003eNext step\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNo model performance evidence\u003c/td\u003e\u003ctd\u003eUnverifiable quality claims\u003c/td\u003e\u003ctd\u003eDSAIL model card and final-flag backtest\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo SLA documented\u003c/td\u003e\u003ctd\u003eCross-team outage risk\u003c/td\u003e\u003ctd\u003eAgree SLOs/incident escalation\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOld pinned runtime/artifacts\u003c/td\u003e\u003ctd\u003eMaintenance and upgrade friction\u003c/td\u003e\u003ctd\u003eRe-export/retrain +baseline\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo training code/lineage here\u003c/td\u003e\u003ctd\u003eReproducibility gap\u003c/td\u003e\u003ctd\u003eObtain owned pipeline/evidence\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePHI captured and cached\u003c/td\u003e\u003ctd\u003eRetention/privacy exposure\u003c/td\u003e\u003ctd\u003ePrivacy review and purge policy\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo active retry/token reuse\u003c/td\u003e\u003ctd\u003eTransient whole-batch failure\u003c/td\u003e\u003ctd\u003eUse maintained helper/token cache\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo cache TTL/version awareness\u003c/td\u003e\u003ctd\u003eMoving-window/model staleness\u003c/td\u003e\u003ctd\u003eFeature fingerprint +TTL +version\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResident\u0026gt;3 vsgraph 5\u003c/td\u003e\u003ctd\u003eInconsistent UI interpretation\u003c/td\u003e\u003ctd\u003eProduct-approved shared definition\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSequential known_risks\u003c/td\u003e\u003ctd\u003eStacked latency/upstream dependence\u003c/td\u003e\u003ctd\u003eEnd-to-end monitoring\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eShared nonprod endpoint\u003c/td\u003e\u003ctd\u003eEnvironment interference\u003c/td\u003e\u003ctd\u003eQuotas/separate endpoints\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo adapter auth/probes disabled\u003c/td\u003e\u003ctd\u003eDefense/self-healing gap\u003c/td\u003e\u003ctd\u003eAuth and probes\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eProbability unused for flag\u003c/td\u003e\u003ctd\u003eUnvalidated evidence-selection policy\u003c/td\u003e\u003ctd\u003eExplicit intended behaviour; validate alternatives\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHTTP 200 error envelope\u003c/td\u003e\u003ctd\u003eOpaque parse failures\u003c/td\u003e\u003ctd\u003eEnvelope-aware contract checks\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Known Risks and Gaps\"\u003eSource · Known Risks and Gaps ↗\u003c/button\u003e\u003c/article\u003e", "interview": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e09 / INTERVIEW WORKBENCH\u003c/span\u003e\u003ch2\u003eRecall it. Explain it. Defend it.\u003c/h2\u003e\u003cp\u003ePractice with revealable answers, confidence ratings and a timed rehearsal. Project facts are documented; ownership and achievements must come from your own experience.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eYour project narrative\u003c/h3\u003e\u003cdiv class=\"tabs\"\u003e\u003cbutton data-pitch=\"30\" class=\"selected\"\u003e30 seconds\u003c/button\u003e\u003cbutton data-pitch=\"90\"\u003e90 seconds\u003c/button\u003e\u003cbutton data-pitch=\"180\"\u003e3 minutes\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"pitch\"\u003e\u003c/div\u003e\u003cbutton id=\"copy-pitch\"\u003eCopy narrative\u003c/button\u003e\u003cp class=\"small\"\u003eService-centric template. Add “I” only for work you actually owned; the README does not establish personal contribution.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003ePractice timer\u003c/h3\u003e\u003cdiv id=\"timer-display\" class=\"timer\"\u003e01:30\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"timer-start\" class=\"primary\"\u003eStart\u003c/button\u003e\u003cbutton id=\"timer-reset\"\u003eReset\u003c/button\u003e\u003cselect id=\"timer-length\" aria-label=\"Practice duration\"\u003e\u003coption value=\"30\"\u003e30 seconds\u003c/option\u003e\u003coption value=\"90\" selected\u003e90 seconds\u003c/option\u003e\u003coption value=\"180\"\u003e3 minutes\u003c/option\u003e\u003coption value=\"600\"\u003e10 minutes\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cp id=\"timer-prompt\"\u003eExplain the system, the V 2 trade-off and the next validation gate.\u003c/p\u003e\u003cbutton id=\"random-question\"\u003eGive me a random question\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-top\"\u003e\u003ch3\u003eQuestion bank\u003c/h3\u003e\u003cspan id=\"study-progress\" class=\"tag\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cselect id=\"question-category\" aria-label=\"Question category\"\u003e\u003coption value=\"all\"\u003eAll categories\u003c/option\u003e\u003c/select\u003e\u003cselect id=\"question-filter\" aria-label=\"Confidence filter\"\u003e\u003coption value=\"all\"\u003eAll confidence levels\u003c/option\u003e\u003coption value=\"unrated\"\u003eNot yet rated\u003c/option\u003e\u003coption value=\"review\"\u003eNeeds review\u003c/option\u003e\u003coption value=\"ready\"\u003eConfident\u003c/option\u003e\u003c/select\u003e\u003cbutton id=\"collapse-questions\"\u003eCollapse answers\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"questions\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003ePersonal evidence notebook\u003c/h3\u003e\u003cp\u003eYour notes stay in this browser when storage is available. Back up as JSON to move them across computers or browsers.\u003c/p\u003e\u003clabel class=\"field\"\u003eWhat I actually owned\u003ctextarea id=\"note-role\" rows=\"5\" placeholder=\"Scope, dates, specific PRs, decisions, collaborators and constraints…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eMeasured impact and evidence\u003ctextarea id=\"note-impact\" rows=\"5\" placeholder=\"Only verified latency, memory, regression, release or quality figures. Include baseline, dates, cohort and source…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eSTAR story and trade-offs\u003ctextarea id=\"note-story\" rows=\"6\" placeholder=\"Situation → task → action → result. What alternatives did you consider? What did you learn?…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eLatest updates / facts to refresh\u003ctextarea id=\"note-updates\" rows=\"5\" placeholder=\"Current production version, rollout date, validation results, new metrics, open decisions…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003cspan id=\"save-status\" class=\"small\" role=\"status\"\u003e\u003c/span\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"export-notes\"\u003eExport notes + progress\u003c/button\u003e\u003cbutton id=\"import-notes\"\u003eImport backup\u003c/button\u003e\u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden\u003e\u003c/div\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eBefore the next interview\u003c/h3\u003e\u003cdiv id=\"checklist\"\u003e\u003c/div\u003e\u003ch4\u003eUnknowns to fill with evidence\u003c/h4\u003e\u003cul\u003e\u003cli\u003eActive customers/facilities and residents scored per day\u003c/li\u003e\u003cli\u003eBatch p 50/p 95 and 5 xx error rate\u003c/li\u003e\u003cli\u003eStaging V 2 RSS/PSS, startup and CPU measurements\u003c/li\u003e\u003cli\u003eMonthly infrastructure cost\u003c/li\u003e\u003cli\u003eLatest model version, flag definition and migration decisions\u003c/li\u003e\u003cli\u003eRegulatory/clinical sign-off and subgroup results\u003c/li\u003e\u003cli\u003eVerified personal ownership and concrete artifacts\u003c/li\u003e\u003c/ul\u003e\u003cp class=\"small\"\u003eAll these operational metrics are TBD or unverified in the supplied source.\u003c/p\u003e\u003cdiv id=\"bookmarks-list\"\u003e\u003c/div\u003e\u003c/article\u003e\u003c/div\u003e", "source": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e10 / DEPRESSION RISK\u003c/span\u003e\u003ch2\u003eKeep the original source close\u003c/h2\u003e\u003cp\u003eThe entire attached README is embedded unchanged. Curated notes flag scope changes, contradictions and missing evidence.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u0
