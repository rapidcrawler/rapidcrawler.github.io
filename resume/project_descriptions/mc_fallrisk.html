"\u003eAll these operational metrics are TBD or unverified in the supplied source.\u003c/p\u003e\u003cdiv id=\"bookmarks-list\"\u003e\u003c/div\u003e\u003c/article\u003e\u003c/div\u003e", "source": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e09 / SOURCE \u0026 PROVENANCE\u003c/span\u003e\u003ch2\u003eKeep the evidence close\u003c/h2\u003e\u003cp\u003eThe complete original README is embedded in this file. Section links let you trace curated notes back to their source without a network connection.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark What this reference knows\" data-bookmark=\"What this reference knows\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhat this reference knows\u003c/h3\u003e\u003cul\u003e\u003cli\u003eAuthoritative input: mc_fallrisk_service.md; scope runtime services/ml_services/fallrisk, training models/fallrisk and helm-values/fallrisk*.\u003c/li\u003e\u003cli\u003eSnapshot: 1 October 2026. No repository checkout, trained artifacts or linked notebooks were provided.\u003c/li\u003e\u003cli\u003eDocumented facts are labelled; new operating plans and interview design advice are labelled proposed. Derived metrics are labelled computed.\u003c/li\u003e\u003cli\u003eModel/clinical calculators implement the published formulas; learned prediction, threshold curves, measured latency and infrastructure savings cannot be reproduced from this README alone.\u003c/li\u003e\u003cli\u003eRelated documentation paths are repository references, not files embedded here.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Project Introduction\"\u003eSource · Project Introduction ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Ambiguities to verify in the repository\" data-bookmark=\"Ambiguities to verify in the repository\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eAmbiguities to verify in the repository\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTopic\u003c/th\u003e\u003cth\u003eSource conflict or limitation\u003c/th\u003e\u003cth\u003eUse in an interview\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ePython version\u003c/td\u003e\u003ctd\u003eHeader/config show 3.12; V 1 production table shows 3.9\u003c/td\u003e\u003ctd\u003eState version-specific snapshot; verify image/tag\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTraining location\u003c/td\u003e\u003ctd\u003eRuntime artifact section says external/not in repo; intro scopes models/fallrisk notebooks\u003c/td\u003e\u003ctd\u003eTreat runtime-focused statement as branch/scope-dependent\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEvaluation unit\u003c/td\u003e\u003ctd\u003e2,000 resident-days vs residents; actual falls vs fallers\u003c/td\u003e\u003ctd\u003eCall it documented observations; verify denominator and grouping\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCapabilities\u003c/td\u003e\u003ctd\u003eAll dropped vs NET_BIND_SERVICE allowed\u003c/td\u003e\u003ctd\u003eCheck actual Docker/Helm securityContext\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eProbe route\u003c/td\u003e\u003ctd\u003e/api/health vs /api/monitoring/health\u003c/td\u003e\u003ctd\u003eVerify router and values before enabling\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTests path\u003c/td\u003e\u003ctd\u003eapi/tests entries vs tests/ tree\u003c/td\u003e\u003ctd\u003eLocate actual checkout tests\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePsychotropic day 7\u003c/td\u003e\u003ctd\u003eWithin 7 and 7–30 overlap\u003c/td\u003e\u003ctd\u003eCheck comparison operators and timestamps\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHoldout metrics\u003c/td\u003e\u003ctd\u003eAveraging and error-rate denominators unspecified\u003c/td\u003e\u003ctd\u003eQuote reported numbers; avoid inferred confusion counts\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRounding and recent falls\u003c/td\u003e\u003ctd\u003eAPI rounding and other boost windows omitted\u003c/td\u003e\u003ctd\u003eShow mathematical result; don’t claim exact deployed rounding\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDependency versions\u003c/td\u003e\u003ctd\u003eReported versions may be branch-specific\u003c/td\u003e\u003ctd\u003eVerify lockfile/image; no external verification performed\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Service Configuration\"\u003eSource · Service Configuration ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-top\"\u003e\u003ch3\u003eFull source · 1,270 lines\u003c/h3\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"source-expand\"\u003eExpand sections\u003c/button\u003e\u003cbutton id=\"source-collapse\"\u003eCollapse sections\u003c/button\u003e\u003cbutton id=\"download-source\"\u003eDownload original README\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cinput id=\"source-search\" type=\"search\" placeholder=\"Filter README sections…\" aria-label=\"Filter README sections\"\u003e\u003cdiv id=\"source-index\"\u003e\u003c/div\u003e\u003cdiv id=\"source-sections\"\u003e\u003c/div\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Glossary\" data-bookmark=\"Glossary\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eGlossary\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTerm\u003c/th\u003e\u003cth\u003eMeaning\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMDS\u003c/td\u003e\u003ctd\u003eMinimum Data Set resident assessment\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSection G /GG\u003c/td\u003e\u003ctd\u003eFunctional status; GG mobility/self-care replaces G ADL items\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eADL /POC\u003c/td\u003e\u003ctd\u003eActivities of Daily Living /Point-of-Care documentation\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePsychotropic\u003c/td\u003e\u003ctd\u003eMedication affecting mental processes; qualifying categories defined by service mappings\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSHAP\u003c/td\u003e\u003ctd\u003eFeature attribution for model output; not proof of cause\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRecall /sensitivity\u003c/td\u003e\u003ctd\u003eTP /(TP+FN)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePrecision /PPV\u003c/td\u003e\u003ctd\u003eTP /(TP+FP)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFalse-positive rate\u003c/td\u003e\u003ctd\u003eFP /(FP+TN); differs from false alarms /all observations\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLift\u003c/td\u003e\u003ctd\u003ePrecision /prevalence\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHybrid\u003c/td\u003e\u003ctd\u003ePiecewise blend scaled 0–10; not a probability\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eShadow\u003c/td\u003e\u003ctd\u003eParallel evaluation without clinician-facing production cutover\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopy-on-write\u003c/td\u003e\u003ctd\u003eShared forked memory pages until modification\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReadiness /liveness\u003c/td\u003e\u003ctd\u003eAble to serve vs process health\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCalibration\u003c/td\u003e\u003ctd\u003eAlignment between predicted probabilities and observed outcomes\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Glossary\"\u003eSource · Glossary ↗\u003c/button\u003e\u003c/article\u003e"}, "questions": [{"category": "Architecture", "title": "Give me a high-level explanation of this project.", "answer": "It is a stateless FastAPI service for skilled-nursing fall risk. A validated resident batch feeds clinical rules and ML features/inference, then a piecewise hybrid blend emits 0–10 scores with explicit clinical and optional SHAP factors. An orchestrator calls it and delivers merged insights to the UI.", "follow": "Explain one resident end to end, then why a hybrid design was chosen.", "ref": "How It Works"}, {"category": "Architecture", "title": "Why combine clinical rules with ML?", "answer": "Rules provide clinically traceable indicators; ML learns patterns in historical outcomes. Combining them can complement signals, but the final blend is itself a model-like decision policy that requires validation. The V 2 results show that model-only gains need not improve the hybrid.", "follow": "How would you test whether the rules actually add value?", "ref": "Hybrid Score Fusion Formula"}, {"category": "Architecture", "title": "What are the boundaries of this microservice?", "answer": "It handles validation, feature construction, inference, explanation, fusion and response assembly. It does not own SQS consumption, UI persistence or the orchestrator’s optional S 3 request/output logs. Artifact S 3 reads occur at startup; there is no runtime DB dependency.", "follow": "Which dependencies can block startup versus inference?", "ref": "Deployment and Rollout"}, {"category": "Architecture", "title": "Is everything async and parallel?", "answer": "The README explicitly documents asyncio.gather for six clinical transformers. Clinical and ML branches are independent, but it does not conclusively specify concurrent scheduling between them. CPU-heavy predict/SHAP calls do not become parallel merely because a route is async. Verify code and profiling.", "follow": "How would you isolate event-loop blocking?", "ref": "Clinical Factor Score Formula"}, {"category": "Architecture", "title": "Where would you change hybrid logic?", "answer": "processor.py owns calculate_hybrid_score and resident-level fusion/assembly. Clinical transformer processing owns rules; ml_data_creator owns feature creation; ml_fall_risk_prediction owns inference; feature_influence_transformer owns SHAP.", "follow": "Which tests protect a formula change?", "ref": "Script-Level Visual Explainer"}, {"category": "Architecture", "title": "How is a resident excluded without failing the batch?", "answer": "After request-schema validation, remove_invalid_patient checks age 10–120 inclusive and admission≤calculation date. Ineligible residents return a null score and empty factors within a 200 response. They are not silently dropped.", "follow": "Contrast a resident eligibility failure with a 422 schema error.", "ref": "Input Schema"}, {"category": "Architecture", "title": "What if the final valid resident has no factors?", "answer": "A default “Age of resident” clinical factor is appended when neither scoring branch contributes factors. An invalid resident instead has no factors and a null score.", "follow": "Does disabling ML SHAP remove clinical factors?", "ref": "Hybrid Score Fusion Formula"}, {"category": "Architecture", "title": "What would you improve first in the API?", "answer": "Proposed: service-to-service auth, contract/regression tests, measured request limits, correct readiness/liveness paths and explicit model-version observability. Preserve the caller contract while changing internals.", "follow": "How would you add auth without breaking callers?", "ref": "Known Risks and Gaps"}, {"category": "Scoring", "title": "Walk through the documented clinical example.", "answer": "Balance change 20 + recent psychotropic 15×1 + pain 8 gives raw 43. Transform 2×43−43²/100 =67.51. The transformed clinical score then enters hybrid fusion with an ML score.", "follow": "At ML 80, which hybrid branch runs? Difference 12.49≤20 →8.0.", "ref": "Clinical Factor Score Formula"}, {"category": "Scoring", "title": "Why is psychotropic medication not binary?", "answer": "Its contribution is 15 times the maximum qualifying medication recency value:1 within 7 days,0.6 for 7–30,0.4 after 30 with active order,0.2 with no administration date. The README leaves the precise overlapping day 7 boundary to implementation.", "follow": "What happens with multiple medications? Take max, not sum.", "ref": "Clinical Factor Score Formula"}, {"category": "Scoring", "title": "Which clinical factor displays but does not score?", "answer": "Fall with injury has weight 0. Mobility device and mechanical lift are another nuance: one combined 12-point contribution but separate displayed factors.", "follow": "Can explanations be present without a numerical contribution?", "ref": "Clinical Factor Score Formula"}, {"category": "Scoring", "title": "Why apply the concave clinical transform?", "answer": "C=2 r−r²/100 raises low/mid values while keeping endpoints 0 and 100. At raw 50 it produces 75. The documentation describes its behaviour; it does not supply an empirical derivation of the curve.", "follow": "How would you validate or retune it clinically?", "ref": "Clinical Factor Score Formula"}, {"category": "Scoring", "title": "Explain all four hybrid branches in order.", "answer": "First both≥70 uses (high+low×(100−high)/150)/10. Else difference≤20 uses high/10. Else difference≤50 averages (M+C)/20. Else discounts high via (high−high×(50−low)/200)/10.", "follow": "Why does branch order matter when both are high and close?", "ref": "Hybrid Score Fusion Formula"}, {"category": "Scoring", "title": "Where does hybrid fusion create discontinuities?", "answer": "At difference 20 the higher score is used; just above 20 it becomes an average. At difference 50 it switches from averaging to a discount formula. Crossing the both-high condition can also change the policy abruptly. Explore exact boundary pairs before altering it.", "follow": "Would you require a monotonic, smooth fusion rule?", "ref": "Hybrid Score Fusion Formula"}, {"category": "Scoring", "title": "Is a hybrid score of 8 an 80% chance of falling?", "answer": "No. The score is a transformed and piecewise fused 0–10 index, not a documented calibrated probability. Even the ML probability is trained on an event-matched near-balanced dataset and is subject to a hard-coded recent-fall floor.", "follow": "What evidence would be needed to call it a probability?", "ref": "Model Performance"}, {"category": "Scoring", "title": "What does the recent-fall boost do?", "answer": "A fall in the last 30 days raises ML probability to at least 0.90. It is a rule outside the fitted model and may mask model output or complicate calibration. Other windows and exact timestamp boundaries are not supplied.", "follow": "Should SHAP explain the boosted or original output?", "ref": "How It Works"}, {"category": "Scoring", "title": "How would you recalibrate the hybrid for V 2?", "answer": "Proposed: collect aligned clinical/ML scores and future outcomes, define an SME-approved operating point, tune candidates on calibration data, freeze threshold and fusion, then evaluate on temporal/customer holdouts. Compare recall, precision, flag rate, calibration, subgroups and uncertainty.", "follow": "How do you prevent choosing the threshold on the test set?", "ref": "Open Decisions"}, {"category": "Scoring", "title": "Which exact weights must you remember?", "answer": "Balance 20; psychotropic 15×recency; device/lift 12; extensive assistance 11; admission 10; vitals 9; pain 8; nutrition 7; continence 5; behaviour 3; injury fall 0. Positive non-psychotropic weights total 85.", "follow": "How do six transformers produce 11 scoring/display indicators?", "ref": "Clinical Factor Score Formula"}, {"category": "ML \u0026 data", "title": "Why migrate from Random Forest to XGBoost?", "answer": "The README reports comparable holdout quality,125 KB versus 565 MB artifacts, GG-aligned features and full-ensemble SHAP. The Python 3.12 Random Forest retrain was weaker at 81% accuracy. V 2 remains a trade-off: ML precision improves but recall falls, and hybrid needs retuning.", "follow": "Which statements are measured versus expected operational gains?", "ref": "Model Versions: V1 and V2"}, {"category": "ML \u0026 data", "title": "What changed in the feature schema?", "answer": "V 1 has 138 features using legacy Section G; V 2 has 148 base+14 engineered=162, including 27 gg 01 xx features using Section GG. CMS transition is the documented motivation. Exact list and fourteen engineering formulas require the linked training materials.", "follow": "How do you protect training/serving feature consistency?", "ref": "Model Versions: V1 and V2"}, {"category": "ML \u0026 data", "title": "How was data leakage addressed?", "answer": "The 80/20 split groups by resident. The FAQ describes a strict date window and future-fall labels from a separate extract. This prevents some leakage; still audit feature timestamps, preprocessing fit scope, duplicates and temporal/customer generalisation.", "follow": "What leakage can persist despite resident grouping?", "ref": "Training Data"}, {"category": "ML \u0026 data", "title": "Why is the training label distribution important?", "answer": "Training labels are 55.8% fall events versus 6.8% in the observed 14-day cohort. Event matching changes the base rate, so training precision and raw probability calibration do not transfer directly. Evaluate/calibrate on representative deployment data.", "follow": "Show Bayes’ rule for precision under prevalence shift.", "ref": "Training Data"}, {"category": "ML \u0026 data", "title": "What is the main generalisation risk?", "answer": "The Sep 2026 run uses one customer. Facilities may differ in documentation, missingness, acuity and resident mix. Expand data and report customer/facility/temporal holdouts before making broader claims.", "follow": "Would random resident grouping detect customer shift?", "ref": "Known Risks and Gaps"}, {"category": "ML \u0026 data", "title": "How would you handle missing clinical data?", "answer": "First inspect actual preprocessing rather than assuming a policy. The source reports 59/179 raw columns\u003e70% missing. Proposed: distinguish absent vs unrecorded, audit imputation and missing indicators, test optional-field paths, and measure subgroup performance by data coverage.", "follow": "What if missingness is a facility-specific proxy?", "ref": "Training Data"}, {"category": "ML \u0026 data", "title": "Why is column order a critical artifact?", "answer": "order-dictionary.pkl enforces the training column sequence before preprocessing/inference. A correct model with misordered features can silently produce wrong predictions. Model, preprocessing, feature maps and order must be released as a compatible bundle.", "follow": "How would you assert compatibility at startup?", "ref": "Pre-trained Model Artifacts"}, {"category": "ML \u0026 data", "title": "How does SHAP change between versions?", "answer": "V 1 explains a representative tree; V 2 explains the full boosted ensemble. Full-ensemble attribution better matches the model output, but not automatically the recent-fall rule or hybrid formula. It is attribution, not a causal treatment recommendation.", "follow": "How would you audit human-readable feature mapping?", "ref": "SHAP-based Explainability"}, {"category": "ML \u0026 data", "title": "Why make SHAP optional?", "answer": "ml_considered_factors=true by default; false takes prepare_result_without_ml_factors and avoids ML attribution work. This offers a lower-latency score path, but measured latency and clinical explanation behaviour still need verification.", "follow": "Which output fields remain when SHAP is disabled?", "ref": "SHAP-based Explainability"}, {"category": "ML \u0026 data", "title": "How would you build a model registry?", "answer": "Proposed: immutable versioned bundles, checksums, dependency/feature schema, training snapshot, split/seeds, evaluation results, clinical approval and model card. Promote tested bundles through shadow and production with a recorded rollback target. Current versioning is filename/notebook based.", "follow": "What is your smallest useful first step?", "ref": "Known Risks and Gaps"}, {"category": "ML \u0026 data", "title": "How do you monitor model drift and performance?", "answer": "Current drift notebooks are manual. Proposed: track feature/missingness and score distributions by customer; join predictions to future outcomes on a schedule; monitor precision, recall and flag rate with delayed-label awareness. Distribution drift is not itself proof of clinical degradation.", "follow": "How would you handle late/incorrect fall labels?", "ref": "Known Risks and Gaps"}, {"category": "ML \u0026 data", "title": "What fairness analysis is documented?", "answer": "None. The README identifies this gap and proposes age, gender, facility type and customer analysis. Evaluate data coverage and operating-point behaviour with uncertainty; do not claim subgroup parity from aggregate results.", "follow": "How would you handle small subgroup sample sizes?", "ref": "Known Risks and Gaps"}, {"category": "Evaluation", "title": "Quote the real-world ML-only comparison carefully.", "answer": "At threshold≥70, V 1 flags 1102 and catches 101/136; V 2 flags 634 and catches 81/136. Precision is 9.17% versus 12.78%; recall 74.26% versus 59.56%. Flags fall 42.47%, but 20 fewer fallers are caught.", "follow": "What operating-point preference would justify this trade-off?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Quote the clinician-facing hybrid comparison.", "answer": "At threshold≥7, V 1 flags 508 and catches 77; V 2 flags 663 and catches 81, out of 136. Four more true positives cost 151 more false positives and 155 more total alerts. Precision drops 15.16%→12.22%.", "follow": "Why doesn’t the improved ML precision carry over?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "What does lift mean here?", "answer": "Lift=precision/prevalence. With 6.8% prevalence, V 1 hybrid 15.16% precision gives≈2.23× lift; V 2 ML 12.78% gives≈1.88×. It compares concentration of fallers in alerts with the base rate, not accuracy or causality.", "follow": "What happens to lift when the cohort base rate changes?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Why not lead with accuracy?", "answer": "At 6.8% prevalence, predicting nobody will fall gives 93.2% accuracy but zero recall. Clinical usefulness depends on caught fallers, staff workload and false alarms. The holdout has a different base rate and unspecified metric averaging.", "follow": "Which metrics would you put on a launch dashboard?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Distinguish false alarms from false-positive rate.", "answer": "False alarms as a share of all observations is FP/N. False-positive rate is FP/(FP+TN), among actual non-fallers. For V 2 ML,553/2000=27.65% versus 553/1864=29.67%. Quote the denominator.", "follow": "What is specificity? TN/(TN+FP).", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Can you claim the four-faller improvement is significant?", "answer": "No. The README calls it not statistically meaningful. Aggregate counts do not show paired disagreements; individual recall intervals are not a paired comparison test. We need larger samples and paired resident-level outcomes, with clustering considered if observations repeat.", "follow": "What data would you need for a paired test?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Can this reference draw an ROC/PR curve?", "answer": "No. Only one operating point per version/layer is supplied. Curves and threshold sweeps require per-observation scores and labels. The prevalence simulator is explicitly counterfactual, not additional evaluated thresholds.", "follow": "What would you ask the analytics team to export?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "Why does the README mention uncertainty around±8 pp?", "answer": "Only 136 fallers contribute to recall. Binomial uncertainty is material. This reference computes individual Wilson 95% intervals; source uses a rough±8 pp statement. Independence may be questionable if resident-day observations repeat.", "follow": "How would repeated residents affect interval estimation?", "ref": "Model Performance"}, {"category": "Evaluation", "title": "What is the proposed go/no-go criterion?", "answer": "On a multi-customer backtest, V 2 hybrid should match/beat V 1 sensitivity without exceeding its flagged rate, plus clinical sign-off and regulatory review. This criterion is proposed and pending, not an achieved result.", "follow": "What if no threshold satisfies both requirements?", "ref": "Open Decisions"}, {"category": "Evaluation", "title": "How do you validate a library upgrade versus a model change?", "answer": "Phase 1 aims for behaviour preservation: capture baseline, replay identical inputs, compare CSV and deep JSON; reported zero deviation. Phase 2 deliberately changes model outputs, so use predictive/clinical outcomes, contract checks and operational evaluation instead.", "follow": "Which regressions should remain invariant in Phase 2?", "ref": "Deployment and Rollout"}, {"category": "Operations", "title": "Describe model loading and memory sharing.", "answer": "Startup ensures seven artifacts exist locally. functools.cache loads once per process. With multiple workers Gunicorn preload loads in the master before fork so read-mostly pages can be shared copy-on-write. Runtime writes and request data still add worker RAM.", "follow": "How would RSS and PSS differ under shared memory?", "ref": "Model Loading and Caching"}, {"category": "Operations", "title": "What happens if S 3 is unavailable?", "answer": "Startup can fail when required artifacts are missing or refresh is needed. Once the bundle is loaded, inference has no documented per-request S 3 dependency. Existing local files may skip download when overwrite=false. Pod-lifecycle cache persistence must be checked.", "follow": "Would an emptyDir survive a new pod? No.", "ref": "Model Artifact Management (S3)"}, {"category": "Operations", "title": "Why might artifacts remain stale after a redeploy?", "answer": "API_FALLRISK_OVERWRITE=false skips files already present locally. Inspect pod/volume lifecycle and actual bundle identity before forcing refresh. A process cache also means replacing bytes does not necessarily reload an already running model.", "follow": "How would immutable artifact versions avoid ambiguity?", "ref": "Support and Troubleshooting"}, {"category": "Operations", "title": "What is the production resource footprint?", "answer": "10 replicas,2 workers each,2/3 CPU request/limit and 4/5 GiB memory request/limit. Totals 20/30 CPU and 40/50 GiB. Workers affect process count, not multiplication of Kubernetes pod requests.", "follow": "What must be measured before reducing replicas?", "ref": "Production Resource Configuration"}, {"category": "Operations", "title": "Can the smaller artifact justify a specific RAM saving?", "answer": "No.565 MB→125 KB is≈4520× smaller using decimal units. Python, loaded dictionaries, preprocessing, SHAP and batches still consume memory. Stage load tests and measure RSS/PSS, startup and throughput before right-sizing.", "follow": "How would you define a safe memory headroom target?", "ref": "Deployment and Rollout"}, {"category": "Operations", "title": "How does the service scale?", "answer": "Horizontally by Helm replicaCount and vertically by resource requests/limits. No HPA is configured in the snapshot. Proposed: autoscaling tied to measured CPU/queue/batch behaviour with minimum capacity and cold-start constraints.", "follow": "Would doubling workers always double throughput? No.", "ref": "Performance and Scalability"}, {"category": "Operations", "title": "What is wrong with the health probes?", "answer": "Production readiness/liveness are disabled. The health route is documented as/api/health while Helm points to/api/monitoring/health. Verify router, align paths and health semantics, then enable with measured startup allowances.", "follow": "When should readiness be false despite a live process?", "ref": "Startup and Container Lifecycle"}, {"category": "Operations", "title": "How are requests traced?", "answer": "trace_id in payload is placed in a ContextVar and stamped on loguru lines. Access logs are intercepted. ddtrace-run enables Datadog patches when DD_TRACE_ENABLED=true; prod sample rate 0.001 means 0.1%.", "follow": "How would you debug a request that was not sampled?", "ref": "Observability, Tracing, and Diagnostics"}, {"category": "Operations", "title": "What shutdown behaviour is documented?", "answer": "App shutdown hook is a no-op. Kubernetes SIGTERM allows Gunicorn graceful_timeout 30 s for in-flight work before forced worker kill. Ingress 360 s timeouts do not imply a 30 s shutdown can finish every long batch.", "follow": "How would you align timeouts and draining?", "ref": "Startup and Container Lifecycle"}, {"category": "Operations", "title": "How would you diagnose OOMs?", "answer": "Check model/preload mode, actual workers, RSS/PSS and shared pages, batch dataframes, SHAP allocations and limits. Reproduce with representative batches and inspect memory over time. Do not assume model file size equals resident memory.", "follow": "What would distinguish a leak from a large transient batch?", "ref": "Support and Troubleshooting"}, {"category": "Operations", "title": "How do you roll out and roll back V 2?", "answer": "Separate service/image/pipeline shadows V 1 without changing its production model. Switch caller API_FALL_RISK_URL to cut over; switch back to roll back. Proposed: freeze tested bundle, define clinical/operational rollback triggers, verify config propagation and monitor by version.", "follow": "What risk remains despite the unchanged API?", "ref": "Deployment and Rollout"}, {"category": "Operations", "title": "Why can compressed requests fail despite valid JSON?", "answer": "The calculate-compressed route expects zlib bytes; plain JSON or corrupt compression yields 400. Pydantic errors after valid decoding produce 422. Response GZip middleware is a different compression direction.", "follow": "Which layer should diagnose the failure first?", "ref": "Error Handling and Resilience"}, {"category": "Security", "title": "Does this service enforce authentication?", "answer": "No JWT/API-key checks exist in the documented FastAPI handlers. It relies on private networking, ingress and IAM for infrastructure/artifact access. Proposed: service-to-service auth using shared OAuth 2/JWT patterns, without assuming IAM for S 3 authenticates API calls.", "follow": "What identity does the caller present today? Verify infrastructure.", "ref": "Authentication and Security"}, {"category": "Security", "title": "Where is PHI persisted?", "answer": "The service processes PHI in memory and has no request/response capture pipeline. The orchestrator can log requests/results to S 3 separately. Confirm actual application log content and external retention, encryption and access controls.", "follow": "Does “no persistence in the service” imply no persistence anywhere? No.", "ref": "Security and Compliance Considerations"}, {"category": "Security", "title": "How would you secure pickle/joblib model loading?", "answer": "Proposed: load only trusted, access-controlled immutable bundles; verify provenance/checksums; audit dependency compatibility and artifact promotion. Pickle/joblib can execute code during deserialisation, so avoid arbitrary user-uploaded artifacts. These safeguards are not all documented as implemented.", "follow": "Where should bundle verification run?", "ref": "Model Artifact Management (S3)"}, {"category": "Security", "title": "Can you call this regulated SaMD or exempt CDS?", "answer": "The source explicitly marks regulatory classification TBD. State intended use, clinician responsibility and the need for Regulatory/QA review; do not assert a classification or approval that has not been confirmed.", "follow": "What review is needed before a material model change?", "ref": "Security and Compliance Considerations"}, {"category": "Behavioural", "title": "Tell me about the migration trade-off.", "answer": "Use your actual role. The project-level story is legacy runtime/G-feature mismatch → GG-aligned modern model → comparable holdout and much smaller artifacts → real-world ML precision/recall trade-off → unexpected hybrid workload increase → pending recalibration. Cite evidence and separate your actions from team work.", "follow": "Which decision did you personally make?", "ref": "Deployment and Rollout"}, {"category": "Behavioural", "title": "How did you balance safety and alert fatigue?", "answer": "Explain the operating-point discussion rather than claiming an arbitrary objective. Recall captures missed fallers; precision and flag rate reflect staff burden. Show the ML and hybrid metrics, acknowledge uncertainty and agree a clinical operating point before production.", "follow": "What would you do if Product prioritised fewer alerts over recall?", "ref": "Open Decisions"}, {"category": "Behavioural", "title": "What is the strongest project achievement you can defend?", "answer": "The README documents zero-deviation Phase 1 validation, a smaller V 2 artifact and GG-aligned modernisation. State only the portion you owned and the evidence you can show. Do not invent latency/cost improvements or a production V 2 rollout.", "follow": "Where is the baseline or test evidence?", "ref": "Deployment and Rollout"}, {"category": "Behavioural", "title": "What would you do differently next time?", "answer": "Candidate answer: treat the fusion policy and explanation layer as first-class validation targets from the beginning; establish representative multi-customer data, immutable artifact bundles and agreed clinical gates earlier. Anchor this to your actual observations and responsibility.", "follow": "Which change would have delivered the most value earliest?", "ref": "Known Risks and Gaps"}, {"category": "Behavioural", "title": "How would you explain this to a non-technical manager?", "answer": "It prioritises residents who may fall and gives reasons. The new engine is much smaller and produces fewer ML alerts, but the final score mixing still increases clinician alerts. We need to adjust that mixing and validate across more customers before switching production.", "follow": "Avoid holdout accuracy; explain one concrete trade-off.", "ref": "Model Performance"}, {"category": "Behavioural", "title": "What facts need refreshing before an interview years later?", "answer": "Current prod version and runtime, customer coverage, recalibration/threshold policy, outcome metrics and confidence intervals, latency/cost/memory, auth/probes, MLOps progress, clinical/regulatory approval and your verified role. This page freezes the 1 Oct 2026 source; notes do not turn old facts into current claims.", "follow": "Where will you find the latest authoritative evidence?", "ref": "Metrics to Track"}], "incidents": [["Startup cannot load the model", "Documented suspects: wrong S3 key/bucket, missing files or role permissions. Check API_S3_BUCKET, role read access and startup logs before inspecting inference. Proposed: verify bundle identity, dependency compatibility and trust; readiness should stay false until warmup succeeds."], ["Valid-looking request returns422", "Inspect Pydantic error paths. Required identifiers and resident_id/demographic fields may be missing or the values may have wrong types. This differs from resident eligibility null scoring."], ["A resident receives null risk", "Check age10–120 and admission≤calculation date. This is a200 result by design, not a missing resident or low-risk score. Validate timestamps against the actual contract."], ["Compressed endpoint returns400", "Verify client is zlib-compressing the JSON body and bytes are not corrupted. Don’t substitute response gzip semantics for request zlib decoding."], ["Memory spikes or OOM", "Inspect master preload, worker count, batch size, dataframe copies, SHAP and RSS/PSS. Measure peak and sustained memory. Change limits/workers/replicas only after understanding the load."], ["Scores do not change after artifact update", "Check overwrite=false and local existing files; inspect actual process cache and bundle version. A restarted new pod with emptyDir may behave differently from a process/container restart. Prefer immutable bundles."], ["V2 alerts increase unexpectedly", "Separate ML-only and hybrid outputs, score distributions, recent-fall floor and branch occupancy. The observed V2 hybrid already adds151 false positives; retuning requires outcomes and clinical agreement."], ["Probe fails after being enabled", "Verify actual/api router versus/api/monitoring/health Helm path, startup timing and readiness semantics. Don’t point liveness at a slow full inference request."], ["No APM trace for a request", "At0.001 sample rate only0.1% is sampled. Use supplied trace_id in loguru, verify DD_TRACE_ENABLED/ddtrace-run and trace propagation; absence of an APM trace is not proof of no request."]], "checklist": ["Explain runtime without looking", "Calculate the raw43 → clinical67.51 example", "Explain all hybrid branches and boundary discontinuities", "Quote both ML-only and hybrid trade-offs with denominators", "Distinguish near-balanced holdout from deployment prevalence", "Defend leakage and generalisation checks", "Explain preload, copy-on-write and resource totals", "Describe one incident and rollback path", "Prepare a verified ownership/impact/STAR narrative", "Refresh snapshot facts and export notes"], "pitches": {"30": "This is an explainable fall-risk service for skilled-nursing residents. It combines weighted clinical rules with tree-based ML into a 0–10 score. The modernisation moves from legacy SectionG and Random Forest to GG-aligned XGBoost. The model becomes much smaller and its alerts more precise, but recall falls and the unchanged hybrid adds alerts. That is why full-pipeline recalibration and multi-customer validation are the next gates.", "90": "The service helps nursing teams prioritise residents at risk of falling and understand the contributing factors. An orchestrator sends resident EHR batches to a stateless FastAPI service. After schema and age/census validation, six clinical transformers build a weighted rules score; a separate pipeline engineers features, preprocesses them and runs the model, with optional SHAP. A piecewise blend produces the final 0–10 score and merged factors.\n\nV 1 is a production Random Forest using legacy SectionG. V 2 is a separate shadow XGBoost service aligned to SectionGG and Python 3.12. The artifact shrinks from 565 MB to 125 KB. In the documented 14-day cohort, V 2 ML-only flags fall from 1102 to 634 and precision improves, but caught fallers decline from 101 to 81 of 136. The clinician-facing hybrid adds 155 alerts for only 4 more fallers.\n\nThe engineering lesson is to validate the complete decision policy, not just the replacement model. Recalibration, multi-customer outcome validation, clinical approval and measured right-sizing remain necessary. Add your actual responsibility and verified impact here.", "180": "Problem and context: falls are a safety and workload challenge in skilled nursing. The service provides a 0–10 prioritisation score and contributing factors to MatrixCare nursing teams. Explain the intervention and why staff trust/alert volume matter.\n\nArchitecture: the orchestrator calls a stateless FastAPI batch endpoint. Pydantic checks the request, then resident validation checks age 10–120 and admission before the calculation date. Invalid residents remain in the response with null scores. Clinical transformers produce 11 indicators; their raw weighted sum is transformed as 2 r−r²/100. ML feature dictionaries use diagnoses, meds, MDS/POC, vitals, demographics and falls, with a fixed column order and cached preprocessing. The model probability can be floored at 0.90 for a recent fall. SHAP is optional. Fusion has four ordered branches, followed by factor merge and EHR output wrapping.\n\nModernisation: V 1 uses a large Random Forest artifact, legacyG features and an old runtime stack. Phase 1 library changes were baseline-replayed with zero output deviation. V 2 retraining aligns toGG and Python 3.12, with 162 features and XGBoost. It reduces the model artifact from 565 MB to 125 KB and explains the full ensemble. It runs separately in shadow; the API contract remains unchanged.\n\nEvidence and trade-off: the holdout labels are near-balanced and not comparable to 6.8% real-world prevalence. At ML≥70, flags decrease 1102→634, precision rises 9.17%→12.78%, recall falls 74.26%→59.56%. At hybrid≥7, alerts increase 508→663, only 4 additional fallers are caught and 151 false positives are added. One customer and 136 fallers limit conclusions.\n\nProduction approach: recalibrate using point-in-time multi-customer data and agreed clinical operating criteria. Validate subgroups, explanations and uncertainty; add auth, correct probes and monitoring; measure memory/startup/latency before right-sizing. S 3 downloads occur at startup, with process caching and Gunicorn preload/copy-on-write. Cutover/rollback changes the caller URL to the parallel service.\n\nYour contribution: replace this closing section with what you personally owned, the alternatives you assessed, evidence of impact and what you learned. Do not claim a completed V 2 production launch from this snapshot."}, "source": "# Fall Risk Service Documentation\n\n\u003e **Repository:** `rcs-ehr-cai` (`services/ml_services/fallrisk`) · **Deployment:** Kubernetes / Helm (EC2 target) · **Framework:** FastAPI · **Python 3.12** · **ML Model:** Random Forest + SHAP explainer (S3-backed artifacts) · **Data Capture:** Not implemented\n\n## Project Introduction\n\n\u003e **Scope:** `services/ml_services/fallrisk` (runtime), `models/fallrisk` (training), `helm-values/fallrisk*` (deployment).\n\u003e **As of:** 2026-10-01. Figures come from the training/evaluation notebooks and repository configuration. Items marked **[TBD]** are not available in the repository.\n\n### Summary\n\n- **What it is:** A service that scores each skilled-nursing resident's **risk of falling** on a 0–10 scale. It also lists the **contributing factors** (diagnoses, medications, mobility, vitals, recent falls) so clinicians can act on the score.\n- **How it works:** A **hybrid** of (a) a rules-based clinical score built from evidence-based fall indicators and (b) a machine-learning model trained on historical fall events. The two scores are blended into one.\n- **Current state:**\n  - **V1 (production):** Random Forest model trained with Python 3.6/3.9-era tooling on legacy MDS **Section G** codes. Runs on 10 replicas.\n  - **V2 (pre-production, shadow):** XGBoost model retrained on Python 3.12 using the current MDS **Section GG** codes. Deployed as a separate service in dev/QA/staging. **Not yet in production.**\n- **Why V2:**\n  1. Python 3.9 reached end-of-life in Oct 2025, so V1 runs on an unsupported runtime and an old scientific stack.\n  2. CMS retired the Section G functional items in favour of Section GG (Oct 2023), so V1's features no longer match what facilities record.\n  3. The model artifact shrinks from **565 MB to 125 KB** (about 4,500× smaller). This reduces startup time and memory and allows infrastructure right-sizing.\n  4. The V2 ML score **flags 42% fewer residents** (634 vs 1,102 of 2,000), which reduces alert fatigue.\n- **Trade-off:** The **ML-only** score is more precise but catches fewer fallers. The **hybrid score** shown to clinicians behaves differently: V2 catches slightly more fallers (+4 of 136) but raises more false alarms (+151). The hybrid blending rules need **recalibration for V2 before production**.\n\n### Purpose and Clinical Context\n\n| Topic | Summary |\n|---|---|\n| **Problem** | Falls are a leading cause of injury, hospital transfer, and liability in skilled nursing / long-term care. Early identification lets staff intervene (supervision, mobility aids, medication review). |\n| **Users** | Nursing staff and clinical leadership in MatrixCare EHR facilities, via Intelligent UI / clinical insights. |\n| **Output** | Per-resident **Fall Risk score (0–10)** plus a ranked list of **contributing factors** (explainable via SHAP). |\n| **Design approach** | Clinically interpretable rules combined with a data-driven model. Every score comes with an explanation. |\n| **Customer control** | Fall Risk can be switched on or off per customer (`fallrisk_active_flag` in the CAI activation table). |\n\n### How It Works\n\n```mermaid\nflowchart LR\n    A[EHR data\u003cbr/\u003ediagnoses, meds, MDS,\u003cbr/\u003evitals, ADLs, fall history] --\u003e B[ML Orchestrator]\n    B --\u003e|resident batch| C[Fall Risk Service]\n    C --\u003e D[Clinical Rules Score\u003cbr/\u003e11 evidence-based indicators]\n    C --\u003e E[ML Model Score\u003cbr/\u003e148+ features]\n    D --\u003e F[Hybrid Blend\u003cbr/\u003e0-10 score]\n    E --\u003e F\n    F --\u003e G[Score + Top Reasons\u003cbr/\u003eshown to clinicians]\n\n    style C fill:#4c6ef5,stroke:#364fc7,color:#fff\n    style F fill:#ffd43b,stroke:#fab005,color:#333\n```\n\n- **Clinical rules score:** 11 weighted indicators, e.g. balance change in the last 48h (weight 20), psychotropic medications (15), mobility device or mechanical lift (12), extensive assistance (11), recent admission (10), out-of-range vitals (9), pain (8), nutrition (7), continence (5), and behaviour (3). See [Clinical Factor Score Formula](#clinical-factor-score-formula).\n- **ML score:**\n  - A model trained on historical fall vs. non-fall events.\n  - Inputs are demographics, diagnoses (ICD-10), medications, MDS assessments (Section GG mobility/self-care), point-of-care ADLs, vitals deviations, and fall history.\n  - Recent falls also boost the score directly: a fall in the last 30 days lifts the ML probability to at least 0.90.\n- **Hybrid blend:**\n  - When the two scores agree, the higher one wins.\n  - When they disagree, the blend is weighted toward the higher score and discounted by the lower one.\n  - The result is scaled to 0–10. See [Hybrid Score Fusion Formula](#hybrid-score-fusion-formula).\n- **Explainability:** Every score comes with its contributing factors. Rule-based factors are listed directly; ML factors come from SHAP feature attribution.\n\n### Model Versions: V1 and V2\n\n| Dimension | V1 — Production | V2 — Pre-production (shadow) |\n|---|---|---|\n| **Model** | Random Forest (100 trees, depth 30) | XGBoost (gradient-boosted trees) |\n| **Model artifact size** | 565 MB | **125 KB** |\n| **Python runtime** | 3.9 (end-of-life Oct 2025) on legacy ML stack (scikit-learn 1.2.2) | **3.12** with current stack (scikit-learn 1.9, numpy 2, pandas 2.3, shap 0.46) |\n| **MDS functional codes** | Legacy Section G | **Section GG** (27 `gg01xx` features); G codes retired |\n| **Features** | 138 | 148 base + 14 engineered = 162 |\n| **Training data window** | Historical (pre-2023 extract) | Events after Oct 31, 2023 (~3 years) |\n| **Explainability** | SHAP on a single representative tree | SHAP on the **full** boosted ensemble (more faithful) |\n| **API contract** | Unchanged | **Unchanged.** Drop-in compatible for callers |\n| **Deployment** | `ehr-fallrisk`, 10 replicas, prod | `ehr-fallrisk-v2`, 1 replica each in dev/QA/stg, private route, separate image and pipeline |\n| **Artifacts location** | `s3://rcs-ehr-cai-s3-{env}/fallrisk/v1/` | `s3://rcs-ehr-cai-s3-{env}/fallrisk/v2/{pretrained,generated}/` |\n\n**Delivery timeline**\n\n```mermaid\ntimeline\n    title Fall Risk Modernisation\n    Jun 2026 : Phase 1 - Library upgrade (Pydantic v2, FastAPI, tooling)\n             : Baseline captured; zero output deviation\n    Jun-Jul 2026 : Phase 2 - Python 3.12 retraining (Random Forest, then XGBoost)\n                 : GG-code feature alignment\n    Sep 2026 : XGBoost fine-tune (artifact py312_20260916)\n             : 14-day real-world V1 vs V2 comparison\n             : V2 shadow deploys - QA (001-005), Staging (001-002)\n    Oct 2026 : Stored-procedure data analysis, multi-customer data (NHC) - in progress\n             : Hybrid recalibration and production go/no-go - pending\n```\n\n### Model Performance\n\n**Reading the metrics**\n- **Real-world prevalence:** In the evaluation sample, **6.8%** of residents fell within 14 days (136 of 2,000). A random selection would be right about 7% of the time.\n- **Sensitivity (recall):** Share of residents who actually fell that were flagged. This is the patient-safety metric.\n- **Precision:** Share of flagged residents who actually fell. This is the alert-fatigue / staff-workload metric.\n- **Lift:** Precision ÷ prevalence, i.e. how many times better than random the model is at finding fallers.\n- **Training holdout vs. real world:** Training data is deliberately near-balanced (56% falls), so holdout accuracy in the 80s **does not** imply 80%+ accuracy in production. Only the 14-day real-world comparison reflects clinical experience.\n\n**Training holdout (balanced data)**\n\n| Model | Accuracy | Precision | Recall | F1 | False positives | False negatives |\n|---|---:|---:|---:|---:|---:|---:|\n| V1 (Aug 2023 training) | 84.11% | 84.44% | 84.11% | 84.23% | 6.72% | 9.17% |\n| V2 (Sep 15, 2026 fine-tune, Python 3.12) | 83.30% | 83.92% | 83.30% | 83.34% | **5.49%** | 11.22% |\n\nOverall quality is comparable. V2 makes fewer false-positive errors and slightly more false-negative errors.\n\n**Real-world 14-day outcome comparison (2,000 resident-days, 136 actual falls)**\n\nML score only (threshold ≥ 70):\n\n| Metric | V1 | V2 | Change |\n|---|---:|---:|---:|\n| Residents flagged high-risk | 1,102 (55.1%) | **634 (31.7%)** | **−468 (−42%)** |\n| Fallers caught (sensitivity) | 101 / 136 (74.3%) | 81 / 136 (59.6%) | −20 |\n| Precision | 9.2% | **12.8%** | +3.6 pp |\n| Lift over random | 1.35× | **1.88×** | +39% |\n| False alarms (of all residents) | 50.1% | **27.7%** | −22.4 pp |\n\nHybrid score, as shown to clinicians (threshold ≥ 7):\n\n| Metric | V1 | V2 | Change |\n|---|---:|---:|---:|\n| Residents flagged high-risk | 508 (25.4%) | 663 (33.2%) | +155 |\n| Fallers caught (sensitivity) | 77 / 136 (56.6%) | **81 / 136 (59.6%)** | +4 |\n| Precision | **15.2%** | 12.2% | −2.9 pp |\n| Lift over random | **2.2×** | 1.8× | — |\n| False alarms (of all residents) | **21.6%** | 29.1% | +7.6 pp |\n\n**Interpretation**\n1. **The V2 ML model is better at its own task.** It is more selective, has higher precision and lift, and roughly halves false alarms.\n2. **The hybrid blend has not been tuned for V2.** Under V2 the hybrid catches the same 81 fallers as the ML score alone but adds about 30 extra false alarms. The blending rules and the ≥ 7 threshold were designed around V1's score distribution.\n3. **Sample size is small.** With 136 falls, sensitivity estimates carry roughly **±8 percentage points** of uncertainty at 95% confidence. The 4-faller hybrid difference is not statistically meaningful, and the ML-only sensitivity drop is at the edge of significance.\n4. **Next step:** Recalibrate the hybrid blend and threshold for V2 against an agreed operating point. Then re-evaluate on a larger, multi-customer sample before a production decision.\n\n### Training Data\n\n| Attribute | Value |\n|---|---|\n| Source | Snowflake stored procedure `SPML_FALLEVENTSWITHVITALS_WITH_GG` (`EHR_INSIGHTS_MATRIXCARE_US_SECURE_PRD`) |\n| Customers | **One customer** (ID 18618) in the Sep 2026 training run. Additional customers (4061, 12116) are parameterised in the procedure; multi-customer support is in progress |\n| Volume | ~145.8K events, ~90K unique residents (raw); 143,764 rows after filtering |\n| Window | Events after Oct 31, 2023 (aligned to Section GG adoption) |\n| Split | 80/20, **grouped by resident** so no resident appears in both train and test (prevents leakage) |\n| Label mix | 55.8% fall / 44.2% non-fall (event-matched, not population prevalence) |\n| Data quality | 59 of 179 raw columns are \u003e70% missing (mostly optional MDS/vitals fields). Diagnosis is almost always present (0.23% missing) |\n\nA model trained on one customer may not generalise to facilities with different documentation habits, resident mix, or acuity. Expanding to multiple customers is the main next step for model quality.\n\n### Deployment and Rollout\n\n```mermaid\nflowchart LR\n    SQS[SQS resident\u003cbr/\u003edata queues] --\u003e ORCH[ML Orchestrator]\n    ORCH --\u003e|HTTP POST /api/calculate| FR[Fall Risk Service\u003cbr/\u003eFastAPI, in-process model]\n    S3[(S3 model artifacts\u003cbr/\u003eloaded at startup)] -.-\u003e FR\n    FR --\u003e ORCH\n    ORCH --\u003e|merged with Clinical Risk| OUT[Insights to UI / DB]\n    ORCH -.-\u003e|optional output logging| S3LOG[(S3 fall-risk logs)]\n\n    style FR fill:#4c6ef5,stroke:#364fc7,color:#fff\n```\n\n| Area | Detail |\n|---|---|\n| **Pattern** | Stateless REST microservice. Model runs **in-process**: no external model server, no runtime dependency on S3 or a database |\n| **Callers** | `ml_orchestrator`, `ml_orchestrator_external`, `backend_service_manager` (debug), configured via `API_FALL_RISK_URL` |\n| **Prod footprint (V1)** | 10 replicas × (2–3 CPU, 4–5 GiB), i.e. **20 CPU / 40 GiB reserved**, up to 30 CPU / 50 GiB |\n| **Right-sizing** | V2's model is about 4,500× smaller. Pod memory and replica count can likely be reduced, but this must be **measured** in staging because Python, the preprocessing pipeline, and request dataframes still use memory |\n| **Scaling** | Horizontal (replica count). No HPA configured |\n| **CI/CD** | V1: `continuous-deployment-fallrisk-devx-eks.yml`. V2: `continuous-deployment-fallrisk-v2-devx-eks.yml`, a separate image and release triggered by tags `deploy-fallrisk-v2-{dev,qa,stg}-*` and gated to the `feature/fallrisk-v2` branch |\n| **Rollout / rollback** | V2 runs **side by side** with V1. Cutover = point `API_FALL_RISK_URL` at V2. Rollback = point it back. V1 is not modified |\n| **Regression safety** | Phase 1 upgrade validated with baseline capture, giving **zero output deviation** (CSV diff plus deep JSON equality) |\n\n### Security and Compliance Considerations\n\n| Area | Current state | Note |\n|---|---|---|\n| **Data handled** | Resident PHI (demographics, diagnoses, meds, assessments, vitals) | Processed in memory; the service does not persist it |\n| **Authentication** | **No application-level auth.** Access is controlled by private networking, ingress, and IAM | Defence-in-depth gap. Other services (e.g. DSAIL Depression) enforce JWT |\n| **AWS access** | Cross-account IAM role scoped to model-artifact S3 reads | Least privilege |\n| **Container** | Non-root user, all capabilities dropped, `no-new-privileges` | Hardened |\n| **Output logging** | ML Orchestrator can log fall-risk requests and outputs to S3 (`API_ENABLE_FALL_RISK_LOGGING`) | Confirm retention, encryption, and access policy for PHI in those logs |\n| **Training data** | Pulled from the secure Snowflake analytics DB under role-based access | Confirm per-customer data-use rights for model training (the legacy pipeline filtered on `AccessRights = 1`) |\n| **Regulatory classification** | **[TBD — confirm with Regulatory/QA]** | Clinical decision support vs. SaMD status, intended-use statement, and change-control obligations for a model change (V1 → V2) |\n\n### Known Risks and Gaps\n\n| # | Risk / Gap | Impact | Mitigation / Next step |\n|---|---|---|---|\n| 1 | Training data from a **single customer** | Model may underperform at other facilities | Add multi-customer data (NHC, others); evaluate per customer |\n| 2 | **Hybrid blend not recalibrated** for V2 | Clinician-facing score has more false alarms than V1 | Retune blend and threshold to an agreed operating point |\n| 3 | **Small real-world evaluation** (136 falls) | Wide confidence intervals; risk of a wrong go/no-go call | Larger, multi-customer, multi-period backtest |\n| 4 | V1 on **end-of-life Python 3.9** and old ML stack | Security patch exposure, maintenance friction | Ship V2 (Python 3.12) |\n| 5 | V1 uses **retired MDS Section G** codes | Features drift from what facilities record today | V2 uses Section GG |\n| 6 | **No application-level authentication** | Relies solely on network controls | Add service-to-service auth (OAuth2/JWT pattern already in `services/shared/security`) |\n| 7 | **Health probes disabled** in Helm | Kubernetes cannot auto-detect or recycle unhealthy pods | Enable readiness/liveness probes and align the probe path with the service route |\n| 8 | **Manual, notebook-based training** with filename-based versioning | Reproducibility, audit trail, retraining speed | Move to a scripted pipeline with a model registry and model cards |\n| 9 | **No automated drift or performance monitoring** | Silent degradation over time | Scheduled backtest against actual fall events (drift notebooks exist but are manual) |\n| 10 | **Fairness / subgroup analysis** not documented | Equity and regulatory exposure | Evaluate by age band, gender, facility type, and customer |\n| 11 | Recent-fall **probability boost** is a hard-coded rule outside the model | Masks model behaviour; harder to validate | Review with clinical SMEs; consider learning it in-model |\n\n### Open Decisions\n\n1. **Operating point:** Prioritise catching more fallers (more alerts) or fewer false alarms (lower staff workload). This sets the hybrid threshold.\n2. **Training data scope:** Use multi-customer de-identified data for training and evaluation, within contractual data-use rights.\n3. **Production criteria (proposed):**\n   - On a multi-customer backtest, V2 hybrid matches or beats V1 sensitivity **and** does not exceed V1's flagged-resident rate.\n   - Clinical sign-off and regulatory review are complete.\n4. **Clinical validation:** Clinical SMEs review rule weights, explanations, and the recent-fall boost.\n5. **MLOps foundations:** Training pipeline, model registry, drift monitoring, and service auth.\n6. **Infrastructure right-sizing:** A measured reduction of the 10 × 5 GiB footprint after V2 cutover.\n\n### FAQ\n\n| Question | Answer |\n|---|---|\n| *What does the service deliver?* | Residents at elevated fall risk, with reasons, so staff can intervene early. |\n| *How accurate is it?* | Among flagged residents it is about **2× better than chance** at identifying who will fall within 14 days (hybrid V1 lift 2.2×; V2 ML lift 1.9×). It catches roughly 55–75% of fallers depending on the threshold. About 7% of residents fall in a 14-day window, which makes prediction inherently hard. |\n| *Is V2 better?* | The ML model is: about 42% fewer flags at higher precision. The hybrid score still needs recalibration before it clearly improves on V1. |\n| *Why XGBoost over Random Forest?* | Comparable holdout quality, a much smaller artifact (125 KB vs 565 MB), faster load, and SHAP explains the full ensemble rather than one tree. The Python 3.12 Random Forest retrain was weaker (81% accuracy). |\n| *How is data leakage prevented?* | Resident-grouped train/test split, a strict date window, and future-fall labels computed from a separate fall-events extract. |\n| *How was the library upgrade validated?* | Phase 1 used baseline capture and post-upgrade replay with CSV diff plus deep JSON equality, giving zero deviation. Phase 2 (new model) is validated via holdout plus a real-world 14-day backtest. |\n| *What is the rollout risk?* | Low. V2 runs side by side with V1 and the API contract is unchanged. Switching or rolling back is a configuration change (`API_FALL_RISK_URL`). |\n| *Can customers opt out?* | Yes. Fall Risk is toggled per customer. |\n| *What if it misses a fall?* | It is a decision-support tool; clinicians remain responsible for care decisions. Intended-use wording and regulatory classification are to be confirmed with Regulatory/QA. |\n| *How is the model versioned?* | Notebooks, pinned dependencies, seeded randomness, and versioned artifact names (e.g. `py312_20260916`). A scripted pipeline with a registry is a planned improvement. |\n\n### Metrics to Track\n\n| Metric | Source | Value |\n|---|---|---|\n| Active Fall Risk customers / facilities | CAI activation table (`fallrisk_active_flag`) | [TBD] |\n| Residents scored per day | Datadog / orchestrator logs | [TBD] |\n| p50 / p95 latency per batch | Datadog APM | [TBD] |\n| Monthly infra cost (fallrisk pods) | AWS / Kubecost | [TBD] |\n| V2 staging memory per pod | Datadog container metrics | [TBD] |\n| Error rate (5xx), last 30 days | Datadog | [TBD] |\n| Target production date for V2 | Product / Engineering | [TBD] |\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| **MDS** | Minimum Data Set, the CMS-mandated resident assessment in skilled nursing facilities |\n| **Section G / GG** | MDS functional status sections. GG (mobility and self-care) replaced the G ADL items in Oct 2023 |\n| **ADL / POC** | Activities of Daily Living / Point-of-Care documentation by staff |\n| **SHAP** | Method that attributes a model's prediction to its input features (explainability) |\n| **Hybrid score** | Blend of the rules-based clinical score and the ML score, scaled 0–10 |\n| **Sensitivity / Recall** | Share of actual fallers the model flags |\n| **Precision** | Share of flagged residents who actually fall |\n| **Lift** | Precision ÷ prevalence, i.e. improvement over random selection |\n| **Shadow deployment** | New version runs in parallel without affecting production traffic |\n\n### Related Documentation\n\n- Detailed scoring logic (rules, features, weights): [FALLRISK_Prediction_Service.md](../models/fallrisk/docs/FALLRISK_Prediction_Service.md)\n- V1 vs V2 comparison: [FALLRISK_Comparison.md](../models/fallrisk/docs/FALLRISK_Comparison.md)\n- Python upgrade and Phase 1 validation: [python_upgradation_summary.md](../models/fallrisk/docs/python_upgradation_summary.md)\n- Training data procedure: [snowflake_fallrisk_proc_doc.md](../models/fallrisk/docs/snowflake_fallrisk_proc_doc.md)\n- Latest training notebook: [fall-risk-training-py3.12_2026-09.ipynb](../models/fallrisk/fall-risk-training-py3.12_2026-09.ipynb)\n- V2 deployment values: [helm-values/fallrisk-v2/](../helm-values/fallrisk-v2/)\n- V1 production values: [values-prod-amr-saas.yaml](../helm-values/fallrisk/values-prod-amr-saas.yaml)\n\n---\n\n## Service Overview\n\nThe Fall Risk service computes resident-level fall risk using a hybrid approach:\n- clinical-factor scoring from resident EHR data,\n- ML model scoring from engineered features,\n- score fusion into a final Hybrid Score.\n\nThis document is intentionally scoped to the fallrisk service only.\n\n```mermaid\ngraph LR\n   A[\"Caller\u003cbr/\u003e(ML Orchestrator)\"] --\u003e|POST /api/calculate| B[\"Fall Risk Service\u003cbr/\u003e(Port 8009)\"]\n   B --\u003e C[\"Hybrid Score\u003cbr/\u003e+ Factors Considered\"]\n   C --\u003e|Response| A\n   style B fill: #4c6ef5, stroke: #364fc7, color: #fff\n```\n\n---\n\n## High-Level Processing Flow\n\n```mermaid\nflowchart TD\n   A[POST /api/calculate or /api/calculate-compressed] --\u003e B[Parse MLResidentRequestBody]\n   B --\u003e C[Set trace context]\n   C --\u003e D[process in processors/processor.py]\n   D --\u003e E{Validate residents\\nAge 10 to 120 and census check}\n   E --\u003e|Invalid| F[Mark invalid resident\\nscore None and no factors]\n   E --\u003e|Valid| G[Process valid residents]\n   G --\u003e H[clinical_factor_score_processor]\n   G --\u003e I[get_patients_ml_data]\n   I --\u003e J[get_ml_prediction_output]\n   H --\u003e K[calculate_hybrid_scores_and_prepare_output]\n   J --\u003e K\n   F --\u003e K\n   K --\u003e L[EHRResponse]\n   L --\u003e M[EHRInsightsResponseBody]\n\n   style H fill:#51cf66,stroke:#2f9e44,color:#333\n   style I fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style J fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style K fill:#ffd43b,stroke:#fab005,color:#333\n```\n\nKey points:\n- This flow is clearer because it shows the explicit validation decision and the invalid-resident branch returning into final assembly.\n- Pipeline stages are visually separated: clinical branch, ML branch, and hybrid merge point.\n- It captures the real execution shape end-to-end, including trace context setup and final response wrapping.\n\n---\n\n## API Endpoints\n\nSource: [services/ml_services/fallrisk/api/web/api/fallrisk/views.py](services/ml_services/fallrisk/api/web/api/fallrisk/views.py)\n\nHealth/docs routes:\n- [services/ml_services/fallrisk/api/web/api/monitoring/views.py](services/ml_services/fallrisk/api/web/api/monitoring/views.py)\n- [services/ml_services/fallrisk/api/web/api/docs/views.py](services/ml_services/fallrisk/api/web/api/docs/views.py)\n\n### Inference Routes\n\n| Method | Path | Description | Authentication |\n|---|---|---|---|\n| POST | /api/calculate | Main fall-risk inference endpoint (Hybrid Score + factors considered) | None enforced in-service† |\n| POST | /api/calculate-compressed | Same as `/api/calculate`, but accepts a zlib-compressed JSON body | None enforced in-service† |\n| POST | /api/get_patients_ml_data | Debug/helper endpoint that returns engineered ML features without running the model | None enforced in-service† |\n\n### Health and Documentation\n\n| Method | Path | Description | Authentication |\n|---|---|---|---|\n| GET | /api/health | Health/liveness endpoint used by Docker and Kubernetes probes | None |\n| GET | /api/docs | Swagger UI | None |\n| GET | /api/redoc | ReDoc UI | None |\n\n† No JWT or API-key check exists in the FastAPI route handlers. See **Authentication and Security** below for how access is actually controlled.\n\n---\n\n## Deployment Configuration (Kubernetes / Helm)\n\n**Helm values:** [helm-values/fallrisk/values-prod-amr-saas.yaml](helm-values/fallrisk/values-prod-amr-saas.yaml)\n**Container build:** [services/ml_services/fallrisk/deploy/Dockerfile](services/ml_services/fallrisk/deploy/Dockerfile)\n**Local/dev compose:** [services/ml_services/fallrisk/deploy/docker-compose.yml](services/ml_services/fallrisk/deploy/docker-compose.yml)\n\n### Service Configuration\n\n| Setting | Value | Purpose |\n|---|---|---|\n| **Service Name** | `ehr-fallrisk` (local container) / `fallrisk` (Helm release) | Deployed service identifier |\n| **Container Port** | `8009` (local Docker Compose) · `8080` (production Helm `service.port`/`targetPort`) | FastAPI port, configurable via `API_PORT` |\n| **Python Version** | 3.12 (`python:3.12.13-slim-bookworm`) | Runtime environment |\n| **Process Manager** | Gunicorn + `UvicornWorker` when `API_WORKERS_COUNT \u003e 1`; plain Uvicorn otherwise | `api/__main__.py` |\n| **Start Command** | `python -m api` (wrapped with `ddtrace-run` when `DD_TRACE_ENABLED=true`) | Container `CMD` |\n| **Workers per Replica** | `API_WORKERS_COUNT` (prod: `2`) | Gunicorn preload workers, share models via copy-on-write fork |\n| **Replicas** | `10` (prod Helm `replicaCount`) | Horizontal scaling / high availability |\n| **Deployment Target** | `ec2` | Helm `deployment.target` |\n\n### Model Artifact Management (S3)\n\nSeven pickle/joblib artifacts are downloaded from S3 at startup and cached under `api/data/` (bucket structure `rcs-ehr-cai-s3-{env}/fallrisk/v1/{file}`):\n\n| Artifact | S3 Key | Local Path |\n|---|---|---|\n| Diagnosis dictionary | `fallrisk/v1/diagnosis-dictionary.pkl` | `api/data/diagnosis-dictionary.pkl` |\n| Drug list dictionary | `fallrisk/v1/druglist-dictionary.pkl` | `api/data/druglist-dictionary.pkl` |\n| New drug list dictionary | `fallrisk/v1/new-druglist-dictionary.pkl` | `api/data/new-druglist-dictionary.pkl` |\n| SHAP explainer | `fallrisk/v1/explainer1.0.pkl` | `api/data/explainer1.0.pkl` |\n| Fall-risk model (`rf_model`) | `fallrisk/v1/fall-risk-analysis1.0.joblib` | `api/data/fall-risk-analysis1.0.joblib` |\n| Column order list | `fallrisk/v1/order-dictionary.pkl` | `api/data/order-dictionary.pkl` |\n| Preprocessing pipeline | `fallrisk/v1/pipeline-preprocess1.0.pkl` | `api/data/pipeline-preprocess1.0.pkl` |\n\n`API_S3_BUCKET` selects the bucket (prod: `rcs-ehr-cai-s3-prod`). `API_FALLRISK_OVERWRITE=false` (default) skips re-downloading files that already exist locally; set to `true` to force a refresh from S3.\n\n### Production Resource Configuration\n\n| Resource | Value | Purpose |\n|---|---|---|\n| **CPU Request** | 2 cores | Guaranteed CPU allocation |\n| **CPU Limit** | 3 cores | Maximum CPU allowance |\n| **Memory Request** | 4096 Mi | Guaranteed memory (4 GB minimum for stable operation) |\n| **Memory Limit** | 5120 Mi | Maximum memory (5 GB required for ML model loading) |\n| **Replicas** | 10 | Production redundancy |\n| **Ephemeral Volumes** | `/tmp`, `/app/src/api/data` (emptyDir) | Scratch space and model artifact cache |\n| **Ingress Timeouts** | 360s read/send | `nginx.ingress.kubernetes.io/proxy-*-timeout` |\n\n### Authentication and Security\n\n| Configuration | Value |\n|---|---|\n| **Application-level Authentication** | Not implemented — route handlers in `views.py` do not validate a bearer token or API key |\n| **Access Control** | Enforced at the infrastructure layer (ingress, private networking, cross-account IAM role) |\n| **AWS Access** | Cross-account IAM role `rcs-ehr-fallrisk-cross-account` (`AWS_ROLE_ARN`), scoped to S3 model-artifact reads |\n| **APM/Tracing** | Datadog (`DD_TRACE_ENABLED=true`, `DD_TRACE_SAMPLE_RATE=0.001`) via `ddtrace-run`, auto-patched through the shared `services.shared` package |\n| **Container User** | Non-root `appuser` (UID/GID 1000); `no-new-privileges`, all capabilities dropped except `NET_BIND_SERVICE` |\n\n### Environment Variables\n\n| Variable | Source | Purpose |\n|---|---|---|\n| `API_HOST` / `API_PORT` | Helm env | Bind address/port (prod: `0.0.0.0:8080`) |\n| `API_WORKERS_COUNT` | Helm env | Gunicorn worker count per replica (prod: `2`) |\n| `API_ENVIRONMENT` | Helm env | Environment name (`prod`/`stg`/`qa`/`dev`) |\n| `API_LOG_LEVEL` | Helm env | Python logging level |\n| `API_S3_BUCKET` | Helm env | Bucket holding model artifacts |\n| `API_FALLRISK_OVERWRITE` | Helm env / settings default | Force re-download of model artifacts |\n| `AWS_PROFILE` / `AWS_ROLE_ARN` / `AWS_REGION` | Helm env | Cross-account IAM role used for S3 access |\n| `DATA_DIR` | Helm env | Model artifact cache directory (`/app/src/api/data`) |\n| `DD_TRACE_ENABLED` / `DD_TRACE_SAMPLE_RATE` | Helm env | Datadog APM tracing |\n\n---\n\n## Input and Output Contracts\n\n### Input Schema\n\n**Primary request model:** `MLResidentRequestBody`\n**Model location:** [services/ml_services/fallrisk/api/ehr_common/input_contract/resident_ml_schema.py](services/ml_services/fallrisk/api/ehr_common/input_contract/resident_ml_schema.py)\n\n```json\n{\n \"source\": \"MATRIXCARE\",\n \"data_source_id\": \"DS001\",\n \"corporate_id\": \"CORP001\",\n \"customer_id\": \"FAC001\",\n \"trace_id\": \"trace-abc-123\",\n \"calculation_date\": \"2026-07-01T00:00:00Z\",\n \"risk_assessment_list\": [\"FallRisk\"],\n \"resident_medical_data\": [\n   {\n     \"resident_id\": \"RES-001\",\n     \"demographic\": {\n       \"age\": \"82\",\n       \"gender\": \"F\",\n       \"date_of_admission\": \"2025-01-15T00:00:00Z\",\n       \"smoking_status\": \"Never\"\n     },\n     \"diagnosis\": [\n       {\n         \"effective_datetime\": \"2025-06-01T00:00:00Z\",\n         \"coding_type\": \"ICD10\",\n         \"diagnosis_code\": \"R29.6\",\n         \"description\": \"Repeated falls\"\n       }\n     ],\n     \"medication_order_administration\": [],\n     \"point_of_care\": [],\n     \"minimum_data_set\": [],\n     \"vitals\": [],\n     \"event_history\": []\n   }\n ]\n}\n```\n\n**Required top-level fields:**\n- `source`, `data_source_id`, `corporate_id`, `customer_id` — source identifier metadata\n- `resident_medical_data[]` — one entry per resident to score\n\n**Required fields per resident (`ResidentMedicalDataForML`):**\n- `resident_id` — resident identifier\n- `demographic` — `age`, `gender`, `date_of_admission` (used for age/census validation)\n- Clinical history arrays are optional: `diagnosis`, `medication_order_administration`, `point_of_care`, `minimum_data_set`, `vitals`, `event_history`, `observation_history`, `wound_history`, `progress_notes`, `active_care_plans`\n\n**Validation rules applied before scoring (`remove_invalid_patient`):**\n- Resident `age` must be between 10 and 120 (inclusive range check)\n- `date_of_admission` must be on/before `calculation_date` (valid census)\n- Residents failing either check are excluded from scoring and returned with a `null` score\n\n### Output Schema\n\n**Wrapper:** `EHRInsightsResponseBody`\n**Core response model:** `EHRResponse`\n**Model location:** [services/ml_services/fallrisk/api/ehr_common/output_contract/resident_risk_output.py](services/ml_services/fallrisk/api/ehr_common/output_contract/resident_risk_output.py)\n\n```json\n{\n \"status\": 200,\n \"status_message\": \"Executed Successfully\",\n \"response\": {\n   \"source\": \"MATRIXCARE\",\n   \"data_source_id\": \"DS001\",\n   \"corporate_id\": \"CORP001\",\n   \"customer_id\": \"FAC001\",\n   \"resident_risk_result\": [\n     {\n       \"resident_id\": \"RES-001\",\n       \"resident_overall_risk_score\": 6,\n       \"factors_considered\": [\n         {\n           \"risk_type\": \"Fall Risk\",\n           \"risk_score\": 6,\n           \"risk_factors\": [\n             {\n               \"feature_group\": \"Clinical Factors\",\n               \"feature_type\": \"Diagnosis\",\n               \"feature_name\": \"Repeated falls\",\n               \"feature_description\": \"R29.6\",\n               \"feature_value\": \"2025-06-01T00:00:00Z\"\n             },\n             {\n               \"feature_group\": \"ML Model\",\n               \"feature_type\": \"Medication\",\n               \"feature_name\": \"Psychotropic medication\",\n               \"feature_description\": null,\n               \"feature_value\": null\n             }\n           ]\n         }\n       ]\n     }\n   ]\n }\n}\n```\n\n**Response fields:**\n- `resident_overall_risk_score` — final Hybrid Score (0-10), or `null` for residents excluded by validation\n- `factors_considered[].risk_factors[]` — merged clinical + ML factors, sourced from SHAP-ranked ML features and rule-based clinical indicators\n- Invalid residents are returned with `resident_overall_risk_score: null` and an empty `factors_considered` list rather than being dropped from the response\n\n**Error responses:**\n- `statusCode: 400` — malformed zlib payload on `/api/calculate-compressed` (`Invalid compressed payload`)\n- `statusCode: 422` — Pydantic schema validation failure (missing/invalid fields)\n- `statusCode: 500` — unhandled pipeline exception (model inference, feature engineering); logged via loguru and re-raised to FastAPI's default handler\n\n---\n\n## End-to-End Execution Path\n\n### High-Level Architecture\n\n- The endpoint accepts a plain or zlib-compressed `MLResidentRequestBody` and validates it against the Pydantic schema.\n- Resident-level validation (age 10-120, valid census) happens once, before either scoring branch runs.\n- Clinical-factor scoring and ML feature engineering/inference run as independent branches over the same validated resident batch.\n- SHAP-based explainability (`explainer1.0.pkl`) is computed only when `ml_considered_factors=true`, keeping the score-only path fast.\n- The two branches are merged by `calculate_hybrid_score()` into a single Hybrid Score per resident, plus a combined `risk_factors` list.\n\n```mermaid\ngraph TD\n   A[\"HTTP Request\u003cbr/\u003ePOST /api/calculate(-compressed)\"] --\u003e B[\"views.py\u003cbr/\u003eParse + validate MLResidentRequestBody\"]\n   B --\u003e C[\"processor.py\u003cbr/\u003eremove_invalid_patient()\"]\n   C --\u003e D[\"clinicalfactorstransformer\u003cbr/\u003etransformer_processor.py\"]\n   C --\u003e E[\"mldatatransformer\u003cbr/\u003eml_data_creator.py\"]\n   E --\u003e F[\"ml_fall_risk_prediction.py\u003cbr/\u003erf_model.predict_proba()\"]\n   F --\u003e G[\"feature_influence_transformer.py\u003cbr/\u003eexplainer.shap_values()\"]\n   D --\u003e H[\"processor.py\u003cbr/\u003ecalculate_hybrid_scores_and_prepare_output()\"]\n   F --\u003e H\n   G --\u003e H\n   H --\u003e I[\"EHRResponse\u003cbr/\u003e+ EHRInsightsResponseBody\"]\n   I --\u003e J[\"HTTP 200 Response\u003cbr/\u003eHybrid Score + Factors\"]\n\n   style B fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style C fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n   style D fill:#51cf66,stroke:#2f9e44,color:#333\n   style E fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style F fill:#51cf66,stroke:#2f9e44,color:#333\n   style G fill:#51cf66,stroke:#2f9e44,color:#333\n   style H fill:#ffd43b,stroke:#fab005,color:#333\n   style I fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n   style J fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n```\n\n### Detailed Execution Sequence\n\n```mermaid\nsequenceDiagram\n   participant API as fallrisk/views.py\n   participant PROC as processors/processor.py\n   participant UTIL as utils/util.py\n   participant CF as clinicalfactorstransformer/transformer_processor.py\n   participant MLT as mldatatransformer/ml_data_creator.py\n   participant MLP as mlprediction/ml_fall_risk_prediction.py\n\n   API-\u003e\u003ePROC: process(input_data, ml_considered_factors)\n   PROC-\u003e\u003eUTIL: remove_invalid_patient(...)\n   PROC-\u003e\u003eCF: clinical_factor_score_processor(...)\n   PROC-\u003e\u003eMLT: get_patients_ml_data(...)\n   PROC-\u003e\u003eMLP: get_ml_prediction_output(...)\n   MLP-\u003e\u003eUTIL: load_ml_models_in_cache()\n   PROC-\u003e\u003ePROC: calculate_hybrid_scores_and_prepare_output(...)\n   PROC--\u003e\u003eAPI: EHRResponse\n   API--\u003e\u003eAPI: wrap as EHRInsightsResponseBody\n```\n\nMain entry functions:\n- API layer: calculate, calculate_fallrisk, get_patients_data\n- Orchestration layer: process\n- Clinical scoring: clinical_factor_score_processor\n- ML feature engineering: get_patients_ml_data\n- ML prediction: get_ml_prediction_output\n- Fusion logic: calculate_hybrid_score, calculate_hybrid_scores_and_prepare_output\n\n---\n\n## Detailed Processing Stages\n\n### Stage map at a glance\n\n```mermaid\nflowchart LR\n   S1[1 Input handling] --\u003e S2[2 Resident validation]\n   S2 --\u003e S3[3 Clinical scoring]\n   S2 --\u003e S4[4 ML feature and inference]\n   S3 --\u003e S5[5 Hybrid fusion and response mapping]\n   S4 --\u003e S5\n\n   style S1 fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n   style S2 fill:#ffd43b,stroke:#fab005,color:#333\n   style S3 fill:#51cf66,stroke:#2f9e44,color:#333\n   style S4 fill:#4c6ef5,stroke:#364fc7,color:#fff\n   style S5 fill:#74c0fc,stroke:#1c7ed6,color:#0b2239\n```\n\n### 1) Input handling and endpoint dispatch\n\nFiles:\n- [services/ml_services/fallrisk/api/web/api/fallrisk/views.py](services/ml_services/fallrisk/api/web/api/fallrisk/views.py)\n\nInput:\n- JSON payload or zlib-compressed payload.\n\nOutput:\n- Validated request object sent to process orchestration.\n\nWhat happens:\n- /calculate accepts JSON and validates MLResidentRequestBody.\n- /calculate-compressed
