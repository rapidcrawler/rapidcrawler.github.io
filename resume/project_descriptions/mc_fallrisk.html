<script type="application/json" id="embedded-data">{"pages": {"overview": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e01 / THE PROJECT\u003c/span\u003e\u003ch2\u003eA hybrid clinical risk engine\u003c/h2\u003e\u003cp\u003eA durable technical case study. All project facts are a snapshot of the supplied README, dated 1 October 2026.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"hero-panel\"\u003e\u003cdiv\u003e\u003cspan class=\"eyebrow\"\u003eMATRIXCARE · CLINICAL INSIGHTS\u003c/span\u003e\u003ch1\u003eFrom resident data\u003cbr\u003eto explainable fall risk.\u003c/h1\u003e\u003cp\u003eClinical rules and tree-based machine learning combine into a 0–10 risk score, with contributing factors that nursing teams can use to plan interventions.\u003c/p\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"primary\" data-nav=\"runtime\"\u003eExplore the architecture →\u003c/button\u003e\u003cbutton data-nav=\"interview\"\u003eStart interview practice\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"hero-orbit\" aria-label=\"Two branches merge into hybrid risk\"\u003e\u003cdiv class=\"orbit-node\"\u003eClinical rules\u003cspan\u003e11 indicators\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"orbit-node\"\u003eML model\u003cspan\u003eV 1 RF / V 2 XGBoost\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"orbit-result\"\u003e0–10\u003cspan\u003eHybrid + reasons\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"metrics\"\u003e\u003cdiv\u003e\u003cstrong\u003e565 MB → 125 KB\u003c/strong\u003e\u003cspan\u003eModel artifact · V 1 → V 2\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003e−42.5%\u003c/strong\u003e\u003cspan\u003eML-only flags · observed sample\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eNot production\u003c/strong\u003e\u003cspan\u003eV 2 status · source snapshot\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eThe key interview insight:\u003c/b\u003e a smaller, more selective ML model does not automatically create a better clinician-facing product. V 2 ML-only precision improves, but the unchanged hybrid blend produces more alerts and lower precision. Evaluate the entire decision pipeline.\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Problem → action\" data-bookmark=\"Problem → action\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eProblem → action\u003c/h3\u003e\u003cp\u003eFalls in skilled nursing and long-term care can lead to injury, hospital transfers, and liability. Early identification supports supervision, mobility aids, and medication review.\u003c/p\u003e\u003cp\u003eUsers: nursing staff and clinical leadership through MatrixCare EHR Intelligent UI / clinical insights. Activation is per customer via \u003ccode\u003efallrisk_active_flag\u003c/code\u003e.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Purpose and Clinical Context\"\u003eSource · Purpose and Clinical Context ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Where the service sits\" data-bookmark=\"Where the service sits\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhere the service sits\u003c/h3\u003e\u003cp\u003eEHR data → SQS resident queues → ML Orchestrator → Fall Risk REST service → orchestrator merges Clinical Risk → UI / DB.\u003c/p\u003e\u003cp\u003eThe Fall Risk service is stateless; it processes PHI in memory and runs model inference in-process. S 3 is needed for artifact acquisition at startup, not for every prediction. The service has no runtime database dependency.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Deployment and Rollout\"\u003eSource · Deployment and Rollout ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Version boundaries\" data-bookmark=\"Version boundaries\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eVersion boundaries\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eV 1 production:\u003c/b\u003e Random Forest, legacy Section G, 10 replicas, old scientific stack.\u003c/li\u003e\u003cli\u003e\u003cb\u003eV 2 shadow/pre-production:\u003c/b\u003e XGBoost, Section GG, separate service/image/pipeline in dev, QA and staging.\u003c/li\u003e\u003cli\u003eThe request/response contract stays unchanged. Clinical hybrid recalibration and production go/no-go remain pending.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Model Versions: V1 and V2\"\u003eSource · Model Versions: V 1 and V 2 ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003ePreparation guide\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark How to revisit this reference\" data-bookmark=\"How to revisit this reference\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eHow to revisit this reference\u003c/h3\u003e\u003cul\u003e\u003cli\u003e5 minutes: read this overview, the metric comparison, and the three pitfalls.\u003c/li\u003e\u003cli\u003e30 minutes: step through runtime, explore formula boundaries, practice 10 questions.\u003c/li\u003e\u003cli\u003e90 minutes: rehearse your story, reason through incidents, review the launch plan.\u003c/li\u003e\u003cli\u003eRecord your actual role, measured outcomes and latest evidence in the notebook. Export a backup to carry it between devices.\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eModernisation timeline\u003c/h3\u003e\u003cdiv class=\"timeline\"\u003e\u003cdiv\u003e\u003cspan\u003eJun 2026\u003c/span\u003e\u003ch4\u003ePhase 1 · libraries\u003c/h4\u003e\u003cp\u003ePydantic v 2, FastAPI and tooling upgrade. Baseline replay: zero output deviation using CSV diff and deep JSON equality.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eJun–Jul 2026\u003c/span\u003e\u003ch4\u003ePhase 2 · retraining\u003c/h4\u003e\u003cp\u003ePython 3.12 retraining: Random Forest followed by XGBoost. Features aligned to Section GG.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eSep 2026\u003c/span\u003e\u003ch4\u003eFine-tune + shadow\u003c/h4\u003e\u003cp\u003eArtifact py 312_20260916; 14-day V 1/V 2 comparison. QA releases 001–005; staging 001–002.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eOct 2026\u003c/span\u003e\u003ch4\u003eDecision pending\u003c/h4\u003e\u003cp\u003eStored-procedure analysis and NHC multi-customer work in progress. Hybrid recalibration and production approval pending.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eInterview guardrails\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Three claims to avoid\" data-bookmark=\"Three claims to avoid\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eThree claims to avoid\u003c/h3\u003e\u003cul\u003e\u003cli\u003e“V 2 is better in production.” It is not yet in production in this snapshot, and hybrid results are worse on workload/precision.\u003c/li\u003e\u003cli\u003e“83% accuracy means 83% of alerts are right.” The holdout has a near-balanced label mix; real-world precision is much lower.\u003c/li\u003e\u003cli\u003e“4,500× smaller means 4,500× less RAM or cost.” Only artifact size is measured. Runtime preprocessing, Python, SHAP and batch frames still consume memory.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Model Performance\"\u003eSource · Model Performance ↗\u003c/button\u003e\u003c/article\u003e", "runtime": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e02 / SYSTEM DESIGN\u003c/span\u003e\u003ch2\u003eFollow a resident through the system\u003c/h2\u003e\u003cp\u003eClick a node or step through the request. The documented branches are independent; exact scheduling between them requires source-code verification.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"flow-prev\"\u003e← Previous\u003c/button\u003e\u003cbutton id=\"flow-next\" class=\"primary\"\u003eNext stage →\u003c/button\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"flow-invalid\"\u003e Invalid resident\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"flow-shap\" checked\u003e Include ML factors\u003c/label\u003e\u003c/div\u003e\u003cdiv id=\"flow-map\" class=\"flow-map\"\u003e\u003c/div\u003e\u003cdiv id=\"flow-detail\" class=\"flow-detail\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Validation is two layers\" data-bookmark=\"Validation is two layers\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eValidation is two layers\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eRequest schema:\u003c/b\u003e Pydantic validates \u003ccode\u003eMLResidentRequestBody\u003c/code\u003e. Invalid schema → 422.\u003c/li\u003e\u003cli\u003e\u003cb\u003eResident eligibility:\u003c/b\u003e age 10–120 inclusive; admission date ≤ calculation date. Invalid resident → 200 with null score and empty factors.\u003c/li\u003e\u003cli\u003eEligibility checks happen once before scoring. Invalid residents remain represented in the final output.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Input Schema\"\u003eSource · Input Schema ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Clinical branch\" data-bookmark=\"Clinical branch\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eClinical branch\u003c/h3\u003e\u003cp\u003eSix transformers—admission, diagnosis, MDS, POC, vitals and medication—run concurrently with \u003ccode\u003easyncio.gather\u003c/code\u003e. They produce the indicator states used by the weighted rules, transformed clinical score and explicit factor list.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Clinical Factor Score Formula\"\u003eSource · Clinical Factor Score Formula ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark ML branch\" data-bookmark=\"ML branch\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eML branch\u003c/h3\u003e\u003cp\u003eBuild features → merge dictionaries → enforce training column order → cached preprocessing pipeline → model \u003ccode\u003epredict_proba()\u003c/code\u003e → documented recent-fall boost → optional SHAP → map feature names to factors.\u003c/p\u003e\u003cp\u003eColumn order and preprocessing are part of the model contract; deploying a model independently of these artifacts risks incorrect scores.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Model and Inference Architecture\"\u003eSource · Model and Inference Architecture ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Fusion and assembly\" data-bookmark=\"Fusion and assembly\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eFusion and assembly\u003c/h3\u003e\u003cp\u003eThe orchestrator matches clinical and ML outputs per resident, applies a four-branch formula, merges explanations, assigns Fall Risk and emits \u003ccode\u003eEHRResponse\u003c/code\u003e, wrapped by \u003ccode\u003eEHRInsightsResponseBody\u003c/code\u003e.\u003c/p\u003e\u003cp\u003eIf a valid resident has no factors from either branch, add the “Age of resident” factor. This fallback is different from the invalid-resident empty list.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Hybrid Score Fusion Formula\"\u003eSource · Hybrid Score Fusion Formula ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eCode ownership map\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eFile / function\u003c/th\u003e\u003cth\u003eResponsibility\u003c/th\u003e\u003cth\u003eChange-sensitive area\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eweb/api/fallrisk/views.py\u003c/code\u003e\u003cbr\u003ecalculate / calculate_fallrisk / get_patients_data\u003c/td\u003e\u003ctd\u003ePlain and compressed payload decoding; schema validation; trace setup; route delegation\u003c/td\u003e\u003ctd\u003e422 vs 400; query flag semantics\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eservices/processors/processor.py\u003c/code\u003e\u003cbr\u003eprocess / calculate_hybrid_score / calculate_hybrid_scores_and_prepare_output\u003c/td\u003e\u003ctd\u003eValidation orchestration, clinical/ML branch coordination, fusion and resident response composition\u003c/td\u003e\u003ctd\u003eFormula precedence; joins; null outputs\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eutils/util.py\u003c/code\u003e\u003cbr\u003eremove_invalid_patient / download_ml_models / load_ml_models_in_cache\u003c/td\u003e\u003ctd\u003eAge/census eligibility; artifact downloads and cached loading\u003c/td\u003e\u003ctd\u003eBoundary dates; stale artifact cache\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etransformers/clinicalfactorstransformer/transformer_processor.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eClinical transformer aggregation; weighted scoring; nonlinear transform\u003c/td\u003e\u003ctd\u003eRecency, indicator weights and factor display\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etransformers/mldatatransformer/ml_data_creator.py\u003c/code\u003e\u003cbr\u003eget_patients_ml_data\u003c/td\u003e\u003ctd\u003eEvent, medication, diagnosis, demographics, vitals, MDS and POC/ADL feature merge\u003c/td\u003e\u003ctd\u003eTrain/serve consistency; missingness\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003emlprediction/ml_fall_risk_prediction.py\u003c/code\u003e\u003cbr\u003eget_ml_prediction_output\u003c/td\u003e\u003ctd\u003ePreprocessing, model probability, optional factors; score-only path\u003c/td\u003e\u003ctd\u003eProbability scale and rule boost\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003emlprediction/feature_influence_transformer.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eSHAP ranking of preprocessed features\u003c/td\u003e\u003ctd\u003eExplanation validity / feature mapping\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eml_considered_factors.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eReadable feature names across clinical domains\u003c/td\u003e\u003ctd\u003eFactor mapping and duplicate semantics\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eapi/__main__.py\u003c/code\u003e + \u003ccode\u003eweb/lifetime.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eWorker mode, preload, startup warmup, shutdown registration\u003c/td\u003e\u003ctd\u003eModel availability before traffic\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eapi/settings.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEnvironment-driven defaults, S 3 keys and cache paths\u003c/td\u003e\u003ctd\u003eWrong environment / artifact bundle\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eehr_common/input_contract/resident_ml_schema.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eRequest / resident models\u003c/td\u003e\u003ctd\u003eCompatibility\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eehr_common/output_contract/resident_risk_output.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEHRResponse and output models\u003c/td\u003e\u003ctd\u003eCompatibility\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Data domains and transformations\" data-bookmark=\"Data domains and transformations\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eData domains and transformations\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eDomain\u003c/th\u003e\u003cth\u003eSignals\u003c/th\u003e\u003cth\u003eTransformation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDiagnoses\u003c/td\u003e\u003ctd\u003eICD-10, e.g. R 29.6\u003c/td\u003e\u003ctd\u003eDiagnosis dictionary\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMedication\u003c/td\u003e\u003ctd\u003eDrug name / class\u003c/td\u003e\u003ctd\u003eDrug dictionaries\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDS\u003c/td\u003e\u003ctd\u003eQuestion code + answer\u003c/td\u003e\u003ctd\u003eIndicator / one-hot encoding; V 2 GG alignment\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePOC / ADL\u003c/td\u003e\u003ctd\u003eType, category, response\u003c/td\u003e\u003ctd\u003eBalance, continence, nutrition signals\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVitals\u003c/td\u003e\u003ctd\u003eBP, temperature, blood sugar\u003c/td\u003e\u003ctd\u003e°C → °F; mmol/L → mg/dL; deviation from baseline\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDemographics\u003c/td\u003e\u003ctd\u003eAge, gender, admission\u003c/td\u003e\u003ctd\u003eNumeric/categorical features\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEvents\u003c/td\u003e\u003ctd\u003eFalls, incidents\u003c/td\u003e\u003ctd\u003eRecency-weighted features\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Feature Engineering Sources\"\u003eSource · Feature Engineering Sources ↗\u003c/button\u003e\u003c/article\u003e", "scoring": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e03 / FORMULA LAB\u003c/span\u003e\u003ch2\u003eMake the score explain itself\u003c/h2\u003e\u003cp\u003eExact README formulas, with interactive inputs. This is a teaching calculator, not a fitted model or clinical prediction tool. API rounding is not specified in the README.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eDocumented clinical formula\u003c/span\u003e\u003ch3\u003eBuild a clinical score\u003c/h3\u003e\u003cdiv id=\"clinical-inputs\"\u003e\u003c/div\u003e\u003clabel class=\"field\"\u003ePsychotropic administration recency\u003cselect id=\"psych\"\u003e\u003coption value=\"0\"\u003eNo qualifying medication · 0\u003c/option\u003e\u003coption value=\"1\"\u003eWithin last 7 days · 1.0\u003c/option\u003e\u003coption value=\"0.6\"\u003e7–30 days ago · 0.6\u003c/option\u003e\u003coption value=\"0.4\"\u003eOver 30 days, active order · 0.4\u003c/option\u003e\u003coption value=\"0.2\"\u003eNo administration date · 0.2\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003cp class=\"small\"\u003eUse the maximum qualifying medication value, not the sum. Exact day-7 boundary wording overlaps in the README; inspect implementation for timestamp precision.\u003c/p\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"clinical-example\"\u003eLoad README example\u003c/button\u003e\u003cbutton id=\"clinical-clear\"\u003eClear indicators\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"clinical-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv class=\"chart-scroll\"\u003e\u003csvg id=\"clinical-chart\" viewBox=\"0 0 500 270\" role=\"img\" aria-label=\"Raw versus transformed clinical score\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003cdiv class=\"formula\"\u003eC = 2 r − r² / 100\u003c/div\u003e\u003c/article\u003e\n\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eDocumented hybrid formula\u003c/span\u003e\u003ch3\u003eExplore score fusion\u003c/h3\u003e\u003clabel class=\"range-label\"\u003eClinical score C \u003coutput id=\"c-label\"\u003e\u003c/output\u003e\u003cinput id=\"c-score\" type=\"range\" min=\"0\" max=\"100\" step=\"0.01\" value=\"67.51\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eML score M \u003coutput id=\"m-label\"\u003e\u003c/output\u003e\u003cinput id=\"m-score\" type=\"range\" min=\"0\" max=\"100\" step=\"0.01\" value=\"80\"\u003e\u003c/label\u003e\u003clabel\u003e\u003cinput id=\"link-clinical\" type=\"checkbox\" checked\u003e Use the clinical builder above\u003c/label\u003e\u003cdiv class=\"actions presets\"\u003e\u003cbutton data-preset=\"80,75\"\u003eBoth ≥70\u003c/button\u003e\u003cbutton data-preset=\"65,45\"\u003eDifference 20\u003c/button\u003e\u003cbutton data-preset=\"65,44.99\"\u003eJust over 20\u003c/button\u003e\u003cbutton data-preset=\"90,40\"\u003eDifference 50\u003c/button\u003e\u003cbutton data-preset=\"90,39.99\"\u003eJust over 50\u003c/button\u003e\u003cbutton data-preset=\"100,0\"\u003eMaximum disagreement\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"hybrid-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv id=\"branch-list\"\u003e\u003c/div\u003e\u003cdiv class=\"chart-scroll\"\u003e\u003csvg id=\"heatmap\" viewBox=\"0 0 480 360\" role=\"img\" aria-label=\"Hybrid score heatmap across clinical and ML scores\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eClick the heatmap to choose branch inputs. The high-risk reference is hybrid ≥7 in the observed evaluation.\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eBranch precedence matters.\u003c/b\u003e The both-scores-≥70 branch is evaluated before the difference rules. At difference 20, the result uses the higher score; immediately above 20 it switches to an average. These boundaries can create discontinuities. A nonlinear risk score is not a calibrated probability.\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Four branches, in order\" data-bookmark=\"Four branches, in order\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eFour branches, in order\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eFirst matching condition\u003c/th\u003e\u003cth\u003eHybrid result H\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eM ≥70 and C ≥70\u003c/td\u003e\u003ctd\u003e(higher + lower × (100 − higher) / 150) / 10\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e|M − C| ≤20\u003c/td\u003e\u003ctd\u003emax(M,C) / 10\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e|M − C| ≤50\u003c/td\u003e\u003ctd\u003e(M + C) / 20\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOtherwise\u003c/td\u003e\u003ctd\u003e(higher − higher × (50 − lower) / 200) / 10\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eThe introduction’s “when the two scores agree, the higher one wins” is shorthand; the both-high branch adds a correction. Use this exact table to reason about examples.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Hybrid Score Fusion Formula\"\u003eSource · Hybrid Score Fusion Formula ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eRecent-fall probability floor\u003c/h3\u003e\u003cspan class=\"tag\"\u003eDocumented rule · synthetic inputs\u003c/span\u003e\u003clabel class=\"range-label\"\u003eBase model probability \u003coutput id=\"prob-label\"\u003e\u003c/output\u003e\u003cinput id=\"prob\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.3\"\u003e\u003c/label\u003e\u003clabel\u003e\u003cinput id=\"recent-fall\" type=\"checkbox\" checked\u003e Fall in last 30 days\u003c/label\u003e\u003cdiv id=\"fall-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cp\u003eWhen a fall is within the documented 30-day window, use at least 0.90: p′ = max(p, 0.90). Other time windows and exact boundary semantics are not provided. This rule is outside the fitted model; it can affect calibration and may not be reflected by model-only SHAP.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Explanation mechanics and limitations\" data-bookmark=\"Explanation mechanics and limitations\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eExplanation mechanics and limitations\u003c/h3\u003e\u003cul\u003e\u003cli\u003eClinical factors are direct rule outputs. Mobility device and mechanical lift score as one indicator but display separately.\u003c/li\u003e\u003cli\u003eFall with injury has weight zero: it appears as a factor without increasing the clinical score.\u003c/li\u003e\u003cli\u003eV 1 uses SHAP from a representative tree; V 2 explains the full boosted ensemble.\u003c/li\u003e\u003cli\u003eSHAP runs on the transformed frame with \u003ccode\u003echeck_additivity=False\u003c/code\u003e. Disabling the check does not establish correctness or causality.\u003c/li\u003e\u003cli\u003e\u003ccode\u003eml_considered_factors=false\u003c/code\u003e skips ML attribution, not necessarily clinical factors or the valid-resident fallback.\u003c/li\u003e\u003cli\u003eScore and explanation need version alignment across preprocessing, model, boost and fusion.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"SHAP-based Explainability\"\u003eSource · SHAP-based Explainability ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e", "evidence": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e04 / EVALUATION\u003c/span\u003e\u003ch2\u003eCompare the product, not just the model\u003c/h2\u003e\u003cp\u003eObserved results from one documented 14-day comparison. Metrics below are recomputed from counts where possible; training-holdout values remain exactly as reported.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"tabs\" role=\"group\" aria-label=\"Evaluation layer\"\u003e\u003cbutton data-cohort=\"ml\" class=\"selected\" aria-pressed=\"true\"\u003eML only · ≥70\u003c/button\u003e\u003cbutton data-cohort=\"hybrid\" aria-pressed=\"false\"\u003eClinician hybrid · ≥7\u003c/button\u003e\u003c/div\u003e\u003cp\u003eReference cohort: 2,000 observations; 136 actual fallers/events; 6.8% prevalence. The README alternates “residents” and “resident-days”; verify the unit before quoting patient-level conclusions.\u003c/p\u003e\u003cdiv id=\"evidence-summary\" class=\"metrics\"\u003e\u003c/div\u003e\u003cdiv id=\"evidence-chart\"\u003e\u003c/div\u003e\u003cdiv id=\"confusion\" class=\"grid2\"\u003e\u003c/div\u003e\u003cdiv id=\"metric-table\"\u003e\u003c/div\u003e\u003cdiv id=\"evidence-takeaway\" class=\"callout accent\"\u003e\u003c/div\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Training holdout · reported values\" data-bookmark=\"Training holdout · reported values\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eTraining holdout · reported values\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eModel\u003c/th\u003e\u003cth\u003eAccuracy\u003c/th\u003e\u003cth\u003ePrecision\u003c/th\u003e\u003cth\u003eRecall\u003c/th\u003e\u003cth\u003eF 1\u003c/th\u003e\u003cth\u003eFalse positives\u003c/th\u003e\u003cth\u003eFalse negatives\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eV 1 · Aug 2023\u003c/td\u003e\u003ctd\u003e84.11%\u003c/td\u003e\u003ctd\u003e84.44%\u003c/td\u003e\u003ctd\u003e84.11%\u003c/td\u003e\u003ctd\u003e84.23%\u003c/td\u003e\u003ctd\u003e6.72%\u003c/td\u003e\u003ctd\u003e9.17%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV 2 · Sep 2026\u003c/td\u003e\u003ctd\u003e83.30%\u003c/td\u003e\u003ctd\u003e83.92%\u003c/td\u003e\u003ctd\u003e83.30%\u003c/td\u003e\u003ctd\u003e83.34%\u003c/td\u003e\u003ctd\u003e5.49%\u003c/td\u003e\u003ctd\u003e11.22%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eThe README does not specify macro/micro/weighted averaging or the denominator of the false-positive/negative percentages. Do not reconstruct a confusion matrix from this table. Near-balanced event labels make these metrics unsuitable for direct production alert-precision claims.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Model Performance\"\u003eSource · Model Performance ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003cspan class=\"tag\"\u003eHypothetical prevalence shift\u003c/span\u003e\u003ch3\u003eWhy precision changes\u003c/h3\u003e\u003cp\u003eThis counterfactual holds one observed operating point’s recall and false-positive rate fixed while changing prevalence. It is a teaching exercise; facility mix can also change both rates.\u003c/p\u003e\u003clabel class=\"field\"\u003eOperating point\u003cselect id=\"prevalence-model\"\u003e\u003coption value=\"ml1\"\u003eV 1 ML-only\u003c/option\u003e\u003coption value=\"ml2\" selected\u003eV 2 ML-only\u003c/option\u003e\u003coption value=\"hybrid1\"\u003eV 1 hybrid\u003c/option\u003e\u003coption value=\"hybrid2\"\u003eV 2 hybrid\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eHypothetical prevalence \u003coutput id=\"prev-label\"\u003e\u003c/output\u003e\u003cinput type=\"range\" id=\"prevalence\" min=\"0.5\" max=\"60\" step=\"0.1\" value=\"6.8\"\u003e\u003c/label\u003e\u003cdiv id=\"prevalence-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv class=\"formula\"\u003ePPV = sensitivity × prevalence / [sensitivity × prevalence + FPR × (1 − prevalence)]\u003c/div\u003e\u003cbutton id=\"prevalence-reset\"\u003eReturn to 6.8%\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eEvidence discipline\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark What this sample can establish\" data-bookmark=\"What this sample can establish\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eWhat this sample can establish\u003c/h3\u003e\u003cul\u003e\u003cli\u003eAt ML threshold ≥70, V 2 lowers alert volume and raises precision, while recall falls from 101/136 to 81/136. No single metric establishes dominance.\u003c/li\u003e\u003cli\u003eAt hybrid ≥7, V 2 adds 155 alerts for four more fallers; false positives rise by 151.\u003c/li\u003e\u003cli\u003eUnpaired Wilson intervals are displayed for individual recall estimates. They do not test paired V 1/V 2 differences.\u003c/li\u003e\u003cli\u003eResident-level paired disagreements are unavailable. A paired significance test cannot be reconstructed from aggregate counts.\u003c/li\u003e\u003cli\u003eNo per-resident scores are supplied: do not invent an ROC curve, PR curve, threshold sweep or recalibrated production metric.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Model Performance\"\u003eSource · Model Performance ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark V1 → V2 technical comparison\" data-bookmark=\"V1 → V2 technical comparison\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eV 1 → V 2 technical comparison\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eDimension\u003c/th\u003e\u003cth\u003eV 1 production\u003c/th\u003e\u003cth\u003eV 2 shadow\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eModel\u003c/td\u003e\u003ctd\u003eRandom Forest · 100 trees · depth 30\u003c/td\u003e\u003ctd\u003eXGBoost\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eArtifact\u003c/td\u003e\u003ctd\u003e565 MB\u003c/td\u003e\u003ctd\u003e125 KB · ≈4,520× smaller (decimal units)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePython / stack\u003c/td\u003e\u003ctd\u003e3.9; scikit-learn 1.2.2\u003c/td\u003e\u003ctd\u003e3.12; scikit-learn 1.9, numpy 2, pandas 2.3, SHAP 0.46 (README reported; verify lockfile)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFeatures\u003c/td\u003e\u003ctd\u003e138; legacy Section G\u003c/td\u003e\u003ctd\u003e148 base +14 engineered =162; 27 gg 01 xx features\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTraining window\u003c/td\u003e\u003ctd\u003eHistorical pre-2023 extract\u003c/td\u003e\u003ctd\u003eAfter 31 Oct 2023\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSHAP\u003c/td\u003e\u003ctd\u003eOne representative tree\u003c/td\u003e\u003ctd\u003eFull boosted ensemble\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContract\u003c/td\u003e\u003ctd\u003eExisting EHR request/response\u003c/td\u003e\u003ctd\u003eUnchanged\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeployment\u003c/td\u003e\u003ctd\u003eehr-fallrisk ·10 replicas ·prod\u003c/td\u003e\u003ctd\u003eehr-fallrisk-v 2 ·1 replica per dev/QA/stg\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eArtifacts\u003c/td\u003e\u003ctd\u003efallrisk/v 1/\u003c/td\u003e\u003ctd\u003efallrisk/v 2/{pretrained,generated}/\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Model Versions: V1 and V2\"\u003eSource · Model Versions: V 1 and V 2 ↗\u003c/button\u003e\u003c/article\u003e", "training": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e05 / DATA \u0026 MLOPS\u003c/span\u003e\u003ch2\u003eTraining, validation and the launch decision\u003c/h2\u003e\u003cp\u003eSeparate the documented pipeline from the design you would propose in an interview.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Dataset snapshot\" data-bookmark=\"Dataset snapshot\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eDataset snapshot\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eProperty\u003c/th\u003e\u003cth\u003eREADME value\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eSource\u003c/td\u003e\u003ctd\u003eSnowflake SPML_FALLEVENTSWITHVITALS_WITH_GG; secure analytics DB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCustomers\u003c/td\u003e\u003ctd\u003eOne customer, ID 18618; 4061 and 12116 parameterised\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVolume\u003c/td\u003e\u003ctd\u003e≈145.8 K events; ≈90 K unique residents raw; 143,764 rows after filtering\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWindow\u003c/td\u003e\u003ctd\u003eEvents after 31 Oct 2023; aligned to GG\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSplit\u003c/td\u003e\u003ctd\u003e80/20 grouped by resident\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLabels\u003c/td\u003e\u003ctd\u003e55.8% fall /44.2% non-fall; event-matched\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMissingness\u003c/td\u003e\u003ctd\u003e59/179 raw columns \u0026gt;70% missing; diagnosis 0.23% missing\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Training Data\"\u003eSource · Training Data ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Leakage: what is supported\" data-bookmark=\"Leakage: what is supported\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eLeakage: what is supported\u003c/h3\u003e\u003cul\u003e\u003cli\u003eResident-grouped split prevents a resident from appearing in both train and test.\u003c/li\u003e\u003cli\u003eREADME FAQ also describes a strict date window and future-fall labels from a separate fall-events extract.\u003c/li\u003e\u003cli\u003eGrouping alone does not prove point-in-time correctness. Verify that each feature existed at prediction time, labels are future-only and preprocessing is fit on training data only.\u003c/li\u003e\u003cli\u003eProposed extensions: temporal holdout, customer/facility holdout, label-window audit and duplicated-event checks.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Training Data\"\u003eSource · Training Data ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Missingness and generalisation\" data-bookmark=\"Missingness and generalisation\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eMissingness and generalisation\u003c/h3\u003e\u003cul\u003e\u003cli\u003eDocumentation patterns and resident acuity can vary by facility/customer. One-customer training limits the strength of generalisation claims.\u003c/li\u003e\u003cli\u003eMissing is not automatically equivalent to normal or absent. Examine how preprocessing handles missing assessments/vitals.\u003c/li\u003e\u003cli\u003eVerify that optional fields, unit conversions, mappings and column ordering are consistent during training and serving.\u003c/li\u003e\u003cli\u003eProposed analysis: performance and coverage by missingness level, facility, customer, age band and gender.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Training Data\"\u003eSource · Training Data ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Current reproducibility\" data-bookmark=\"Current reproducibility\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eCurrent reproducibility\u003c/h3\u003e\u003cp\u003eManual notebook-based training, pinned dependencies, seeded randomness and filename-based artifact versions (e.g. \u003ccode\u003epy312_20260916\u003c/code\u003e). Scripted pipeline, registry, model cards and automated drift monitoring remain planned improvements.\u003c/p\u003e\u003cp\u003eRelated notebooks/procedure documents are referenced by the README but were not supplied. Their detailed internals cannot be verified from this artifact.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"FAQ\"\u003eSource · FAQ ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eProposed interview design\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Recalibration plan you can defend\" data-bookmark=\"Recalibration plan you can defend\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRecalibration plan you can defend\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003e1. Define the action and cost.\u003c/b\u003e Agree with clinical SMEs on tolerated alert volume, safety priorities and the evaluation horizon.\u003c/li\u003e\u003cli\u003e\u003cb\u003e2. Build point-in-time data.\u003c/b\u003e Collect aligned clinical scores, boosted/unboosted ML scores and future outcomes across customers and periods.\u003c/li\u003e\u003cli\u003e\u003cb\u003e3. Split appropriately.\u003c/b\u003e Keep residents grouped; reserve temporal/customer holdouts. Choose calibration and thresholds without tuning on the final test set.\u003c/li\u003e\u003cli\u003e\u003cb\u003e4. Compare candidates.\u003c/b\u003e Evaluate the existing piecewise blend, retuned blend and a simple calibrated fusion model. Check monotonicity and discontinuities.\u003c/li\u003e\u003cli\u003e\u003cb\u003e5. Measure the whole output.\u003c/b\u003e Recall, precision, flag rate, confidence intervals, subgroup results, calibration and explanation consistency.\u003c/li\u003e\u003cli\u003e\u003cb\u003e6. Validate operationally.\u003c/b\u003e Latency, memory, startup, batch-size behaviour, PHI logging controls, auth and probes.\u003c/li\u003e\u003cli\u003e\u003cb\u003e7. Shadow → gated cutover.\u003c/b\u003e Clinical/regulatory sign-off; documented rollback trigger; continued outcome monitoring.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Open Decisions\"\u003eSource · Open Decisions ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"callout accent\"\u003e\u003cb\u003eProposed production criterion in the README:\u003c/b\u003e on a multi-customer backtest, V 2 hybrid matches or beats V 1 sensitivity while not exceeding the V 1 flagged-resident rate; clinical sign-off and regulatory review complete. This is a proposal, not an achieved result.\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eRisk register · documented gaps\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eGap\u003c/th\u003e\u003cth\u003eWhy it matters\u003c/th\u003e\u003cth\u003eNext step\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eSingle customer\u003c/td\u003e\u003ctd\u003eDifferent documentation and resident mix\u003c/td\u003e\u003ctd\u003eMulti-customer data + per-customer evaluation\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHybrid not retuned\u003c/td\u003e\u003ctd\u003eHigher clinician workload / lower precision\u003c/td\u003e\u003ctd\u003eAgree operating point and recalibrate\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOnly 136 falls\u003c/td\u003e\u003ctd\u003eWide uncertainty; uncertain go/no-go\u003c/td\u003e\u003ctd\u003eLarger multi-period backtest\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV 1 Python 3.9\u003c/td\u003e\u003ctd\u003eUnsupported runtime in snapshot\u003c/td\u003e\u003ctd\u003eModern runtime migration\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRetired Section G\u003c/td\u003e\u003ctd\u003eFeature mismatch with current records\u003c/td\u003e\u003ctd\u003eGG-aligned V 2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo application auth\u003c/td\u003e\u003ctd\u003eDependence on network controls\u003c/td\u003e\u003ctd\u003eService-to-service OAuth 2/JWT\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDisabled health probes\u003c/td\u003e\u003ctd\u003ePoor automated health detection\u003c/td\u003e\u003ctd\u003eEnable after correcting route\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNotebook/filename versioning\u003c/td\u003e\u003ctd\u003eReproducibility and audit gaps\u003c/td\u003e\u003ctd\u003ePipeline, registry and model cards\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNo automated outcome/drift monitoring\u003c/td\u003e\u003ctd\u003eSilent degradation\u003c/td\u003e\u003ctd\u003eScheduled backtest + feature monitoring\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUndocumented subgroup performance\u003c/td\u003e\u003ctd\u003eUnexamined equity gaps\u003c/td\u003e\u003ctd\u003eAge, gender, facility/customer analysis\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHard-coded recent-fall boost\u003c/td\u003e\u003ctd\u003eCan mask model and affect calibration\u003c/td\u003e\u003ctd\u003eSME review; compare learned feature approach\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e", "api": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e06 / SERVICE CONTRACT\u003c/span\u003e\u003ch2\u003eInspect the API boundary\u003c/h2\u003e\u003cp\u003eSamples come from the README. The request lab applies the documented eligibility rules only; it does not emulate full Pydantic validation or execute a trained model.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Routes and failures\" data-bookmark=\"Routes and failures\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRoutes and failures\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMethod\u003c/th\u003e\u003cth\u003eRoute\u003c/th\u003e\u003cth\u003eBehaviour\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ePOST\u003c/td\u003e\u003ctd\u003e/api/calculate\u003c/td\u003e\u003ctd\u003eJSON → hybrid score + factors\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePOST\u003c/td\u003e\u003ctd\u003e/api/calculate-compressed\u003c/td\u003e\u003ctd\u003ezlib-compressed JSON → same scoring flow\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePOST\u003c/td\u003e\u003ctd\u003e/api/get_patients_ml_data\u003c/td\u003e\u003ctd\u003eDebug engineered features; no inference\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGET\u003c/td\u003e\u003ctd\u003e/api/health\u003c/td\u003e\u003ctd\u003eDocumented health endpoint\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGET\u003c/td\u003e\u003ctd\u003e/api/docs\u003c/td\u003e\u003ctd\u003eSwagger UI\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGET\u003c/td\u003e\u003ctd\u003e/api/redoc\u003c/td\u003e\u003ctd\u003eReDoc\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eNo application-level authentication is enforced by the inference handlers in the snapshot. \u003ccode\u003eml_considered_factors=true\u003c/code\u003e is the default explanation flag.\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eScenario\u003c/th\u003e\u003cth\u003eHTTP status\u003c/th\u003e\u003cth\u003eResponse / next action\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMalformed zlib\u003c/td\u003e\u003ctd\u003e400\u003c/td\u003e\u003ctd\u003eInvalid compressed payload; fix client compression\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSchema failure\u003c/td\u003e\u003ctd\u003e422\u003c/td\u003e\u003ctd\u003ePydantic details; correct missing/invalid fields\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUnhandled pipeline error\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003ctd\u003eFastAPI default; inspect trace/loguru stack\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIneligible resident\u003c/td\u003e\u003ctd\u003e200\u003c/td\u003e\u003ctd\u003enull score; factors_considered: []\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"API Endpoints\"\u003eSource · API Endpoints ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eResident eligibility lab\u003c/h3\u003e\u003clabel class=\"range-label\"\u003eResident age \u003coutput id=\"age-label\"\u003e\u003c/output\u003e\u003cinput type=\"range\" id=\"age\" min=\"0\" max=\"130\" step=\"1\" value=\"82\"\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eCalculation date\u003cinput type=\"date\" id=\"calc-date\" value=\"2026-07-01\"\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eAdmission date\u003cinput type=\"date\" id=\"admit-date\" value=\"2025-01-15\"\u003e\u003c/label\u003e\u003cdiv id=\"validation-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eDate-only teaching inputs. Production timestamp/timezone parsing and missing-date behaviour require schema/code verification.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Required and optional fields\" data-bookmark=\"Required and optional fields\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eRequired and optional fields\u003c/h3\u003e\u003cul\u003e\u003cli\u003eRequired top level: \u003ccode\u003esource\u003c/code\u003e, \u003ccode\u003edata_source_id\u003c/code\u003e, \u003ccode\u003ecorporate_id\u003c/code\u003e, \u003ccode\u003ecustomer_id\u003c/code\u003e, \u003ccode\u003eresident_medical_data[]\u003c/code\u003e.\u003c/li\u003e\u003cli\u003ePer resident: \u003ccode\u003eresident_id\u003c/code\u003e and demographic age, gender, admission date.\u003c/li\u003e\u003cli\u003eOptional clinical arrays: diagnosis, medication_order_administration, point_of_care, minimum_data_set, vitals, event_history, observation_history, wound_history, progress_notes, active_care_plans.\u003c/li\u003e\u003cli\u003eExamples include calculation_date, trace_id and risk_assessment_list; exact defaults and whether these are required in a specific branch must be verified in the request model.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Input Schema\"\u003eSource · Input Schema ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark README request sample\" data-bookmark=\"README request sample\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eREADME request sample\u003c/h3\u003e\u003cbutton class=\"copy\" data-copy=\"request-json\"\u003eCopy JSON\u003c/button\u003e\u003cpre id=\"request-json\"\u003e\u003ccode\u003e{\n \u0026quot;source\u0026quot;: \u0026quot;MATRIXCARE\u0026quot;,\n \u0026quot;data_source_id\u0026quot;: \u0026quot;DS001\u0026quot;,\n \u0026quot;corporate_id\u0026quot;: \u0026quot;CORP001\u0026quot;,\n \u0026quot;customer_id\u0026quot;: \u0026quot;FAC001\u0026quot;,\n \u0026quot;trace_id\u0026quot;: \u0026quot;trace-abc-123\u0026quot;,\n \u0026quot;calculation_date\u0026quot;: \u0026quot;2026-07-01T00:00:00Z\u0026quot;,\n \u0026quot;risk_assessment_list\u0026quot;: [\u0026quot;FallRisk\u0026quot;],\n \u0026quot;resident_medical_data\u0026quot;: [\n   {\n     \u0026quot;resident_id\u0026quot;: \u0026quot;RES-001\u0026quot;,\n     \u0026quot;demographic\u0026quot;: {\n       \u0026quot;age\u0026quot;: \u0026quot;82\u0026quot;,\n       \u0026quot;gender\u0026quot;: \u0026quot;F\u0026quot;,\n       \u0026quot;date_of_admission\u0026quot;: \u0026quot;2025-01-15T00:00:00Z\u0026quot;,\n       \u0026quot;smoking_status\u0026quot;: \u0026quot;Never\u0026quot;\n     },\n     \u0026quot;diagnosis\u0026quot;: [\n       {\n         \u0026quot;effective_datetime\u0026quot;: \u0026quot;2025-06-01T00:00:00Z\u0026quot;,\n         \u0026quot;coding_type\u0026quot;: \u0026quot;ICD10\u0026quot;,\n         \u0026quot;diagnosis_code\u0026quot;: \u0026quot;R29.6\u0026quot;,\n         \u0026quot;description\u0026quot;: \u0026quot;Repeated falls\u0026quot;\n       }\n     ],\n     \u0026quot;medication_order_administration\u0026quot;: [],\n     \u0026quot;point_of_care\u0026quot;: [],\n     \u0026quot;minimum_data_set\u0026quot;: [],\n     \u0026quot;vitals\u0026quot;: [],\n     \u0026quot;event_history\u0026quot;: []\n   }\n ]\n}\u003c/code\u003e\u003c/pre\u003e\u003cbutton class=\"source-link\" data-source=\"Input Schema\"\u003eSource · Input Schema ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark README response sample\" data-bookmark=\"README response sample\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eREADME response sample\u003c/h3\u003e\u003cbutton class=\"copy\" data-copy=\"response-json\"\u003eCopy JSON\u003c/button\u003e\u003cpre id=\"response-json\"\u003e\u003ccode\u003e{\n \u0026quot;status\u0026quot;: 200,\n \u0026quot;status_message\u0026quot;: \u0026quot;Executed Successfully\u0026quot;,\n \u0026quot;response\u0026quot;: {\n   \u0026quot;source\u0026quot;: \u0026quot;MATRIXCARE\u0026quot;,\n   \u0026quot;data_source_id\u0026quot;: \u0026quot;DS001\u0026quot;,\n   \u0026quot;corporate_id\u0026quot;: \u0026quot;CORP001\u0026quot;,\n   \u0026quot;customer_id\u0026quot;: \u0026quot;FAC001\u0026quot;,\n   \u0026quot;resident_risk_result\u0026quot;: [\n     {\n       \u0026quot;resident_id\u0026quot;: \u0026quot;RES-001\u0026quot;,\n       \u0026quot;resident_overall_risk_score\u0026quot;: 6,\n       \u0026quot;factors_considered\u0026quot;: [\n         {\n           \u0026quot;risk_type\u0026quot;: \u0026quot;Fall Risk\u0026quot;,\n           \u0026quot;risk_score\u0026quot;: 6,\n           \u0026quot;risk_factors\u0026quot;: [\n             {\n               \u0026quot;feature_group\u0026quot;: \u0026quot;Clinical Factors\u0026quot;,\n               \u0026quot;feature_type\u0026quot;: \u0026quot;Diagnosis\u0026quot;,\n               \u0026quot;feature_name\u0026quot;: \u0026quot;Repeated falls\u0026quot;,\n               \u0026quot;feature_description\u0026quot;: \u0026quot;R29.6\u0026quot;,\n               \u0026quot;feature_value\u0026quot;: \u0026quot;2025-06-01T00:00:00Z\u0026quot;\n             },\n             {\n               \u0026quot;feature_group\u0026quot;: \u0026quot;ML Model\u0026quot;,\n               \u0026quot;feature_type\u0026quot;: \u0026quot;Medication\u0026quot;,\n               \u0026quot;feature_name\u0026quot;: \u0026quot;Psychotropic medication\u0026quot;,\n               \u0026quot;feature_description\u0026quot;: null,\n               \u0026quot;feature_value\u0026quot;: null\n             }\n           ]\n         }\n       ]\n     }\n   ]\n }\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eThis sample is illustrative, not the expected output of the request above. The README does not supply enough artifacts to compute that prediction.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Output Schema\"\u003eSource · Output Schema ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Compression and contracts\" data-bookmark=\"Compression and contracts\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eCompression and contracts\u003c/h3\u003e\u003cul\u003e\u003cli\u003eCompressed requests use \u003cb\u003ezlib\u003c/b\u003e. Response compression is \u003cb\u003eGZipMiddleware\u003c/b\u003e with a minimum body size of 1,000 bytes. Do not confuse the two directions.\u003c/li\u003e\u003cli\u003eOutput wrapper: status, status_message, response with echoed source metadata and resident_risk_result[].\u003c/li\u003e\u003cli\u003eResident score: resident_overall_risk_score (0–10 or null). Factor list: factors_considered[].risk_factors[] with group/type/name/description/value.\u003c/li\u003e\u003cli\u003eTrace metadata is operational; keep trace IDs usable for correlation without embedding PHI.\u003c/li\u003e\u003cli\u003eProposal: version and snapshot contracts, exercise both payload paths, and cap batch/compressed-body sizes based on measured capacity.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Input and Output Contracts\"\u003eSource · Input and Output Contracts ↗\u003c/button\u003e\u003c/article\u003e", "operations": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e07 / PRODUCTION ENGINEERING\u003c/span\u003e\u003ch2\u003eArtifacts, workers, deployment and incidents\u003c/h2\u003e\u003cp\u003eUse the resource planner for configuration arithmetic. It cannot estimate latency, runtime RAM savings or infrastructure cost without measurements.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eStartup and model lifecycle\u003c/h3\u003e\u003cdiv class=\"startup-grid\"\u003e\u003cdiv\u003e\u003cb\u003e1\u003c/b\u003e\u003ch4\u003eLaunch\u003c/h4\u003e\u003cp\u003epython -m api; ddtrace-run if enabled\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e2\u003c/b\u003e\u003ch4\u003eDownload\u003c/h4\u003e\u003cp\u003eFetch seven missing S 3 artifacts; overwrite flag controls refresh\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e3\u003c/b\u003e\u003ch4\u003ePreload\u003c/h4\u003e\u003cp\u003eWorkers \u0026gt;1: master loads cached models before fork\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e4\u003c/b\u003e\u003ch4\u003eBuild app\u003c/h4\u003e\u003cp\u003eGZip middleware; /api routes; /static mount\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e5\u003c/b\u003e\u003ch4\u003eWarmup\u003c/h4\u003e\u003cp\u003eStartup calls cache loader; effective load for single worker\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e6\u003c/b\u003e\u003ch4\u003eServe\u003c/h4\u003e\u003cp\u003ePredict in-process; no per-request S 3 or DB access\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"small\"\u003efunctools.cache is process-local. Pre-fork loaded memory is shared via copy-on-write until pages are modified; sharing is not a guarantee of zero per-worker RAM overhead.\u003c/p\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Seven V1 artifacts · one compatible bundle\" data-bookmark=\"Seven V1 artifacts · one compatible bundle\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eSeven V 1 artifacts · one compatible bundle\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eArtifact\u003c/th\u003e\u003cth\u003eFilename\u003c/th\u003e\u003cth\u003ePurpose\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDiagnosis mapping\u003c/td\u003e\u003ctd\u003ediagnosis-dictionary.pkl\u003c/td\u003e\u003ctd\u003eICD-10 lookup\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDrug mapping\u003c/td\u003e\u003ctd\u003edruglist-dictionary.pkl\u003c/td\u003e\u003ctd\u003eMedication lookup\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNew drug mapping\u003c/td\u003e\u003ctd\u003enew-druglist-dictionary.pkl\u003c/td\u003e\u003ctd\u003eAdditional medication mapping\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSHAP\u003c/td\u003e\u003ctd\u003eexplainer 1.0.pkl\u003c/td\u003e\u003ctd\u003eFeature attribution\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModel\u003c/td\u003e\u003ctd\u003efall-risk-analysis 1.0.joblib\u003c/td\u003e\u003ctd\u003eRandom Forest prediction\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOrder\u003c/td\u003e\u003ctd\u003eorder-dictionary.pkl\u003c/td\u003e\u003ctd\u003eExact training feature order\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePreprocessing\u003c/td\u003e\u003ctd\u003epipeline-preprocess 1.0.pkl\u003c/td\u003e\u003ctd\u003eTransform features\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eS 3 prefix: \u003ccode\u003ercs-ehr-cai-s3-{env}/fallrisk/v1/\u003c/code\u003e; local cache \u003ccode\u003eapi/data/\u003c/code\u003e (prod volume \u003ccode\u003e/app/src/api/data\u003c/code\u003e). V 2 has separate pretrained/generated paths; its full bundle filenames are not enumerated in this README.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Model Artifact Management (S3)\"\u003eSource · Model Artifact Management (S 3) ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eResource planning lab\u003c/h3\u003e\u003clabel class=\"range-label\"\u003eReplicas \u003coutput id=\"replicas-label\"\u003e\u003c/output\u003e\u003cinput id=\"replicas\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"10\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eWorkers per replica \u003coutput id=\"workers-label\"\u003e\u003c/output\u003e\u003cinput id=\"workers\" type=\"range\" min=\"1\" max=\"8\" step=\"1\" value=\"2\"\u003e\u003c/label\u003e\u003clabel class=\"range-label\"\u003eMemory request per pod (GiB) \u003coutput id=\"mem-label\"\u003e\u003c/output\u003e\u003cinput id=\"mem\" type=\"range\" min=\"0.5\" max=\"8\" step=\"0.5\" value=\"4\"\u003e\u003c/label\u003e\u003cdiv id=\"resource-result\" class=\"result\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cp\u003eCPU fixed at documented 2-core request /3-core limit per replica. Memory limit remains 5 GiB for the reference; if request exceeds it, the lab flags an invalid configuration. Workers do not multiply the pod’s requested resources.\u003c/p\u003e\u003cbutton id=\"resource-reset\"\u003eRestore V 1 production config\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Production deployment snapshot\" data-bookmark=\"Production deployment snapshot\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eProduction deployment snapshot\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eProperty\u003c/th\u003e\u003cth\u003eValue\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ePod count / workers\u003c/td\u003e\u003ctd\u003e10 /2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCPU request /limit\u003c/td\u003e\u003ctd\u003e2 /3 cores per pod\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMemory request /limit\u003c/td\u003e\u003ctd\u003e4096 /5120 Mi per pod =4 /5 GiB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTotal request /limit\u003c/td\u003e\u003ctd\u003e20 /30 CPU; 40 /50 GiB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAutoscaling\u003c/td\u003e\u003ctd\u003eNo HPA configured\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePort\u003c/td\u003e\u003ctd\u003esettings default 80; local 8009; prod 8080\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIngress timeouts\u003c/td\u003e\u003ctd\u003e360 s read/send\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVolumes\u003c/td\u003e\u003ctd\u003eemptyDir at /tmp and /app/src/api/data\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eShutdown\u003c/td\u003e\u003ctd\u003eSIGTERM; Gunicorn graceful_timeout 30 s; app shutdown hook is pass\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHealth\u003c/td\u003e\u003ctd\u003eDocker 30 s healthcheck; production probes disabled\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cbutton class=\"source-link\" data-source=\"Production Resource Configuration\"\u003eSource · Production Resource Configuration ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Environment map\" data-bookmark=\"Environment map\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eEnvironment map\u003c/h3\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eVariable\u003c/th\u003e\u003cth\u003eDefault / prod / purpose\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAPI_HOST / API_PORT\u003c/td\u003e\u003ctd\u003e0.0.0.0; 80 default /8009 local /8080 prod\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_WORKERS_COUNT\u003c/td\u003e\u003ctd\u003e1 default; 2 prod; \u003e1 selects Gunicorn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_RELOAD\u003c/td\u003e\u003ctd\u003efalse; dev autoreload\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_ENVIRONMENT\u003c/td\u003e\u003ctd\u003edev default; prod/stg/qa/dev\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_LOG_LEVEL\u003c/td\u003e\u003ctd\u003eINFO default\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_S 3_BUCKET\u003c/td\u003e\u003ctd\u003eEmpty default; prod rcs-ehr-cai-s 3-prod\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_FALLRISK_OVERWRITE\u003c/td\u003e\u003ctd\u003efalse; skip existing cache; true forces refresh\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDATA_DIR\u003c/td\u003e\u003ctd\u003e/app/src/api/data in prod Helm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAWS_PROFILE / AWS_ROLE_ARN / AWS_REGION\u003c/td\u003e\u003ctd\u003eCross-account access to model S 3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDD_TRACE_ENABLED / DD_TRACE_SAMPLE_RATE\u003c/td\u003e\u003ctd\u003etrue /0.001 prod =0.1% sampling\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003efilepath_for_*\u003c/td\u003e\u003ctd\u003eLocal seven artifact paths\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_FALL_RISK_URL\u003c/td\u003e\u003ctd\u003eCaller routing switch; cutover/rollback\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAPI_ENABLE_FALL_RISK_LOGGING / API_S 3_FALL_RISK_BUCKET\u003c/td\u003e\u003ctd\u003eOrchestrator logging controls, external to this service\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eSettings use Pydantic BaseSettings with API_ prefix and an optional .env file. AWS/Datadog/DATA_DIR wiring may live outside those settings; verify branch configuration rather than assuming all variables are API-prefixed.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Runtime Configuration\"\u003eSource · Runtime Configuration ↗\u003c/button\u003e\u003c/article\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Observability\" data-bookmark=\"Observability\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eObservability\u003c/h3\u003e\u003cul\u003e\u003cli\u003eRequest trace_id → ContextVar via set_trace_id() → tagged loguru output to stdout/stderr.\u003c/li\u003e\u003cli\u003eUvicorn/Gunicorn access logs routed through loguru. Datadog ddtrace-run auto-patches supported libraries (boto 3, requests, etc.).\u003c/li\u003e\u003cli\u003eOnly application/APM logs in the service: no request/response data-capture or audit pipeline. The orchestrator can log to S 3 independently.\u003c/li\u003e\u003cli\u003eProposal: monitor batch p 50/p 95, error rates, model startup failures, RSS/PSS, CPU, invalid residents, missingness and outcome performance. Keep operational and PHI logging scopes explicit.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Observability, Tracing, and Diagnostics\"\u003eSource · Observability, Tracing, and Diagnostics ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Security and clinical governance\" data-bookmark=\"Security and clinical governance\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eSecurity and clinical governance\u003c/h3\u003e\u003cul\u003e\u003cli\u003eResident PHI is processed in memory. Private networking/ingress and IAM provide access control; app-level auth is absent.\u003c/li\u003e\u003cli\u003eCross-account IAM role scoped to artifact reads; non-root appuser UID/GID 1000; no-new-privileges.\u003c/li\u003e\u003cli\u003eContainer capability descriptions differ: introduction says all dropped; detailed table permits NET_BIND_SERVICE. Verify the actual manifest.\u003c/li\u003e\u003cli\u003eConfirm encryption, retention and access for orchestrator PHI logs and contractual rights for training data.\u003c/li\u003e\u003cli\u003eRegulatory classification, intended use and model change-control obligations are TBD. Do not claim a confirmed SaMD/CDS classification.\u003c/li\u003e\u003cli\u003eProposal: artifact provenance/checksums and trusted sources for pickle/joblib; those formats should not be loaded from untrusted inputs.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Security and Compliance Considerations\"\u003eSource · Security and Compliance Considerations ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Cutover and rollback\" data-bookmark=\"Cutover and rollback\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eCutover and rollback\u003c/h3\u003e\u003cp\u003eV 2 runs side by side as \u003ccode\u003eehr-fallrisk-v2\u003c/code\u003e with a private route, separate image and CI pipeline. Tags \u003ccode\u003edeploy-fallrisk-v2-{dev,qa,stg}-*\u003c/code\u003e are gated to \u003ccode\u003efeature/fallrisk-v2\u003c/code\u003e.\u003c/p\u003e\u003cp\u003eV 1 pipeline: \u003ccode\u003econtinuous-deployment-fallrisk-devx-eks.yml\u003c/code\u003e. V 2 pipeline: \u003ccode\u003econtinuous-deployment-fallrisk-v2-devx-eks.yml\u003c/code\u003e. Cutover changes the caller’s API_FALL_RISK_URL; rollback points back to V 1.\u003c/p\u003e\u003cp\u003eProposal: define rollback triggers before cutover, verify config propagation, audit requests by version and retain the previous artifact/service bundle.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Deployment and Rollout\"\u003eSource · Deployment and Rollout ↗\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Probe mismatch to resolve\" data-bookmark=\"Probe mismatch to resolve\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eProbe mismatch to resolve\u003c/h3\u003e\u003cp\u003eThe documented health route is \u003ccode\u003e/api/health\u003c/code\u003e, but Helm probe paths are \u003ccode\u003e/api/monitoring/health\u003c/code\u003e. Both readiness and liveness are disabled in the reviewed production values.\u003c/p\u003e\u003cp\u003eProposed fix: verify the real router, align paths, distinguish ready-to-infer from live-process state, then enable probes. Consider a startup probe for cold artifact downloads; measure timings before choosing thresholds.\u003c/p\u003e\u003cbutton class=\"source-link\" data-source=\"Startup and Container Lifecycle\"\u003eSource · Startup and Container Lifecycle ↗\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3 class=\"subhead\"\u003eIncident playbook · click to inspect\u003c/h3\u003e\u003cdiv id=\"incidents\"\u003e\u003c/div\u003e\u003carticle class=\"card searchable\"\u003e\u003cdiv class=\"card-top\"\u003e\u003cspan class=\"tag\"\u003eDocumented\u003c/span\u003e\u003cbutton class=\"bookmark\" aria-label=\"Bookmark Validation coverage and existing tests\" data-bookmark=\"Validation coverage and existing tests\"\u003e☆\u003c/button\u003e\u003c/div\u003e\u003ch3\u003eValidation coverage and existing tests\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003ePhase 1 regression:\u003c/b\u003e baseline capture → replay → CSV diff + deep JSON equality → zero output deviation as reported.\u003c/li\u003e\u003cli\u003e\u003cb\u003ePhase 2 model change:\u003c/b\u003e holdout +14-day real-world backtest; not expected to produce identical scores.\u003c/li\u003e\u003cli\u003eRecommended coverage: endpoint plain/zlib parsing, eligibility boundaries, clinical weights/recency, ML feature/preprocess/inference, all hybrid branches, download/cache and output schema.\u003c/li\u003e\u003cli\u003eExisting tests listed: test_api.py, test_process.py, test_ml_data_creators.py, test_ml_falll_utils.py. The README’s tests section and tree disagree on the test directory (api/tests vs service/tests); verify checkout.\u003c/li\u003e\u003cli\u003eProposal: performance tests across realistic batch sizes, golden feature snapshots, missing-data cases, startup failure handling and model/explainer bundle consistency.\u003c/li\u003e\u003c/ul\u003e\u003cbutton class=\"source-link\" data-source=\"Testing and Validation\"\u003eSource · Testing and Validation ↗\u003c/button\u003e\u003c/article\u003e", "interview": "\u003cdiv class=\"section-heading\"\u003e\u003cspan class=\"eyebrow\"\u003e08 / INTERVIEW WORKBENCH\u003c/span\u003e\u003ch2\u003eRecall it. Explain it. Defend it.\u003c/h2\u003e\u003cp\u003ePractice with revealable answers, confidence ratings and a timed rehearsal. Project facts are documented; ownership and achievements must come from your own experience.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eYour project narrative\u003c/h3\u003e\u003cdiv class=\"tabs\"\u003e\u003cbutton data-pitch=\"30\" class=\"selected\"\u003e30 seconds\u003c/button\u003e\u003cbutton data-pitch=\"90\"\u003e90 seconds\u003c/button\u003e\u003cbutton data-pitch=\"180\"\u003e3 minutes\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"pitch\"\u003e\u003c/div\u003e\u003cbutton id=\"copy-pitch\"\u003eCopy narrative\u003c/button\u003e\u003cp class=\"small\"\u003eService-centric template. Add “I” only for work you actually owned; the README does not establish personal contribution.\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003ePractice timer\u003c/h3\u003e\u003cdiv id=\"timer-display\" class=\"timer\"\u003e01:30\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"timer-start\" class=\"primary\"\u003eStart\u003c/button\u003e\u003cbutton id=\"timer-reset\"\u003eReset\u003c/button\u003e\u003cselect id=\"timer-length\" aria-label=\"Practice duration\"\u003e\u003coption value=\"30\"\u003e30 seconds\u003c/option\u003e\u003coption value=\"90\" selected\u003e90 seconds\u003c/option\u003e\u003coption value=\"180\"\u003e3 minutes\u003c/option\u003e\u003coption value=\"600\"\u003e10 minutes\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cp id=\"timer-prompt\"\u003eExplain the system, the V 2 trade-off and the next validation gate.\u003c/p\u003e\u003cbutton id=\"random-question\"\u003eGive me a random question\u003c/button\u003e\u003c/article\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-top\"\u003e\u003ch3\u003eQuestion bank\u003c/h3\u003e\u003cspan id=\"study-progress\" class=\"tag\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cselect id=\"question-category\" aria-label=\"Question category\"\u003e\u003coption value=\"all\"\u003eAll categories\u003c/option\u003e\u003c/select\u003e\u003cselect id=\"question-filter\" aria-label=\"Confidence filter\"\u003e\u003coption value=\"all\"\u003eAll confidence levels\u003c/option\u003e\u003coption value=\"unrated\"\u003eNot yet rated\u003c/option\u003e\u003coption value=\"review\"\u003eNeeds review\u003c/option\u003e\u003coption value=\"ready\"\u003eConfident\u003c/option\u003e\u003c/select\u003e\u003cbutton id=\"collapse-questions\"\u003eCollapse answers\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"questions\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"grid2\"\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003ePersonal evidence notebook\u003c/h3\u003e\u003cp\u003eYour notes stay in this browser when storage is available. Back up as JSON to move them across computers or browsers.\u003c/p\u003e\u003clabel class=\"field\"\u003eWhat I actually owned\u003ctextarea id=\"note-role\" rows=\"5\" placeholder=\"Scope, dates, specific PRs, decisions, collaborators and constraints…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eMeasured impact and evidence\u003ctextarea id=\"note-impact\" rows=\"5\" placeholder=\"Only verified latency, memory, regression, release or quality figures. Include baseline, dates, cohort and source…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eSTAR story and trade-offs\u003ctextarea id=\"note-story\" rows=\"6\" placeholder=\"Situation → task → action → result. What alternatives did you consider? What did you learn?…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003eLatest updates / facts to refresh\u003ctextarea id=\"note-updates\" rows=\"5\" placeholder=\"Current production version, rollout date, validation results, new metrics, open decisions…\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003cspan id=\"save-status\" class=\"small\" role=\"status\"\u003e\u003c/span\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton id=\"export-notes\"\u003eExport notes + progress\u003c/button\u003e\u003cbutton id=\"import-notes\"\u003eImport backup\u003c/button\u003e\u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden\u003e\u003c/div\u003e\u003c/article\u003e\u003carticle class=\"card\"\u003e\u003ch3\u003eBefore the next interview\u003c/h3\u003e\u003cdiv id=\"checklist\"\u003e\u003c/div\u003e\u003ch4\u003eUnknowns to fill with evidence\u003c/h4\u003e\u003cul\u003e\u003cli\u003eActive customers/facilities and residents scored per day\u003c/li\u003e\u003cli\u003eBatch p 50/p 95 and 5 xx error rate\u003c/li\u003e\u003cli\u003eStaging V 2 RSS/PSS, startup and CPU measurements\u003c/li\u003e\u003cli\u003eMonthly infrastructure cost\u003c/li\u003e\u003cli\u003eLatest production cutover decision and operating point\u003c/li\u003e\u003cli\u003eRegulatory/clinical sign-off and subgroup results\u003c/li\u003e\u003cli\u003eVerified personal ownership and concrete artifacts\u003c/li\u003e\u003c/ul\u003e\u003cp class=\"small\
